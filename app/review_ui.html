<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>clpr review surface</title>
  <style>
    :root {
      --bg: #111317;
      --panel: #1a1f27;
      --panel2: #232b36;
      --text: #e6edf3;
      --muted: #9aa6b2;
      --ok: #2ea043;
      --bad: #f85149;
      --maybe: #d29922;
      --accent: #58a6ff;
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif; }
    /* D-056 scroll fix: the layout is pinned to the viewport (height + an
       explicit 100% row so the single grid row cannot grow past it); each
       pane scrolls independently, so the player pane stays on screen while
       the list scrolls. The page itself never scrolls. */
    .wrap { display: grid; grid-template-columns: 380px 1fr; grid-template-rows: 100%; height: 100vh; }
    .left { border-right: 1px solid #2d333b; overflow-y: auto; }
    .right { padding: 16px; overflow-y: auto; }
    .head { position: sticky; top: 0; background: var(--panel); z-index: 2; padding: 12px; border-bottom: 1px solid #2d333b; }
    .title { margin: 0; font-size: 16px; }
    .kbd { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .list { padding: 8px; }
    .item { padding: 10px; border: 1px solid #2d333b; border-radius: 8px; margin-bottom: 8px; background: var(--panel); cursor: pointer; }
    .item.active { outline: 2px solid var(--accent); background: var(--panel2); }
    .row { display: flex; justify-content: space-between; gap: 8px; }
    .score { font-weight: 700; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .empty { padding: 12px; color: var(--muted); }
    .empty.error { color: var(--bad); border: 1px dashed var(--bad); border-radius: 8px; font-weight: 600; }
    .card { border: 1px solid #2d333b; border-radius: 10px; background: var(--panel); padding: 12px; }
    .actions { display: flex; gap: 8px; margin: 10px 0 12px; }
    .tabs { display: flex; gap: 8px; margin-top: 8px; }
    button { border: 0; padding: 9px 14px; border-radius: 8px; color: white; cursor: pointer;
             font-weight: 600; font-size: 12.5px; font-family: inherit; line-height: 1.2;
             transition: filter .12s, box-shadow .12s; }
    button:hover:not(:disabled) { filter: brightness(1.12); }
    button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(88,166,255,.35); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .approve { background: var(--ok); }
    .reject { background: var(--bad); }
    .maybe { background: var(--maybe); }
    .tab { background: #2d333b; color: var(--text); border: 1px solid #3d444d; }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #061326; }
    .hint { color: var(--muted); font-size: 12px; }
    .editpanel { border: 1px solid #2d333b; border-radius: 8px; background: var(--panel2); padding: 10px; margin: 0 0 12px; }
    .editrow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .editrow:last-child { margin-bottom: 0; }
    .editlabel { color: var(--muted); font-size: 12px; width: 40px; }
    .editval { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 76px; text-align: center; }
    .nudge { background: #2d333b; border: 1px solid #3d444d; color: var(--text); padding: 6px 10px; font-weight: 600; }
    .replaywin { background: #2d333b; border: 1px solid #3d444d; color: var(--text); }
    .savewin { background: var(--accent); color: #061326; }
    .resetwin { background: #2d333b; border: 1px solid #3d444d; color: var(--text); }
    .badge { background: var(--maybe); color: #061326; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; vertical-align: middle; }
    .dbadge { background: var(--ok); color: #061326; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; vertical-align: middle; }
    .dbadge.warn { background: var(--bad); color: #fff; }
    .unsaved { color: var(--maybe); font-size: 12px; font-weight: 700; }
    .winline { font-size: 13px; margin: 0 0 10px; }
    .winline .orig { color: var(--muted); font-size: 12px; }
    video { width: 100%; max-height: 65vh; background: #000; border-radius: 8px; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--muted); }

    /* ---------------------------------------------------------------- D-061
       THE POST KIT. The system SUGGESTS copy and NEVER burns text into video:
       every hook below is a CSS overlay painted on top of a <video> element,
       so what the operator sees is a MOCKUP of the post he is about to make,
       and the delivered .mp4 in Drive is never touched. Nothing here writes to
       a canvas, draws into the video, or produces a new media file. */
    .kitgrid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
    @media (max-width: 1100px) { .kitgrid { grid-template-columns: 1fr; } }

    /* The phone frame: a real 9:16 box, the aspect the platforms actually
       render, so "is this frame majority text?" is judgeable by eye. */
    .phone { position: relative; width: 300px; aspect-ratio: 9 / 16; background: #000;
             border-radius: 22px; overflow: hidden; border: 2px solid #3d444d; }
    .phone video { position: absolute; inset: 0; width: 100%; height: 100%;
                   max-height: none; object-fit: cover; border-radius: 0; background: #000; }
    .phone .missing { position: absolute; inset: 0; display: flex; align-items: center;
                      justify-content: center; text-align: center; padding: 16px;
                      color: var(--muted); font-size: 12px; }
    /* Guides for the regions the platform's OWN UI covers. Dashed, subtle, and
       toggleable — they are a judging aid, not part of the post. */
    .guide { position: absolute; border: 1px dashed rgba(255,255,255,.28); pointer-events: none; }
    .guide.top { left: 0; right: 0; top: 0; height: 12%; }
    .guide.bottom { left: 0; right: 0; bottom: 0; height: 22%; }
    .guide.rail { right: 0; top: 40%; bottom: 22%; width: 16%; }
    .guidelabel { position: absolute; font-size: 9px; color: rgba(255,255,255,.5);
                  pointer-events: none; letter-spacing: .04em; }
    /* The overlay band the hook is painted in: inset from the right rail and
       clear of the top bar, i.e. the platform safe area. */
    /* Centred horizontally: the right edge is inset to match the left rather
       than reserving the platform's right-hand action rail, because the hook is
       typed into the platform's own text tool and the operator centres it there.
       justify-content centres the band, text-align centres the wrapped lines
       inside it -- both are needed or a two-line hook centres the box but rags
       its second line. */
    .hookband { position: absolute; left: 6%; right: 6%; top: 16%; pointer-events: none;
                display: flex; justify-content: center; }
    .hooktext { font-weight: 800; font-size: 17px; line-height: 1.22; color: #fff;
                background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 6px;
                text-shadow: 0 1px 3px rgba(0,0,0,.9); word-break: break-word;
                text-align: center; }
    .hooktext.empty { background: rgba(248,81,73,.25); color: #ffb4b0; font-weight: 600; font-size: 13px; }
    /* The post as it reads below the video, so the caption is judged in place. */
    /* The post as it reads under the video. Given the same card treatment as
       the phone so the left column is two deliberate objects, not a frame with
       loose text hanging off it. */
    .postmeta { width: 300px; margin-top: 12px; font-size: 12.5px; color: var(--text);
                box-sizing: border-box; background: var(--panel2); border: 1px solid #2a3039;
                border-radius: 10px; padding: 12px 14px; line-height: 1.5; }
    .postmeta .handle { font-weight: 700; margin-bottom: 6px; letter-spacing: .01em; }
    .postmeta .cap { color: #c9d1d9; white-space: pre-wrap; word-break: break-word; }
    .postmeta .tags { color: var(--accent); margin-top: 6px; word-break: break-word; }
    .coverage { margin-top: 10px; font-size: 11.5px; color: var(--muted); line-height: 1.5;
                max-width: 300px; }
    .coverage b { color: var(--text); font-variant-numeric: tabular-nums; }
    .coverage.warn b { color: var(--maybe); }
    .coverage.bad b { color: var(--bad); }

    /* ---- POST KIT SURFACE -------------------------------------------------
       Design intent: the COPY the operator is about to publish is the content;
       everything explaining it is apparatus. Previously both were 11-13px and
       the apparatus ran the full column width, so the page read as one grey
       wall. Three levers fix it, in order of effect:
         1. MEASURE. Explanatory text is capped at 78ch. Long lines are the
            single biggest reason dense UI reads as unfinished.
         2. WEIGHT. Copy fields are 14px on a near-black field; rationale is
            11.5px at lower contrast. The eye now sorts them without reading.
         3. RHYTHM. One spacing scale (6/10/14/18) instead of ad-hoc 2/4/6/8px,
            so blocks look deliberate rather than nudged. */
    .kitblock { border: 1px solid #2a3039; border-radius: 10px; background: var(--panel2);
                padding: 16px 18px; margin-bottom: 14px; }
    .kitblock h3 { margin: 0 0 4px; font-size: 13px; font-weight: 700;
                   letter-spacing: .01em; color: var(--text); }
    .kitblock .why { color: #8b949e; font-size: 11.5px; line-height: 1.55;
                     margin: 0 0 14px; max-width: 78ch; }

    /* Variant rows: the label is a fixed-width chip so all three copy lines
       start at the same x. Ragged left edges were most of why this looked
       hand-assembled. */
    .variant { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .variant .pick { background: #262d36; border: 1px solid #39414b; color: var(--text);
                     padding: 8px 10px; font-size: 11.5px; border-radius: 7px;
                     min-width: 124px; text-align: left; line-height: 1.25;
                     flex: 0 0 auto; cursor: pointer; transition: background .12s, border-color .12s; }
    .variant .pick:hover { border-color: #4d5765; background: #2b333d; }
    .variant .pick.on { background: var(--accent); border-color: var(--accent);
                        color: #061326; font-weight: 700; }
    .variant input[type=text] { flex: 1 1 auto; }

    .copybtn { background: #262d36; border: 1px solid #39414b; color: var(--text);
               padding: 8px 12px; font-size: 11.5px; border-radius: 7px; cursor: pointer;
               flex: 0 0 auto; transition: background .12s, border-color .12s; }
    .copybtn:hover { border-color: #4d5765; background: #2b333d; }
    .copybtn.done { background: var(--ok); color: #061326; border-color: var(--ok); }

    textarea, input[type=text] { width: 100%; box-sizing: border-box; background: #0d1117;
        color: var(--text); border: 1px solid #39414b; border-radius: 7px; padding: 9px 11px;
        font-family: inherit; font-size: 14px; line-height: 1.5; resize: vertical;
        transition: border-color .12s, box-shadow .12s; }
    textarea:focus, input[type=text]:focus { outline: none; border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(88,166,255,.15); }
    textarea::placeholder, input[type=text]::placeholder { color: #5b636d; }
    textarea.srt { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px;
                   line-height: 1.6; }

    .kitmeta { color: #7d8590; font-size: 11.5px; line-height: 1.55; margin-top: 8px;
               max-width: 78ch; }
    .kitmeta.warn { color: var(--maybe); }
    .kitmeta.bad { color: var(--bad); }
    .stamp { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 4px;
             padding: 1px 6px; }
    .stamp.machine { background: var(--maybe); color: #061326; }
    .stamp.operator { background: var(--ok); color: #061326; }
    .stamp.none { background: #3d444d; color: var(--text); }
    .stamp.failed { background: var(--bad); color: #fff; }
    .emptykit { border: 1px dashed var(--bad); border-radius: 8px; padding: 14px;
                color: var(--muted); font-size: 13px; }
    .emptykit b { color: var(--text); }
    .genrow { display: flex; align-items: center; gap: 6px; font-size: 12px;
              color: var(--muted); margin: 0 0 10px; }
    .genrow input { width: 14px; height: 14px; }
    .ctxbox { border: 1px solid #2d333b; border-radius: 8px; background: var(--panel);
              padding: 10px; margin-bottom: 10px; }
    .histrow { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
               border-top: 1px solid #2d333b; padding: 4px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="left">
      <div class="head">
        <h1 id="queueTitle" class="title">Pending candidates</h1>
        <div class="tabs">
          <button id="tabPending" class="tab active">Pending</button>
          <button id="tabMaybe" class="tab">Maybe</button>
          <button id="tabRejected" class="tab">Rejected</button>
          <button id="tabDelivered" class="tab">Post kit</button>
        </div>
        <div class="kbd">Keys: j/k or arrows = move | a = approve | r = reject (not in Rejected) | m = maybe (Pending/Rejected) | x = toggle Rejected queue (keys are inert while typing in a field)</div>
      </div>
      <div id="list" class="list"></div>
    </aside>

    <main class="right">
      <div id="detail" class="card">
        <div class="empty">Loading...</div>
      </div>
    </main>
  </div>

  <script>
    let candidates = [];
    let idx = 0;
    let view = 'pending';
    // D-056: mutation generation — bumped by every user-driven mutation so an
    // in-flight background poll can never clobber what the operator just did.
    let gen = 0;
    // D-055: local (unsaved) window edits, keyed by candidate id: {start, end}.
    // A draft exists only while nudged-but-not-saved; Save/Reset clears it.
    const drafts = {};
    // F6 fixer: a server error (5xx) or an unexpected (non-array) 200 body
    // must NOT be coerced into "zero candidates" — that renders as a
    // permanent, indistinguishable "No X candidates" precisely when the
    // guard that produced the error matters most. Set by loadCandidates,
    // read by renderList/renderDetail; null means no error, render normally.
    let listError = null;

    const listEl = document.getElementById('list');
    const leftEl = document.querySelector('.left');
    const detailEl = document.getElementById('detail');
    const queueTitleEl = document.getElementById('queueTitle');
    const tabPendingEl = document.getElementById('tabPending');
    const tabMaybeEl = document.getElementById('tabMaybe');
    const tabRejectedEl = document.getElementById('tabRejected');
    const tabDeliveredEl = document.getElementById('tabDelivered');

    // D-061 post kit state.
    // kitDrafts: unsaved operator edits, keyed by candidate id. Same discipline
    // as the D-055 window drafts — an unsaved edit blocks the actions that
    // would destroy it, and a background poll never re-renders over it.
    const kitDrafts = {};
    // The selected on-video variant per candidate. LOCAL until saved: clicking
    // between variants re-paints the overlay live and writes nothing. The
    // choice is persisted only by Save, as part of the version he was reading
    // (a ruling binds to what was DISPLAYED).
    const hookPick = {};
    // The chosen subject_kind per recording, LOCAL until saved.
    const subjectPick = {};
    let profileState = null;   // the ACTIVE creator_profile row, or null
    let showGuides = true;

    function fmt(v, n = 3) {
      if (v === null || v === undefined) return 'null';
      if (typeof v === 'number') return v.toFixed(n);
      return String(v);
    }

    // D-055 window helpers. EFFECTIVE window = COALESCE(adjusted, original);
    // originals are immutable and only ever shown for reference.
    function hasAdjustment(c) {
      return (c.adjusted_start_s !== null && c.adjusted_start_s !== undefined)
          || (c.adjusted_end_s !== null && c.adjusted_end_s !== undefined);
    }

    function effectiveWindow(c) {
      return {
        start: (c.adjusted_start_s ?? c.start_s),
        end: (c.adjusted_end_s ?? c.end_s),
      };
    }

    function adjustedDiffers(c) {
      if (!hasAdjustment(c)) return false;
      const eff = effectiveWindow(c);
      return eff.start !== c.start_s || eff.end !== c.end_s;
    }

    // The editor's current values: the unsaved draft when one exists,
    // else the saved effective window.
    function editorValues(c) {
      const d = drafts[c.id];
      if (d) return { start: d.start, end: d.end };
      return effectiveWindow(c);
    }

    function hasUnsaved(c) {
      const d = drafts[c.id];
      if (!d) return false;
      const eff = effectiveWindow(c);
      return d.start !== eff.start || d.end !== eff.end;
    }

    // D-056: pending now carries approved-but-undelivered cards (the server
    // keeps them in the pending payload until a clips row gains drive_synced_at,
    // the delivery witness). The badge keys on clip_state/drive_synced_at plus
    // the local-only _webhook flag decide() sets when the verdict response
    // reported the delivery webhook failed/unconfigured. Precedence: a clips
    // row means delivery has started, so it outranks a stale webhook flag.
    // D-056 fixer (charter under-claim default): the badge NEVER asserts an
    // upload is in progress — nothing in the payload witnesses a running
    // upload. A clips row only proves the render lane reached this candidate,
    // so report the clip_state itself: 'rendered' means the file exists and
    // delivery has not been witnessed yet ("awaiting upload"), and any other
    // clip_state is reported verbatim rather than narrated. The old text
    // ("APPROVED — {clip_state} — uploading") over-claimed in both
    // directions: 'published — uploading' was incoherent, and 'rendered —
    // uploading' asserted an upload nobody had observed.
    function deliveryBadge(c) {
      if (c.state !== 'approved') return '';
      if (c.clip_state !== null && c.clip_state !== undefined) {
        if (c.clip_state === 'rendered') return 'rendered — awaiting upload';
        return `approved — ${c.clip_state}`;
      }
      if (c._webhook === 'failed') return 'delivery not started — webhook failed';
      if (c._webhook === 'unconfigured') return 'delivery not started — webhook unconfigured';
      return 'approved — awaiting delivery';
    }

    function deliveryBadgeHtml(c) {
      const text = deliveryBadge(c);
      if (!text) return '';
      const warn = text.startsWith('delivery not started');
      return `<span class="dbadge${warn ? ' warn' : ''}">${text}</span>`;
    }

    // F6 fixer: webhook outcomes recorded on an APPROVE persist here, keyed by
    // candidate id, independent of which VIEW is currently loaded. The old
    // carry-forward lived only inside pollRefresh and read _webhook off the
    // CURRENT view's in-memory rows — so approving from maybe/rejected (which
    // immediately removes the card from that view's list) discarded the
    // outcome before the card ever reappeared in pending. This is the single
    // place decide()/loadCandidates()/pollRefresh() all read and write it.
    const webhookFlags = {};

    // Attach (or clear) the persisted webhook flag on one fresh row. A clips
    // row (clip_state present) means delivery has started, so it outranks and
    // clears a stale flag — same precedence deliveryBadge() already applies.
    function applyWebhookFlag(row) {
      const rendered = !(row.clip_state === null || row.clip_state === undefined);
      if (rendered) {
        delete webhookFlags[row.id];
        return;
      }
      if (webhookFlags[row.id]) row._webhook = webhookFlags[row.id];
    }

    function endpointForView() {
      if (view === 'maybe') return '/api/candidates/maybe';
      if (view === 'rejected') return '/api/candidates/rejected';
      if (view === 'delivered') return '/api/candidates/delivered';
      return '/api/candidates';
    }

    function titleForView() {
      if (view === 'maybe') return 'Maybe candidates';
      if (view === 'rejected') return 'Rejected candidates';
      if (view === 'delivered') return 'Post kit (delivered clips)';
      return 'Pending candidates';
    }

    function labelForView() {
      if (view === 'maybe') return 'maybe';
      if (view === 'rejected') return 'rejected';
      if (view === 'delivered') return 'delivered';
      return 'pending';
    }

    // F6 fixer: a server error status or an unexpected (non-array) 200 body
    // must render as a visible error, not silently paint the same
    // "No X candidates" state as a genuinely empty queue. (A raw fetch()
    // rejection is a separate path — see the NOTE in loadCandidates below —
    // and never reaches this function.)
    function showListError(msg) {
      listError = msg;
      candidates = [];
      idx = 0;
      renderTabs();
      renderList();
      renderDetail();
    }

    async function loadCandidates() {
      // The post kit view renders the standing profile next to the copy it
      // produced, so it must be loaded before the first paint.
      if (view === 'delivered' && profileState === null) await loadProfile();
      // NOTE: a raw connection drop here (fetch() itself rejecting) is left
      // to propagate to the caller — every call site already wraps this in
      // .catch(...) and paints "Failed to load candidates" (that path is not
      // muffled today; do not add a second mechanism for it). This function
      // only handles the two ways a response that DID land can still lie
      // about being an empty queue: an explicit error status, and a 200 body
      // that is not the array shape every caller assumes.
      const res = await fetch(endpointForView(), { cache: 'no-store' });
      let data = null;
      try { data = await res.json(); } catch (_) { /* non-JSON body — handled below */ }
      if (!res.ok) {
        const msg = (data && typeof data === 'object' && data.error) ? data.error : `HTTP ${res.status}`;
        showListError(`Failed to load ${labelForView()} candidates: ${msg}`);
        return;
      }
      if (!Array.isArray(data)) {
        showListError(`Failed to load ${labelForView()} candidates: server returned an unexpected (non-list) response.`);
        return;
      }
      listError = null;
      candidates = data;
      candidates.forEach(applyWebhookFlag);
      if (idx >= candidates.length) idx = Math.max(0, candidates.length - 1);
      renderTabs();
      renderList();
      renderDetail();
    }

    function renderTabs() {
      queueTitleEl.textContent = titleForView();
      tabPendingEl.classList.toggle('active', view === 'pending');
      tabMaybeEl.classList.toggle('active', view === 'maybe');
      tabRejectedEl.classList.toggle('active', view === 'rejected');
      tabDeliveredEl.classList.toggle('active', view === 'delivered');
    }

    function renderList() {
      listEl.innerHTML = '';
      if (listError) {
        listEl.innerHTML = `<div class="empty error">${esc(listError)}</div>`;
        return;
      }
      if (!candidates.length) {
        listEl.innerHTML = `<div class="empty">No ${labelForView()} candidates.</div>`;
        return;
      }
      candidates.forEach((c, i) => {
        const el = document.createElement('div');
        el.className = 'item' + (i === idx ? ' active' : '');
        el.onclick = () => { idx = i; renderList(); renderDetail(); };
        el.innerHTML = `
          <div class="row">
            <div>#${c.id} | vod ${c.vod_id}</div>
            <div class="score">${fmt(c.score)}</div>
          </div>
          <div class="meta">${c.session_label} | ${fmt(effectiveWindow(c).start,1)}s to ${fmt(effectiveWindow(c).end,1)}s${adjustedDiffers(c) ? ' | edited' : ''}</div>
          <div class="meta">audio ${fmt(c.signal_audio)} | transcript ${fmt(c.signal_transcript)} | chat ${fmt(c.signal_chat)} | beat ${fmt(c.signal_beat_boost)}</div>
          ${view === 'delivered'
            ? `<div class="meta">${kitStampHtml(c)}${kitHasUnsaved(c) ? ' <span class="unsaved">unsaved</span>' : ''}</div>`
            : (deliveryBadgeHtml(c) ? `<div class="meta">${deliveryBadgeHtml(c)}</div>` : '')}
          ${view !== 'delivered' && c.post_kit_enabled === 0 ? '<div class="meta">post kit: OFF</div>' : ''}
          ${captionsChipHtml(c)}
        `;
        listEl.appendChild(el);
      });
    }

    // D-063 card chip. The post kit's chip shows when it is OFF because it
    // defaults ON. Captions default OFF, so the chip shows when it is ON — the
    // chip always marks the NON-default state, which is the one worth a glance.
    // On a delivered card the chip reports the FILE, never the toggle: that is
    // the only fact a delivered clip has.
    function captionsChipHtml(c) {
      const rendered = !(c.clip_state === null || c.clip_state === undefined);
      if (rendered && c.captions_burned === 1) return '<div class="meta">captions: BURNED IN</div>';
      // Asked for, and the window holds no speech. An honest outcome, not a
      // shortfall, and NOT something a later render would change.
      if (rendered && c.captions_requested === 1 && c.captions_cue_count === 0) {
        return '<div class="meta">captions: none (no speech in this window)</div>';
      }
      // D-063 fixer: a DELIVERED clip is delivered, full stop (D-056) — there
      // is no next render for it, so promising one on its card was a claim
      // about work that will never happen.
      if (c.drive_synced_at) {
        return c.burn_captions === 1
          ? '<div class="meta">captions: ON, but this delivered file has none</div>'
          : '';
      }
      if (c.burn_captions === 1) return '<div class="meta">captions: ON (next render)</div>';
      return '';
    }

    // ------------------------------------------------------------- D-061/D-062
    // THE POST KIT. Three distinct things per delivered clip, in the
    // operator's own vocabulary:
    //   on-video text  — the hook he types into the platform's text tool
    //   captions       — the real speech transcription, as an SRT file
    //   video caption  — the post descriptor, plus MINIMAL hashtags
    // Nothing here is burned into the video and nothing auto-posts: the
    // operator is the publish gate (D-002) and this surface only suggests.
    // Field names are the schema's (migrations_pg/003_post_kits.sql), not
    // invented ones, so the surface and the generator cannot drift apart.

    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // A kit EXISTS only when the server sent a version number. Null kit_version
    // means no ACTIVE post_kits row at all, which the UI must render as
    // MISSING — a kit whose fields are merely blank is a different thing, and
    // the schema forbids it anyway (the hooks and caption are NOT NULL).
    function hasKit(c) {
      return c.kit_version !== null && c.kit_version !== undefined;
    }

    // A regenerate request is OUTSTANDING while no NEWER kit version has
    // landed. Integer comparison against the version that was active when he
    // asked — no timestamps are compared anywhere (charter gate 21).
    function regenPending(c) {
      if (c.request_state !== 'requested') return false;
      const asked = Number(c.active_version_at_request ?? 0);
      const now = Number(c.kit_version ?? 0);
      return now <= asked;
    }

    function kitStampHtml(c) {
      let parts = [];
      if (!hasKit(c)) {
        parts.push('<span class="stamp none">no kit yet</span>');
      } else if (c.kit_origin === 'operator_edit') {
        parts.push(`<span class="stamp operator">v${c.kit_version} EDITED BY YOU</span>`);
      } else {
        parts.push(`<span class="stamp machine">v${c.kit_version} MACHINE DRAFT, NOT REVIEWED</span>`);
      }
      if (c.request_state === 'failed') {
        parts.push('<span class="stamp failed">generation FAILED</span>');
      } else if (regenPending(c)) {
        parts.push('<span class="stamp none">regenerate requested</span>');
      }
      return parts.join(' ');
    }

    // The editor's current values: the unsaved draft when one exists, else the
    // active version's own fields.
    function kitValues(c) {
      const d = kitDrafts[c.id];
      if (d) return d;
      return {
        hook_withheld: c.hook_withheld ?? '',
        hook_domain: c.hook_domain ?? '',
        hook_payoff: c.hook_payoff ?? '',
        video_caption: c.video_caption ?? '',
        hashtags: Array.isArray(c.hashtags) ? c.hashtags.join(' ') : (c.hashtags ?? ''),
        srt_text: c.srt_text ?? '',
      };
    }

    function kitSaved(c) {
      return {
        hook_withheld: c.hook_withheld ?? '',
        hook_domain: c.hook_domain ?? '',
        hook_payoff: c.hook_payoff ?? '',
        video_caption: c.video_caption ?? '',
        hashtags: Array.isArray(c.hashtags) ? c.hashtags.join(' ') : (c.hashtags ?? ''),
        srt_text: c.srt_text ?? '',
      };
    }

    function kitHasUnsaved(c) {
      const d = kitDrafts[c.id];
      if (!d) return false;
      const saved = kitSaved(c);
      return Object.keys(saved).some((k) => (d[k] ?? '') !== saved[k]);
    }

    const HOOK_FIELDS = {
      withheld: 'hook_withheld',
      domain: 'hook_domain',
      payoff: 'hook_payoff',
    };

    function selectedHookKey(c) {
      return hookPick[c.id] || 'withheld';
    }

    function hookTextFor(c, key) {
      const v = kitValues(c);
      return (v[HOOK_FIELDS[key]] || '').trim();
    }

    async function copyText(text, btn) {
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (_) {
        // http://127.0.0.1 is a secure context, but keep a fallback rather
        // than silently failing to copy the thing he came here to paste.
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ok = document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (__) { ok = false; }
      }
      if (btn) {
        const old = btn.textContent;
        btn.textContent = ok ? 'copied' : 'copy failed';
        btn.classList.toggle('done', ok);
        setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1200);
      }
    }

    // MEASURE what is actually painted, so "is this frame majority text?" is a
    // number rather than a feeling. Instagram officially demotes reels that are
    // majority text, so the mockup exists to make that judgeable BEFORE he
    // posts. This measures the rendered hook box against the frame box — the
    // DOM as drawn, not an estimate from character counts.
    function updateCoverage() {
      const frame = document.getElementById('phoneFrame');
      const span = document.getElementById('hookText');
      const out = document.getElementById('coverage');
      if (!frame || !out) return;
      const fr = frame.getBoundingClientRect();
      const frameArea = fr.width * fr.height;
      let pct = 0;
      if (span && frameArea > 0) {
        const sr = span.getBoundingClientRect();
        pct = (sr.width * sr.height) / frameArea * 100;
      }
      out.classList.remove('warn', 'bad');
      let verdict = 'well under the majority-text line';
      if (pct >= 50) { out.classList.add('bad'); verdict = 'MAJORITY TEXT — Instagram demotes this'; }
      else if (pct >= 30) { out.classList.add('warn'); verdict = 'getting text-heavy'; }
      out.innerHTML = `hook covers <b>${pct.toFixed(1)}%</b> of the frame — ${esc(verdict)}`;
    }

    function repaintOverlay() {
      const c = candidates[idx];
      if (!c) return;
      const span = document.getElementById('hookText');
      if (!span) return;
      const key = selectedHookKey(c);
      const text = hookTextFor(c, key);
      span.textContent = text || 'no hook in this variant';
      span.classList.toggle('empty', !text);
      const wordCount = text ? text.split(/\s+/).filter(Boolean).length : 0;
      const wc = document.getElementById('hookWords');
      if (wc) {
        wc.className = 'kitmeta' + (wordCount > 20 ? ' bad' : (wordCount > 12 ? ' warn' : ''));
        wc.textContent = text
          ? `${wordCount} words. TikTok's own guidance is 5-10 words per second of reading, so a hook read in the first 2 seconds is 10-20 words MAXIMUM, and shorter is safer.`
          : 'this variant is empty.';
      }
      document.querySelectorAll('.variant .pick').forEach((b) => {
        b.classList.toggle('on', b.dataset.hook === key);
      });
      updateCoverage();
    }

    function captionsPanel(c) {
      if (!c.srt_text) {
        return `<div class="kitmeta bad">No captions in this kit. The builder writes no SRT rather
          than an empty one when the window holds no transcript segments.</div>`;
      }
      const basis = c.srt_basis
        ? `rebased from the <b>${esc(c.srt_basis)}</b> witness (clip t=0 at ${fmt(c.srt_clip_t0_abs_s, 1)}s of the recording)`
        : 'basis not recorded';
      return `
        <div class="kitmeta">${c.srt_segment_count} segments | ${basis}</div>
        <textarea class="srt" data-field="srt_text" rows="6" placeholder="captions">${esc(kitValues(c).srt_text)}</textarea>
        <div class="kitmeta">Edit only if whisper misheard something. The timings were computed from the
          renderer that actually shipped this file, not guessed.</div>`;
    }

    function profilePanel(c) {
      const p = profileState;
      const kitProfileV = c.kit_profile_version;
      const kitCtxV = c.kit_recording_context_version;
      // Staleness is an INTEGER comparison against the version this kit was
      // written against, not a timestamp: post_kits records the exact profile
      // and context versions it used.
      const profileStale = (p && hasKit(c) && kitProfileV !== null && kitProfileV !== undefined
                            && Number(p.version) > Number(kitProfileV));
      const ctxStale = (c.context_version !== null && c.context_version !== undefined
                        && hasKit(c) && kitCtxV !== null && kitCtxV !== undefined
                        && Number(c.context_version) > Number(kitCtxV));
      const f = (k) => esc(p ? (p[k] ?? '') : '');
      const subjKind = c.subject_kind || '';
      return `
        <div class="ctxbox">
          <h3 style="margin:0 0 2px;font-size:13px;">Context that produced this kit</h3>
          <p class="why">The generator sees exactly this. If it is wrong or stale, the copy is wrong.</p>
          <div class="kitmeta${profileStale ? ' warn' : ''}">
            global profile ${p ? 'v' + esc(p.version) + ', saved ' + esc(p.created_at) : 'NEVER SET'}
            ${hasKit(c) ? ' | this kit was written against ' + (kitProfileV === null || kitProfileV === undefined ? 'NO profile' : 'v' + esc(kitProfileV)) : ''}
            ${profileStale ? ' — THE PROFILE CHANGED AFTER THIS KIT WAS GENERATED, so this copy predates it' : ''}
          </div>
          <input type="text" id="pfChannel" placeholder="channel name" value="${f('channel_name')}" />
          <input type="text" id="pfHandle" placeholder="handle" value="${f('handle')}" />
          <input type="text" id="pfPlatforms" placeholder="platforms, e.g. instagram reels, tiktok" value="${f('platforms')}" />
          <textarea id="pfStyle" rows="2" placeholder="style and tone the copy should sound like">${f('style_notes')}</textarea>
          <textarea id="pfDoNots" rows="2" placeholder="hard avoids, stated plainly">${f('do_nots')}</textarea>
          <textarea id="pfExtra" rows="2" placeholder="anything else the writer should know">${f('extra_context')}</textarea>
          <div class="editrow" style="margin-top:6px;">
            <button class="savewin" id="btnSaveProfile">Save profile (new version)</button>
            <span class="hint">edit once, applies to every clip</span>
          </div>

          <div class="kitmeta${ctxStale ? ' warn' : ''}" style="margin-top:12px;">
            SUBJECT of recording ${c.vod_id} (${esc(c.session_label)}) — who the clip is about
            ${c.context_version ? ' | context v' + esc(c.context_version) : ' | NOT SET (the generator treats this as UNKNOWN, never as you)'}
            ${ctxStale ? ' — CHANGED AFTER THIS KIT WAS GENERATED' : ''}
          </div>
          <div class="editrow">
            <button class="pick${subjKind === 'me' ? ' on' : ''}" id="btnSubjMe">me</button>
            <button class="pick${subjKind === 'other' ? ' on' : ''}" id="btnSubjOther">someone else</button>
            <input type="text" id="subjText" placeholder="who is on screen, e.g. a DJ guesting on the IRL stream"
                   value="${esc(c.subject_text || '')}" />
          </div>
          <textarea id="ctxNotes" rows="2" placeholder="what this recording was, in your words">${esc(c.context_notes || '')}</textarea>
          <div class="editrow" style="margin-top:6px;">
            <button class="savewin" id="btnSaveSubj">Save subject (new version)</button>
          </div>
          <div class="kitmeta"><b>me</b> pulls your full profile in as the speaker. <b>someone else</b>
            requires a description, so your personal profile is never applied to them.</div>
        </div>`;
    }

    function renderKitDetail(c) {
      const kit = hasKit(c);
      const v = kitValues(c);
      const key = selectedHookKey(c);
      const hookText = hookTextFor(c, key);
      const tagCount = (v.hashtags || '').split(/\s+/).filter(Boolean).length;
      const variantLabel = {
        withheld: 'A - withholds',
        domain: 'B - names the domain',
        payoff: 'C - names the payoff',
      };

      const missingPanel = `
        <div class="emptykit">
          ${c.request_state === 'failed'
            ? `<b>GENERATION FAILED</b>${c.request_requested_at ? ' (requested ' + esc(c.request_requested_at) + ')' : ''}.<br />
               <span class="kitmeta bad">${esc(c.request_error || 'no reason recorded')}</span><br />
               Nothing was written: a failed run persists no partial kit. Regenerate to try again.`
            : `<b>NO KIT YET.</b> This clip is delivered, but the generator has not produced copy for it.
               This is missing, not empty.
               ${c.post_kit_enabled === 0 ? '<br />Post kit generation is switched <b>OFF</b> for this clip.' : ''}
               ${regenPending(c) ? '<br />A regenerate was requested at ' + esc(c.request_requested_at) + ' and has not been answered yet.' : ''}`}
        </div>`;

      const copyBlocks = !kit ? missingPanel : `
        <div class="kitblock">
          <h3>1. On-video text — the hook you type into the platform's text tool</h3>
          <p class="why">One short line. Instagram officially demotes reels that are majority text, so the
            mockup on the left is the check: if the frame reads as text, cut words.
            The three variants are deliberately spread along the concreteness axis, not three rewordings
            of one idea (a meta-analysis of 8,977 headline experiments found 50.9% of headlines got WORSE
            when made more concrete and only 8.7% better, so the right level is not knowable in advance).
            No controlled evidence exists on question-versus-statement hooks, so neither is preferred here.</p>
          ${['withheld', 'domain', 'payoff'].map((k) => `
            <div class="variant">
              <button class="pick${k === key ? ' on' : ''}" data-hook="${k}" title="show this one in the mockup">${esc(variantLabel[k])}</button>
              <textarea data-field="${HOOK_FIELDS[k]}" rows="2" placeholder="required">${esc(v[HOOK_FIELDS[k]])}</textarea>
              <button class="copybtn" data-copy="${HOOK_FIELDS[k]}">copy</button>
            </div>`).join('')}
          <div class="kitmeta" id="hookWords"></div>
        </div>

        <div class="kitblock">
          <h3>2. Captions — the real speech, as a subtitle file</h3>
          <p class="why">Built from the whisper transcript already stored for this window. Platform
            auto-captions mangle this project's vocabulary (n8n, psycopg2, Coolify) and whisper already
            got it right. Upload the .srt with the clip.</p>
          ${captionsPanel(c)}
          <div class="editrow" style="margin-top:6px;">
            <button class="copybtn" data-copy="srt_text">copy SRT text</button>
            ${c.srt_text ? `<a class="copybtn" style="text-decoration:none;display:inline-block;"
               href="/api/candidates/${c.id}/captions.srt" download>download .srt</a>` : ''}
          </div>
        </div>

        <div class="kitblock">
          <h3>3. Video caption — the post descriptor</h3>
          <p class="why">What accompanies the clip in the post body.</p>
          <textarea data-field="video_caption" rows="4" placeholder="required">${esc(v.video_caption)}</textarea>
          <div class="editrow" style="margin-top:6px;">
            <button class="copybtn" data-copy="video_caption">copy caption</button>
          </div>
          <div class="kitmeta" style="margin-top:8px;">hashtags (minimal on purpose, space separated)</div>
          <input type="text" data-field="hashtags" value="${esc(v.hashtags)}" placeholder="none" />
          <div class="kitmeta${tagCount > 3 ? ' warn' : ''}">${tagCount} tag${tagCount === 1 ? '' : 's'}.
            Hashtags are near-dead as reach: Instagram caps at 5, and a study of 24.3M posts found posts
            WITH hashtags got 31% FEWER views. Two or three, never a wall.</div>
          <div class="editrow" style="margin-top:6px;">
            <button class="copybtn" data-copy="hashtags">copy hashtags</button>
            <button class="copybtn" data-copy="caption_tags">copy caption + hashtags</button>
          </div>
          ${c.quoted_line ? `<div class="kitmeta" style="margin-top:8px;">quoted from the transcript, verbatim:
            <b>${esc(c.quoted_line)}</b></div>` : ''}
        </div>

        <div class="kitblock">
          <div class="editrow">
            <button class="savewin" id="btnSaveKit">Save my edits (new version)</button>
            <button class="nudge" id="btnRegen">Regenerate</button>
            <!-- Re-render is the VIDEO; Regenerate is the COPY. Labelled
                 explicitly because the two were confusable enough that
                 Regenerate got pressed to change a burned-in caption. -->
            <button class="nudge" id="btnRerender" title="Re-cut the video file with the current caption setting">Re-render video</button>
            <span class="unsaved" id="kitUnsaved" style="display:${kitHasUnsaved(c) ? 'inline' : 'none'};">unsaved</span>
          </div>
          <div class="kitmeta">Saving never overwrites: it writes v${(c.kit_version || 0) + 1} and keeps
            every earlier version. Regenerating asks first if the active version is yours, and the server
            refuses it outright without that confirmation.</div>
          ${c.vision_model || c.writer_model ? `<div class="kitmeta">generated by ${esc(c.vision_model || 'no vision model')}
            + ${esc(c.writer_model || 'no writer model')}${c.passthrough_degraded === 1
              ? ' — QUALITY PARAMETERS WERE REFUSED by the provider, so this ran at defaults' : ''}</div>` : ''}
          <div class="kitmeta" id="kitHistory"></div>
        </div>`;

      detailEl.innerHTML = `
        <h2 style="margin:0 0 8px;">Candidate #${c.id} — post kit</h2>
        <div class="hint">session ${esc(c.session_label)} | vod ${c.vod_id} | delivered ${esc(c.drive_synced_at)}</div>
        <div class="winline">${kitStampHtml(c)}</div>
        <label class="genrow"><input type="checkbox" id="genKit" ${c.post_kit_enabled === 0 ? '' : 'checked'} />
          generate a post kit for this clip (intent only, the generator reads this)</label>
        <label class="genrow"><input type="checkbox" id="burnCaps" ${c.burn_captions === 1 ? 'checked' : ''} />
          burn speech captions into this clip (intent only — it applies to the NEXT render,
          it cannot change the file already delivered)</label>
        <div class="winline">${captionsFactHtml(c)}</div>
        ${captionsIntentNote(c)}
        <div class="kitgrid">
          <div>
            <div class="phone" id="phoneFrame">
              <video id="kitVid" playsinline preload="metadata" src="/clipmedia/${c.id}"></video>
              <div class="missing" id="clipMissing" style="display:none;">
                clip file not reachable from this machine.<br />
                The mockup still works for the copy, only the video is unavailable here.
              </div>
              <div class="guide top" style="display:${showGuides ? 'block' : 'none'};"></div>
              <div class="guide bottom" style="display:${showGuides ? 'block' : 'none'};"></div>
              <div class="guide rail" style="display:${showGuides ? 'block' : 'none'};"></div>
              <div class="hookband"><span class="hooktext" id="hookText">${esc(hookText)}</span></div>
            </div>
            <div class="editrow" style="margin-top:8px;">
              <button class="replaywin" id="btnPlayClip">Play</button>
              <button class="nudge" id="btnGuides">${showGuides ? 'hide' : 'show'} platform guides</button>
            </div>
            <div class="coverage" id="coverage"></div>
            <div class="postmeta">
              <div class="handle">${esc(profileState && profileState.handle ? profileState.handle : 'your handle')}</div>
              <div class="cap" id="postCaption">${esc(v.video_caption)}</div>
              <div class="tags" id="postTags">${esc(v.hashtags)}</div>
            </div>
            <div class="kitmeta">Dashed regions are covered by the platform's own UI. The hook is a CSS
              overlay on top of the video: it is never burned into the delivered file and never will be
              (D-061) — you type it into the platform's own text tool. Speech captions are the one
              exception, and only when you tick the box above: they are burned during the render, sit
              along the bottom clear of these guides, and this mockup does not show them.</div>
          </div>
          <div>
            ${copyBlocks}
            ${profilePanel(c)}
          </div>
        </div>`;

      wireKitDetail(c);
    }

    function wireKitDetail(c) {
      const vid = document.getElementById('kitVid');
      const missing = document.getElementById('clipMissing');
      if (vid && missing) {
        // An unreachable clip is a STATE, said plainly — never a silently
        // broken player that looks like the kit itself failed.
        vid.onerror = () => { missing.style.display = 'flex'; vid.style.display = 'none'; };
      }
      const playBtn = document.getElementById('btnPlayClip');
      if (playBtn && vid) {
        playBtn.onclick = () => { if (vid.paused) { vid.play(); playBtn.textContent = 'Pause'; }
                                  else { vid.pause(); playBtn.textContent = 'Play'; } };
      }
      const guidesBtn = document.getElementById('btnGuides');
      if (guidesBtn) {
        guidesBtn.onclick = () => { showGuides = !showGuides; renderDetail(); };
      }
      const genEl = document.getElementById('genKit');
      if (genEl) genEl.onchange = () => setGenerate(c, genEl.checked);
      const capEl = document.getElementById('burnCaps');
      if (capEl) capEl.onchange = () => setCaptions(c, capEl.checked);

      detailEl.querySelectorAll('.variant .pick').forEach((b) => {
        b.onclick = () => { hookPick[c.id] = b.dataset.hook; repaintOverlay(); };
      });

      // Typing updates the DRAFT and repaints the mockup live. Nothing is
      // written to the database until Save.
      detailEl.querySelectorAll('[data-field]').forEach((el) => {
        el.oninput = () => {
          const d = kitDrafts[c.id] || Object.assign({}, kitValues(c));
          d[el.dataset.field] = el.value;
          kitDrafts[c.id] = d;
          const flag = document.getElementById('kitUnsaved');
          if (flag) flag.style.display = kitHasUnsaved(c) ? 'inline' : 'none';
          if (el.dataset.field === 'video_caption') {
            const pc = document.getElementById('postCaption');
            if (pc) pc.textContent = el.value;
          }
          if (el.dataset.field === 'hashtags') {
            const pt = document.getElementById('postTags');
            if (pt) pt.textContent = el.value;
          }
          repaintOverlay();
        };
      });

      detailEl.querySelectorAll('.copybtn[data-copy]').forEach((b) => {
        b.onclick = () => {
          const vals = kitValues(c);
          const what = b.dataset.copy;
          let text = '';
          if (what === 'caption_tags') text = [vals.video_caption, vals.hashtags].filter(Boolean).join('\n\n');
          else text = vals[what] || '';
          copyText(text, b);
        };
      });

      const saveBtn = document.getElementById('btnSaveKit');
      if (saveBtn) saveBtn.onclick = () => saveKit(c);
      const regenBtn = document.getElementById('btnRegen');
      if (regenBtn) regenBtn.onclick = () => requestRegenerate(c);
      const rrBtn = document.getElementById('btnRerender');
      if (rrBtn) rrBtn.onclick = () => rerenderClip(c, rrBtn);
      const pfBtn = document.getElementById('btnSaveProfile');
      if (pfBtn) pfBtn.onclick = () => saveProfile();
      const subjBtn = document.getElementById('btnSaveSubj');
      if (subjBtn) subjBtn.onclick = () => saveSubject(c);
      const meBtn = document.getElementById('btnSubjMe');
      const otherBtn = document.getElementById('btnSubjOther');
      if (meBtn && otherBtn) {
        meBtn.onclick = () => { subjectPick[c.vod_id] = 'me'; meBtn.classList.add('on'); otherBtn.classList.remove('on'); };
        otherBtn.onclick = () => { subjectPick[c.vod_id] = 'other'; otherBtn.classList.add('on'); meBtn.classList.remove('on'); };
      }

      repaintOverlay();
      loadHistory(c);
    }

    async function loadHistory(c) {
      const out = document.getElementById('kitHistory');
      if (!out) return;
      try {
        const res = await fetch(`/api/candidates/${c.id}/kits`, { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        const rows = (data.versions || []).map((k) =>
          `<div class="histrow">v${k.version} ${esc(k.origin)}${k.is_active === 1 ? ' ACTIVE' : ''} ${esc(k.created_at)}</div>`
        ).join('');
        const reqs = (data.requests || []).map((q) =>
          `<div class="histrow">request ${esc(q.state)} ${esc(q.requested_at)}${q.force_over_operator_edit === 1 ? ' [confirmed over your edit]' : ''}${q.error ? ' — ' + esc(q.error) : ''}</div>`
        ).join('');
        out.innerHTML = (rows + reqs) || '<div class="histrow">no versions</div>';
      } catch (_) { /* history is informational, never surface a transient error */ }
    }

    // ------------------------------------------------------------------ D-063
    // BURNED-IN SPEECH CAPTIONS. Two facts, never merged into one badge:
    //
    //   the TOGGLE (c.burn_captions)   — what you want for the NEXT render.
    //   the FILE   (c.captions_burned) — what the delivered clip actually has.
    //
    // They are allowed to disagree, and when they do the honest thing is to
    // say so rather than to pick whichever one flatters the surface. A clip
    // shown as captioned that has no captions is the exact failure this
    // project keeps paying for, so `captions_burned` is the ONLY field that
    // may ever produce the words "has captions".

    function captionsFactHtml(c) {
      if (c.clip_state === null || c.clip_state === undefined) {
        return 'captions: <b>no clip rendered yet</b>';
      }
      if (c.captions_burned === 1) {
        return `captions: <b>BURNED IN</b> (${c.captions_cue_count} cue${c.captions_cue_count === 1 ? '' : 's'})`;
      }
      if (c.captions_requested === 1 && c.captions_cue_count === 0) {
        return 'captions: <b>none burned</b> — they were requested, but nobody speaks inside this window';
      }
      return 'captions: <b>none burned</b> — this file has no text in it';
    }

    // The gap between intent and file, stated plainly wherever it exists. This
    // is not a warning about a bug, it is the surface telling you the file on
    // disk does not match what the toggle now says, which is exactly the state
    // the Mac-side deliverer refuses on.
    function captionsIntentNote(c) {
      const rendered = !(c.clip_state === null || c.clip_state === undefined);
      if (!rendered) return '';
      // D-063 fixer: "requested, but nobody speaks in this window" is NOT a
      // gap between intent and file — the render did exactly what was asked
      // and there was nothing to burn. captionsFactHtml already says so on
      // this same card, and this function used to contradict it by telling the
      // operator to re-render, which reproduces the identical row forever.
      const noSpeech = (c.captions_requested === 1 && c.captions_cue_count === 0);
      if (c.burn_captions === 1 && c.captions_burned !== 1 && !noSpeech) {
        // A delivered clip has no next render (D-056), so do not promise one.
        if (c.drive_synced_at) {
          return `<div class="genrow" style="color:var(--maybe);">captions are ON but the file that was
            already delivered does not carry them. The toggle cannot change a delivered clip: it only
            applies if this candidate is ever rendered again.</div>`;
        }
        return `<div class="genrow" style="color:var(--maybe);">captions are ON but the rendered file
          does not carry them. It has to be re-rendered on the server lane to gain them, and the Mac
          batch deliverer will refuse this clip until then rather than ship it uncaptioned.</div>`;
      }
      if (c.burn_captions === 0 && c.captions_burned === 1) {
        if (c.drive_synced_at) {
          return `<div class="genrow" style="color:var(--maybe);">captions are OFF but the file that was
            already delivered has them burned in. Unticking the box cannot take them out of a clip that
            has shipped.</div>`;
        }
        return `<div class="genrow" style="color:var(--maybe);">captions are OFF but the rendered file
          already has them burned in. Re-tick captions, or re-render, before delivering.</div>`;
      }
      return '';
    }

    // D-063 fixer: THE TOGGLE MUST LAND BEFORE THE VERDICT.
    //
    // setCaptions is async and the checkbox fires it on change, but decide()
    // did not wait for it. Tick captions and hit Approve (or the `a` key)
    // straight after, and the verdict POST could win the race: the server
    // commits the approval and fires the delivery webhook, and the server lane
    // then reads burn_captions from the database as it was BEFORE the tick.
    // The clip renders uncaptioned and every row about it is honest, so
    // nothing anywhere reports a problem — the operator's intent is simply
    // gone, on the single action this whole feature exists for.
    //
    // decide() awaits this promise, so the verdict is always sent against the
    // flag the operator actually set. Deliberately NOT wired to setGenerate:
    // post_kit_enabled is read long after delivery, not by the webhook the
    // verdict fires, so there is no comparable window there.
    let pendingIntentSave = null;

    async function setCaptions(c, value) {
      const save = (async () => {
      gen += 1;
      try {
        const res = await fetch(`/api/candidates/${c.id}/captions-toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ burn_captions: value }),
        });
        if (!res.ok) {
          let body = '';
          try { body = JSON.stringify(await res.json()); } catch (_) {}
          alert(`Failed: ${res.status} ${body}`);
          await loadCandidates();
          return;
        }
        const row = await res.json();
        const j = indexOfRow(row.id);
        if (j !== -1) { candidates[j] = mergeLocalFlags(candidates[j], row); idx = j; }
        renderList();
        renderDetail();
      } catch (err) {
        alert(`Failed: ${String(err)}`);
      }
      })();
      // Cleared in a finally so a rejected save can never wedge every future
      // verdict behind a promise that will not settle again.
      pendingIntentSave = save;
      try {
        await save;
      } finally {
        if (pendingIntentSave === save) pendingIntentSave = null;
      }
    }

    async function setGenerate(c, value) {
      gen += 1;
      try {
        const res = await fetch(`/api/candidates/${c.id}/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ post_kit_enabled: value }),
        });
        if (!res.ok) {
          let body = '';
          try { body = JSON.stringify(await res.json()); } catch (_) {}
          alert(`Failed: ${res.status} ${body}`);
          await loadCandidates();
          return;
        }
        const row = await res.json();
        const j = indexOfRow(row.id);
        if (j !== -1) { candidates[j] = mergeLocalFlags(candidates[j], row); idx = j; }
        renderList();
        renderDetail();
      } catch (err) {
        alert(`Failed: ${String(err)}`);
      }
    }

    // The pending queue's rows do not carry kit columns, so a kit-endpoint
    // response is a SUPERSET there. Merging keeps the local-only _webhook flag
    // that D-056 sets on the card.
    function mergeLocalFlags(oldRow, newRow) {
      if (oldRow && oldRow._webhook && (newRow.clip_state === null || newRow.clip_state === undefined)) {
        newRow._webhook = oldRow._webhook;
      }
      return newRow;
    }

    async function saveKit(c) {
      if (!hasKit(c)) return;
      const v = kitValues(c);
      // The schema declares the three hooks and the caption NOT NULL, so the
      // server refuses a blank one. Say so here rather than sending a request
      // that is guaranteed to fail.
      for (const f of ['hook_withheld', 'hook_domain', 'hook_payoff', 'video_caption']) {
        if (!(v[f] || '').trim()) {
          alert(`${f} cannot be empty: the schema requires all three hooks and the caption.`);
          return;
        }
      }
      gen += 1;
      let res;
      try {
        res = await fetch(`/api/candidates/${c.id}/kit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            base_version: c.kit_version,
            hook_withheld: v.hook_withheld,
            hook_domain: v.hook_domain,
            hook_payoff: v.hook_payoff,
            video_caption: v.video_caption,
            hashtags: (v.hashtags || '').split(/\s+/).filter(Boolean),
            srt_text: v.srt_text || null,
          }),
        });
      } catch (err) { alert(`Failed: ${String(err)}`); return; }
      if (!res.ok) {
        let body = '';
        try { body = JSON.stringify(await res.json()); } catch (_) {}
        alert(`Save refused: ${res.status} ${body}`);
        return;
      }
      const row = await res.json();
      delete kitDrafts[row.id];
      const j = indexOfRow(row.id);
      if (j !== -1) { candidates[j] = row; idx = j; }
      renderList();
      renderDetail();
    }

    // RE-RENDER THE VIDEO (distinct from Regenerate, which rebuilds the COPY).
    // Re-cuts the mp4 with whatever burn_captions currently says, which is the
    // only way a caption decision taken AFTER delivery reaches Drive.
    async function rerenderClip(c, btn) {
      const on = c.burn_captions === 1;
      const msg = 'Re-render this clip?\n\n'
        + 'It re-cuts the video with captions ' + (on ? 'ON' : 'OFF')
        + ' and re-uploads it.\n\n'
        + 'The upload creates a NEW file rather than replacing one, so delete the '
        + 'previous copy from Drive first if it is still there.';
      if (!confirm(msg)) return;
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = 'Re-rendering...';
      try {
        const res = await fetch(`/api/candidates/${c.id}/rerender`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
        const j = await res.json().catch(() => ({}));
        if (!res.ok) {
          alert('Re-render refused:\n\n' + (j.error || res.status));
          return;
        }
        // The chain runs on the server; the row will not be updated by the time
        // this returns. Say that rather than implying it is already done.
        alert('Re-render queued (captions ' + (on ? 'ON' : 'OFF') + ').\n\n'
              + 'webhook: ' + (j.webhook || '?')
              + '\n\nIt takes a moment. Refresh to see the new file.');
      } catch (e) {
        alert('Re-render failed: ' + e);
      } finally {
        btn.disabled = false; btn.textContent = label;
      }
    }

    async function requestRegenerate(c) {
      if (kitHasUnsaved(c)) {
        alert('You have unsaved edits. Save them or reload the card before regenerating.');
        return;
      }
      let confirmFlag = false;
      if (hasKit(c) && c.kit_origin === 'operator_edit') {
        // The server refuses this without confirm=true regardless of what the
        // browser does. This dialog exists so the refusal is not a dead end.
        if (!window.confirm(
          `The active version (v${c.kit_version}) is YOUR edit.\n\n`
          + 'Regenerating asks the generator to write a new machine draft on top of it. Your version is '
          + 'kept forever and stays readable in the history, but the active kit will no longer be your '
          + 'words.\n\nRegenerate anyway?')) {
          return;
        }
        confirmFlag = true;
      }
      gen += 1;
      let res;
      try {
        res = await fetch(`/api/candidates/${c.id}/kit/regenerate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ confirm: confirmFlag }),
        });
      } catch (err) { alert(`Failed: ${String(err)}`); return; }
      if (!res.ok) {
        let body = '';
        try { body = JSON.stringify(await res.json()); } catch (_) {}
        alert(`Regenerate refused: ${res.status} ${body}`);
        return;
      }
      const row = await res.json();
      const j = indexOfRow(row.id);
      if (j !== -1) { candidates[j] = row; idx = j; }
      renderList();
      renderDetail();
      if (row.regenerate_command) {
        alert('Regenerate requested. It is recorded for the generator lane.\n\n'
          + 'To run it yourself right now:\n' + row.regenerate_command);
      }
    }

    async function loadProfile() {
      try {
        const res = await fetch('/api/profile', { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        profileState = data.profile;
      } catch (_) { /* the surface still works without it */ }
    }

    async function saveProfile() {
      const get = (id) => {
        const el = document.getElementById(id);
        return el && el.value.trim() !== '' ? el.value : null;
      };
      let res;
      try {
        res = await fetch('/api/profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            base_version: profileState ? profileState.version : null,
            channel_name: get('pfChannel'),
            handle: get('pfHandle'),
            platforms: get('pfPlatforms'),
            style_notes: get('pfStyle'),
            do_nots: get('pfDoNots'),
            extra_context: get('pfExtra'),
          }),
        });
      } catch (err) { alert(`Failed: ${String(err)}`); return; }
      if (!res.ok) {
        let body = '';
        try { body = JSON.stringify(await res.json()); } catch (_) {}
        alert(`Save refused: ${res.status} ${body}`);
        return;
      }
      const data = await res.json();
      profileState = data.profile;
      renderDetail();
    }

    async function saveSubject(c) {
      const kind = subjectPick[c.vod_id] || c.subject_kind;
      if (!kind) {
        alert('Choose "me" or "someone else" first. There is deliberately no default: a recording with '
          + 'no subject is treated as UNKNOWN, never as you.');
        return;
      }
      const textEl = document.getElementById('subjText');
      const notesEl = document.getElementById('ctxNotes');
      let res;
      try {
        res = await fetch(`/api/recordings/${c.vod_id}/subject`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subject_kind: kind,
            subject_text: textEl && textEl.value.trim() !== '' ? textEl.value : null,
            context_notes: notesEl && notesEl.value.trim() !== '' ? notesEl.value : null,
          }),
        });
      } catch (err) { alert(`Failed: ${String(err)}`); return; }
      if (!res.ok) {
        let body = '';
        try { body = JSON.stringify(await res.json()); } catch (_) {}
        alert(`Save refused: ${res.status} ${body}`);
        return;
      }
      const rec = await res.json();
      // Every card from the same recording carries this context, so update all
      // of them rather than only the visible one.
      for (const row of candidates) {
        if (row.vod_id === rec.recording_id) {
          row.context_version = rec.version;
          row.subject_kind = rec.subject_kind;
          row.subject_text = rec.subject_text;
          row.context_notes = rec.context_notes;
        }
      }
      delete subjectPick[c.vod_id];
      renderDetail();
    }

    function renderDetail() {
      if (listError) {
        detailEl.innerHTML = `<div class="empty error">${esc(listError)}</div>`;
        return;
      }
      if (!candidates.length) {
        detailEl.innerHTML = `<div class="empty">No ${labelForView()} candidates.</div>`;
        return;
      }
      const c = candidates[idx];
      if (view === 'delivered') {
        renderKitDetail(c);
        return;
      }
      // D-055: the video fragment and the window display use the EFFECTIVE
      // (saved) window — adjusted else original. Originals stay for reference.
      const eff = effectiveWindow(c);
      const edited = adjustedDiffers(c);
      const ed = editorValues(c);
      // D-056: pending now really does carry approved (awaiting-delivery)
      // cards, so this check is live routing, not just a backstop: approved
      // cards get no edit panel and locked verdict buttons (the server 409s
      // both anyway). Replay stays available via the replay-only panel below.
      const editable = c.state !== 'approved';
      const videoSrc = `/media/${c.vod_id}#t=${encodeURIComponent(eff.start)},${encodeURIComponent(eff.end)}`;
      const nudges = (field) => ['-5', '-1', '+1', '+5'].map((d) =>
        `<button class="nudge" data-field="${field}" data-delta="${d}">${d}s</button>`
      );
      const editPanel = !editable ? '' : `
        <div class="editpanel">
          <div class="editrow">
            <span class="editlabel">start</span>
            ${nudges('start')[0]}${nudges('start')[1]}
            <span class="editval" id="valStart">${fmt(ed.start, 1)}s</span>
            ${nudges('start')[2]}${nudges('start')[3]}
          </div>
          <div class="editrow">
            <span class="editlabel">end</span>
            ${nudges('end')[0]}${nudges('end')[1]}
            <span class="editval" id="valEnd">${fmt(ed.end, 1)}s</span>
            ${nudges('end')[2]}${nudges('end')[3]}
          </div>
          <div class="editrow">
            <button class="replaywin" id="btnReplay">Replay</button>
            <button class="savewin" id="btnSaveWin">Save</button>
            ${hasAdjustment(c) ? '<button class="resetwin" id="btnResetWin">Reset</button>' : ''}
            <span class="unsaved" id="unsavedFlag" style="display:${hasUnsaved(c) ? 'inline' : 'none'};">unsaved</span>
          </div>
        </div>`;
      // D-056: approved (awaiting-delivery) cards keep Replay — the one edit
      // control that stays live — in a reduced panel; nudges/Save/Reset are gone.
      const replayPanel = editable ? '' : `
        <div class="editpanel">
          <div class="editrow">
            <button class="replaywin" id="btnReplay">Replay</button>
            <span class="hint">window locked — approved</span>
          </div>
        </div>`;
      // Action buttons per queue (D-050 upgrade paths):
      // pending: Approve/Reject/Maybe | maybe: Approve/Reject | rejected: Approve/Maybe
      detailEl.innerHTML = `
        <h2 style="margin:0 0 8px;">Candidate #${c.id}</h2>
        <div class="hint">session ${c.session_label} | vod ${c.vod_id}</div>
        <div class="hint">${c.vod_path}</div>
        <div class="winline">window ${fmt(eff.start, 1)}s to ${fmt(eff.end, 1)}s
          ${edited ? '<span class="badge">edited</span>' : ''}
          ${edited ? `<span class="orig">(original ${fmt(c.start_s, 1)}s to ${fmt(c.end_s, 1)}s)</span>` : ''}
          ${deliveryBadgeHtml(c)}
        </div>
        <label class="genrow"><input type="checkbox" id="genKit" ${c.post_kit_enabled === 0 ? '' : 'checked'} />
          generate a post kit for this clip (default on, flip it any time — it records intent only,
          the copy is generated after the clip is delivered)</label>
        <label class="genrow"><input type="checkbox" id="burnCaps" ${c.burn_captions === 1 ? 'checked' : ''} />
          burn speech captions into this clip (default off, tick it any time before or at approval —
          the captions go in during the render itself, not afterwards)</label>
        ${captionsIntentNote(c)}
        <div class="actions">
          <button class="approve" id="btnApprove">Approve (a)</button>
          ${view !== 'rejected' ? '<button class="reject" id="btnReject">Reject (r)</button>' : ''}
          ${view === 'pending' || view === 'rejected' ? '<button class="maybe" id="btnMaybe">Maybe (m)</button>' : ''}
          <span class="hint" id="verdictLock" style="display:none;">save or reset the window first</span>
        </div>
        ${editPanel}${replayPanel}
        <video id="vid" controls preload="metadata" src="${videoSrc}"></video>
        <pre>score=${fmt(c.score)}\naudio=${fmt(c.signal_audio)} transcript=${fmt(c.signal_transcript)} chat=${fmt(c.signal_chat)} beat_boost=${fmt(c.signal_beat_boost)}\ncreated_at=${c.created_at}</pre>
      `;
      document.getElementById('btnApprove').onclick = () => decide('approve');
      const rejectBtn = document.getElementById('btnReject');
      if (rejectBtn) rejectBtn.onclick = () => decide('reject');
      const maybeBtn = document.getElementById('btnMaybe');
      if (maybeBtn) maybeBtn.onclick = () => decide('maybe');
      // Replay exists in BOTH panels (edit panel and the locked replay-only
      // panel), so it is wired outside the editable branch.
      const replayBtn = document.getElementById('btnReplay');
      if (replayBtn) replayBtn.onclick = () => replayWindow();
      // D-061: the generate toggle. Records intent only — it fires no
      // generation, touches no verdict, and is deliberately live in every
      // state (see the server's _set_generate for why it is not locked on
      // approved cards).
      const genEl = document.getElementById('genKit');
      if (genEl) genEl.onchange = () => setGenerate(c, genEl.checked);
      // D-063: the captions toggle. Same shape as the generate toggle and for
      // the same reasons — intent only, fires no render, live in every state.
      const capEl = document.getElementById('burnCaps');
      if (capEl) capEl.onchange = () => setCaptions(c, capEl.checked);
      if (editable) {
        detailEl.querySelectorAll('.nudge').forEach((btn) => {
          btn.onclick = () => nudgeWindow(btn.dataset.field, Number(btn.dataset.delta));
        });
        document.getElementById('btnSaveWin').onclick = () => saveWindow();
        const resetBtn = document.getElementById('btnResetWin');
        if (resetBtn) resetBtn.onclick = () => resetWindow();
      }
      // Drafts persist across card navigation — returning to a card with
      // unsaved edits must re-lock its verdict buttons (D-055 fixer, gate 17).
      updateVerdictLock(c);
    }

    // D-055 fixer (charter gate 17: a ruling binds to what was DISPLAYED):
    // while a candidate has UNSAVED window edits, every verdict action on it
    // is blocked — buttons disabled with a visible hint, and the a/r/m keys
    // inert via the same hasUnsaved() guard in decide(). Replay stays live so
    // the operator can preview before saving. No modal dialogs.
    function updateVerdictLock(c) {
      // D-056: approved (awaiting-delivery) cards are verdict-locked too —
      // approved is terminal (D-050), the delivery badge explains why. The
      // "save or reset" hint shows only for the unsaved-edit lock.
      const unsaved = hasUnsaved(c);
      const locked = unsaved || c.state === 'approved';
      for (const id of ['btnApprove', 'btnReject', 'btnMaybe']) {
        const b = document.getElementById(id);
        if (b) b.disabled = locked;
      }
      const lockEl = document.getElementById('verdictLock');
      if (lockEl) lockEl.style.display = unsaved ? 'inline' : 'none';
    }

    // D-055: nudges edit LOCAL (unsaved) state only; Save persists. The spans
    // are updated in place so the video element is not reloaded per nudge.
    function nudgeWindow(field, delta) {
      if (!candidates.length) return;
      const c = candidates[idx];
      const cur = editorValues(c);
      const next = { start: cur.start, end: cur.end };
      next[field] = Math.round((next[field] + delta) * 1000) / 1000;
      if (field === 'start') next.start = Math.max(0, next.start);
      drafts[c.id] = next;
      const valEl = document.getElementById(field === 'start' ? 'valStart' : 'valEnd');
      if (valEl) valEl.textContent = `${fmt(next[field], 1)}s`;
      const flag = document.getElementById('unsavedFlag');
      if (flag) flag.style.display = hasUnsaved(c) ? 'inline' : 'none';
      // Nudges update in place (no re-render, so the video does not reload) —
      // the verdict lock must follow the draft state in place too.
      updateVerdictLock(c);
    }

    // Replay plays across the CURRENT effective window — including unsaved
    // nudges, so the operator previews before saving. Our timeupdate handler
    // owns the stop (the #t fragment end is not assumed to do it).
    function replayWindow() {
      if (!candidates.length) return;
      const c = candidates[idx];
      const ed = editorValues(c);
      const v = document.getElementById('vid');
      if (!v) return;
      v.currentTime = ed.start;
      v.ontimeupdate = () => {
        if (v.currentTime >= ed.end) {
          v.pause();
          v.ontimeupdate = null;
        }
      };
      v.play();
    }

    // D-056 fixer (poll/verdict splice race). EVERY mutation of `candidates`
    // that runs AFTER an await must locate its row by IDENTITY, never by an
    // index captured before the await. The 15s pollRefresh can land mid-flight
    // — the verdict response is held open by the synchronous delivery-webhook
    // fire, so the window is wide — and it REPLACES the array, so a captured
    // `idx` can be pointing at a different card by the time the continuation
    // runs. Splicing that index removed the WRONG card and showed another
    // card's detail. (Same bug in the pre-existing two-rapid-verdicts case.)
    // Returns -1 when the row is already gone from the current queue; callers
    // then leave the array alone and just re-render.
    function indexOfRow(id) {
      return candidates.findIndex((x) => x.id === id);
    }

    async function postWindow(c, startVal, endVal) {
      let res;
      try {
        res = await fetch(`/api/candidates/${c.id}/window`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start_s: startVal, end_s: endVal }),
        });
      } catch (err) {
        alert(`Failed: ${String(err)}`);
        return null;
      }
      if (!res.ok) {
        let body = '';
        try { body = JSON.stringify(await res.json()); } catch (_) {}
        alert(`Failed: ${res.status} ${body}`);
        return null;
      }
      return res.json();
    }

    async function saveWindow() {
      if (!candidates.length) return;
      const c = candidates[idx];
      const ed = editorValues(c);
      gen += 1;
      const row = await postWindow(c, ed.start, ed.end);
      if (!row) return;
      // Post-await: locate by identity, never by the captured idx.
      delete drafts[row.id];
      const j = indexOfRow(row.id);
      if (j !== -1) {
        candidates[j] = row;
        idx = j;
      }
      renderList();
      renderDetail();
    }

    async function resetWindow() {
      if (!candidates.length) return;
      const c = candidates[idx];
      gen += 1;
      const row = await postWindow(c, null, null);
      if (!row) return;
      // Post-await: locate by identity, never by the captured idx.
      delete drafts[row.id];
      const j = indexOfRow(row.id);
      if (j !== -1) {
        candidates[j] = row;
        idx = j;
      }
      renderList();
      renderDetail();
    }

    async function decide(action) {
      if (!candidates.length) return;
      // D-063 fixer: let any in-flight captions toggle land first, so the
      // verdict (and the delivery webhook it fires) always sees the flag the
      // operator just set. The rejection is swallowed on purpose: setCaptions
      // has already alerted, and a failed toggle must not also swallow the
      // verdict keystroke.
      if (pendingIntentSave) {
        try { await pendingIntentSave; } catch (_) { /* already surfaced */ }
      }
      // Re-read after the await: setCaptions replaces the row object in place.
      if (!candidates.length) return;
      const c = candidates[idx];
      if (!c) return;
      // D-056: approved (awaiting-delivery) cards are verdict-locked — covers
      // the a/r/m keys; the buttons are already disabled (server 409s anyway).
      if (c.state === 'approved') return;
      // D-055 fixer (gate 17): unsaved window edits block every verdict —
      // this single guard covers both the buttons and the a/r/m keys.
      if (hasUnsaved(c)) {
        updateVerdictLock(c);
        return;
      }
      gen += 1; // invalidate any in-flight poll result
      let res;
      try {
        res = await fetch(`/api/candidates/${c.id}/${action}`, { method: 'POST' });
      } catch (err) {
        // F6 fixer: a dead server used to leave this unhandled — the promise
        // rejected, nothing alerted, and pressing approve/reject/maybe did
        // nothing the operator could see.
        alert(`Failed: ${String(err)}`);
        return;
      }
