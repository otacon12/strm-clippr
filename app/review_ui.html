<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>clpr review surface</title>
  <style>
    /* =====================================================================
       D-073 REVIEW UI REDESIGN -- FIFGEN DNA, studio-dark transposition.
       Token set per docs/review-ui-redesign-spec.md section 1. DARK IS
       OPERATOR-RATIFIED LAW (2026-08-08: "keep the page dark though, i like
       the dark vibe.") -- never lighten this ground to match the paper
       brand site. Same DNA (type, accent, spacing, motion), studio ground.
       ===================================================================== */
    :root {
      --studio: #141210;       /* ground */
      --panel: #1D1A17;        /* surface */
      --panel-raised: #221E19; /* nested surface, one step up */
      --hairline: #2A2620;     /* borders */
      --paper-text: #F4EFE6;   /* text */
      --muted: #9A938A;        /* muted text */
      --pop: #FF5C00;          /* the ONE accent */
      --pop-deep: #D64C00;
      --pop-tint: rgba(255,92,0,.12);
      --pop-tint-strong: rgba(255,92,0,.22);

      /* Verdict semantics stay a SEPARATE system from the one brand accent
         above -- approve/reject/maybe carry meaning the accent shouldn't
         dilute. Same hues as before the reskin (state vocabulary is not
         skin), retuned for contrast on the warm studio ground. */
      --ok: #3FBE82;
      --ok-deep: #2E9C68;
      --bad: #F2564D;
      --bad-deep: #D93B33;
      --maybe: #E3A83E;
      --maybe-deep: #C48A24;

      --font-serif: 'Fraunces', Georgia, 'Times New Roman', serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;

      --radius-xs: 3px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 16px;
      --radius-pill: 100px;

      --ease: cubic-bezier(.4,0,.2,1);
      --dur: .2s;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--studio); color: var(--paper-text);
      font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--pop-tint-strong); color: var(--paper-text); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
    }

    /* ---- Brand header (spec section 1): wordmark + micro-label, sits in
       the sticky left-pane head so the D-056 viewport-pinned scroll
       architecture (grid-template-rows:100%, height:100vh, independent
       pane scroll) is never touched. ---- */
    .brandbar { margin: 0 0 10px; }
    .brand-word { font-family: var(--font-serif); font-style: italic; font-weight: 500;
      font-size: 20px; color: var(--paper-text); line-height: 1.1; letter-spacing: -.01em; }
    .brand-sub { margin-top: 3px; font-size: 10.5px; font-weight: 600; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted); }

    /* D-056 scroll fix (unchanged): the layout is pinned to the viewport
       (height + an explicit 100% row so the single grid row cannot grow
       past it); each pane scrolls independently, so the player pane stays
       on screen while the list scrolls. The page itself never scrolls. */
    .wrap { display: grid; grid-template-columns: 380px 1fr; grid-template-rows: 100%; height: 100vh; }
    .left { border-right: 1px solid var(--hairline); overflow-y: auto; background: var(--studio); }
    .right { padding: 20px; overflow-y: auto; }
    .head { position: sticky; top: 0; background: var(--panel); z-index: 2; padding: 16px 14px 14px;
      border-bottom: 1px solid var(--hairline); }
    .title { margin: 0; font-family: var(--font-serif); font-weight: 500; font-size: 17px; color: var(--paper-text); }
    .kbd { color: var(--muted); font-size: 11px; line-height: 1.6; margin-top: 10px; }
    .kbdchip { display: inline-block; font-family: var(--font-sans); font-size: 9.5px; font-weight: 700;
      letter-spacing: .04em; color: var(--paper-text); background: rgba(255,255,255,.08);
      border: 1px solid var(--hairline); border-radius: var(--radius-xs); padding: 1px 5px; margin-left: 6px; }
    .list { padding: 10px; }
    .item { padding: 12px; border: 1px solid var(--hairline); border-radius: var(--radius-md);
      margin-bottom: 8px; background: var(--panel); cursor: pointer;
      transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur) var(--ease); }
    .item:hover { border-color: #3A342C; }
    .item.active { border-color: var(--pop); background: var(--panel-raised); box-shadow: 0 0 0 1px var(--pop) inset; }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .score { font-family: var(--font-serif); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 15px; }
    .meta { color: var(--muted); font-size: 11.5px; margin-top: 5px; line-height: 1.5; }
    .empty { padding: 16px 4px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .empty.error { color: var(--bad); border: 1px solid var(--bad-deep); background: rgba(242,86,77,.08);
      border-radius: var(--radius-md); font-weight: 500; padding: 12px 14px; }
    .empty.error details { margin-top: 8px; }
    .empty.error summary { cursor: pointer; color: var(--muted); font-size: 11.5px; }
    .empty.error pre { margin: 6px 0 0; }
    .card { border: 1px solid var(--hairline); border-radius: var(--radius-lg); background: var(--panel); padding: 18px; }
    .actions { display: flex; gap: 8px; margin: 14px 0 12px; flex-wrap: wrap; align-items: center; }
    .tabs { display: flex; gap: 4px; margin-top: 12px; background: var(--studio); border: 1px solid var(--hairline);
      border-radius: var(--radius-pill); padding: 3px; }

    /* ---- Buttons: pill-shaped primary/secondary vocabulary, the site's
       .18-.22s ease motion, visible focus rings. ---- */
    button { border: 0; padding: 9px 16px; border-radius: var(--radius-pill); color: var(--paper-text);
      cursor: pointer; font-weight: 600; font-size: 12.5px; font-family: var(--font-sans); line-height: 1.2;
      transition: filter var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
    button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:focus-visible, .handle:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: none; box-shadow: 0 0 0 3px var(--pop-tint-strong); }
    button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .approve { background: var(--ok); color: #0C1712; }
    .reject { background: var(--bad); color: #1A0705; }
    .maybe { background: var(--maybe); color: #1F1404; }
    .tab { background: transparent; color: var(--muted); border: 0; padding: 7px 14px; border-radius: var(--radius-pill); }
    .tab.active { background: var(--pop); color: #1A0900; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
    a.linklike, button.linklike { background: transparent; color: var(--pop); padding: 0; font-weight: 600;
      text-decoration: underline; text-underline-offset: 2px; }

    /* ---- Fine-edit numeric fallback: kept functional, visually secondary
       to the trim slider above it (spec section 2: "inputs remain as a
       fine-edit fallback, visually secondary"). ---- */
    .fineedit { border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--panel-raised);
      padding: 2px 12px; margin: 12px 0; }
    .fineedit summary { cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase; padding: 9px 0; }
    .fineedit[open] summary { border-bottom: 1px solid var(--hairline); margin-bottom: 10px; }
    .editpanel { padding: 0 0 10px; }
    .editrow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .editrow:last-child { margin-bottom: 0; }
    .editlabel { color: var(--muted); font-size: 11.5px; width: 38px; }
    .editval { font-variant-numeric: tabular-nums; font-family: var(--font-serif); font-weight: 500;
      min-width: 70px; text-align: center; font-size: 13px; }
    .nudge { background: var(--panel); border: 1px solid var(--hairline); color: var(--paper-text);
      padding: 6px 11px; font-weight: 600; border-radius: var(--radius-pill); font-size: 11.5px; }
    .nudge:hover:not(:disabled) { border-color: var(--pop); }
    .replaywin { background: var(--panel); border: 1px solid var(--hairline); color: var(--paper-text); }
    .replaywin:hover:not(:disabled) { border-color: var(--pop); }
    .savewin { background: var(--pop); color: #1A0900; }
    .savewin:hover:not(:disabled) { background: var(--pop-deep); }
    .resetwin { background: transparent; border: 1px solid var(--hairline); color: var(--muted); }

    /* ---- Chips (spec: pill, radius:100px, 1.5px border) -- the one shared
       vocabulary for every status/meta pill on the surface. ---- */
    .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
      border-radius: var(--radius-pill); padding: 3px 10px; vertical-align: middle; line-height: 1.5;
      border: 1.5px solid transparent; }
    .badge { background: var(--pop-tint); color: var(--pop); border-color: rgba(255,92,0,.35); }
    .dbadge { background: rgba(63,190,130,.12); color: var(--ok); border-color: rgba(63,190,130,.4); }
    .dbadge.warn { background: rgba(242,86,77,.12); color: var(--bad); border-color: rgba(242,86,77,.4); }
    .chip-muted { background: rgba(255,255,255,.06); color: var(--muted); border-color: var(--hairline); }
    .unsaved { color: var(--maybe); font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
    .unsaved::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--maybe); display: inline-block; }
    .winline { font-size: 13px; margin: 0 0 10px; color: var(--muted); }
    .winline .orig { color: var(--muted); font-size: 12px; }
    video { width: 100%; max-height: 60vh; background: #000; border-radius: var(--radius-lg); display: block; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 11.5px; color: var(--muted);
      font-variant-numeric: tabular-nums; }
    h2 { font-family: var(--font-serif); font-weight: 500; }

    /* ---- In-page notice bar, replacing alert(). Fixed, dismissible, and
       carries "Show technical detail" behind a collapse (spec section 4 /
       charter gate 7 -- raw machine outcomes are kept, one click deeper). ---- */
    .noticebar { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px);
      max-width: min(560px, calc(100vw - 32px)); background: var(--panel-raised); border: 1px solid var(--hairline);
      border-radius: var(--radius-lg); padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
      opacity: 0; pointer-events: none; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
      z-index: 50; }
    .noticebar.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    .noticebar.error { border-color: var(--bad-deep); }
    .noticebar.info { border-color: rgba(63,190,130,.4); }
    .notice-msg { font-size: 13px; line-height: 1.5; padding-right: 20px; }
    .notice-close { position: absolute; top: 10px; right: 10px; background: transparent; padding: 2px 6px;
      color: var(--muted); font-size: 14px; }
    .notice-tech { margin-top: 8px; }
    .notice-tech summary { cursor: pointer; color: var(--muted); font-size: 11px; }
    .notice-tech pre { margin: 6px 0 0; max-height: 140px; overflow: auto; }

    /* ---- Skeleton shimmer (spec: "loading = skeleton shimmer, never
       spinners-over-nothing"). No animation loop keeps running once the
       skeleton is removed -- it exists only in the loading DOM. ---- */
    @keyframes shimmer { 0% { background-position: -160px 0; } 100% { background-position: 160px 0; } }
    .skel { border-radius: var(--radius-sm); background: linear-gradient(90deg, var(--panel) 0%, var(--panel-raised) 50%, var(--panel) 100%);
      background-size: 160px 100%; animation: shimmer 1.1s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .skel { animation: none; background: var(--panel); } }
    .skel-item { height: 64px; border-radius: var(--radius-md); margin-bottom: 8px; }
    .skel-line { height: 12px; margin-bottom: 8px; }
    .skel-block { height: 220px; }

    /* ---------------------------------------------------------------- D-073
       THE TRIM SLIDER. A video-editor trim bar, track = the SLICE (original
       window +/- SLICE_PAD_S, mirroring workers/slice_geometry.py exactly).
       Handles write the same adjusted-window draft nudgeWindow() already
       used; Save/Reset are the existing endpoints, unchanged. */
    .trimwrap { margin: 14px 0; }
    .trimhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .trimlabel { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .slider { position: relative; height: 56px; border-radius: var(--radius-md); background: var(--panel-raised);
      border: 1px solid var(--hairline); margin: 0 8px; touch-action: none; }
    .slider.disabled { opacity: .5; pointer-events: none; }
    .slider-track { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--hairline); }
    .slider-region { position: absolute; top: 8px; bottom: 8px; background: var(--pop-tint); border-top: 2px solid var(--pop);
      border-bottom: 2px solid var(--pop); cursor: grab; }
    .slider-region:active { cursor: grabbing; }
    .slider-playhead { position: absolute; top: 2px; bottom: 2px; width: 1px; background: var(--paper-text);
      cursor: ew-resize; }
    .slider-playhead::before { content: ''; position: absolute; top: -4px; left: -4px; width: 9px; height: 9px;
      border-radius: 50%; background: var(--paper-text); }
    .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(244,239,230,.22); }
    .handle { position: absolute; top: 4px; bottom: 4px; width: 14px; margin-left: -7px; background: var(--pop);
      border-radius: var(--radius-xs); cursor: ew-resize; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
    .handle:hover, .handle:focus-visible { background: var(--pop-deep); }
    .handle::after { content: ''; position: absolute; left: 50%; top: 50%; width: 2px; height: 16px;
      margin: -8px 0 0 -1px; background: rgba(0,0,0,.35); }
    .chip-time { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
      font-family: var(--font-serif); font-variant-numeric: tabular-nums; white-space: nowrap;
      background: var(--panel); border-color: var(--hairline); color: var(--paper-text); }
    .chip-duration { position: absolute; top: calc(100% + 6px); transform: translateX(-50%);
      font-family: var(--font-serif); font-variant-numeric: tabular-nums; white-space: nowrap;
      background: var(--panel); border-color: var(--hairline); color: var(--muted); }
    .trimfoot { display: flex; justify-content: space-between; gap: 10px; margin: 22px 8px 0; flex-wrap: wrap; }
    .trimactions { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

    /* ---------------------------------------------------------------- D-061
       THE POST KIT. The system SUGGESTS copy and NEVER burns text into video:
       every hook below is a CSS overlay painted on top of a <video> element,
       so what the operator sees is a MOCKUP of the post he is about to make,
       and the delivered .mp4 in Drive is never touched. Nothing here writes to
       a canvas, draws into the video, or produces a new media file. */
    .kitgrid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 1100px) { .kitgrid { grid-template-columns: 1fr; } }

    /* The phone frame: a real 9:16 box, the aspect the platforms actually
       render, so "is this frame majority text?" is judgeable by eye. */
    .phone { position: relative; width: 300px; aspect-ratio: 9 / 16; background: #000;
             border-radius: var(--radius-xl); overflow: hidden; border: 2px solid var(--hairline); }
    .phone video { position: absolute; inset: 0; width: 100%; height: 100%;
                   max-height: none; object-fit: cover; border-radius: 0; background: #000; }
    .phone .missing { position: absolute; inset: 0; display: flex; align-items: center;
                      justify-content: center; text-align: center; padding: 16px;
                      color: var(--muted); font-size: 12px; }
    /* Guides for the regions the platform's OWN UI covers. Dashed, subtle, and
       toggleable -- they are a judging aid, not part of the post. */
    .guide { position: absolute; border: 1px dashed rgba(255,255,255,.28); pointer-events: none; }
    .guide.top { left: 0; right: 0; top: 0; height: 12%; }
    .guide.bottom { left: 0; right: 0; bottom: 0; height: 22%; }
    .guide.rail { right: 0; top: 40%; bottom: 22%; width: 16%; }
    .guidelabel { position: absolute; font-size: 9px; color: rgba(255,255,255,.5);
                  pointer-events: none; letter-spacing: .04em; }
    /* The overlay band the hook is painted in: inset from the right rail and
       clear of the top bar, i.e. the platform safe area. Centred horizontally
       so a two-line hook centres the box without ragging its second line. */
    .hookband { position: absolute; left: 6%; right: 6%; top: 16%; pointer-events: none;
                display: flex; justify-content: center; }
    .hooktext { font-family: var(--font-sans); font-weight: 800; font-size: 17px; line-height: 1.22; color: #fff;
                background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: var(--radius-sm);
                text-shadow: 0 1px 3px rgba(0,0,0,.9); word-break: break-word;
                text-align: center; }
    .hooktext.empty { background: rgba(242,86,77,.25); color: #ffc0ba; font-weight: 600; font-size: 13px; }
    /* The post as it reads under the video. Same card treatment as the phone
       so the left column is two deliberate objects, not a frame with loose
       text hanging off it. */
    .postmeta { position: relative; width: 300px; margin-top: 12px; font-size: 12.5px; color: var(--paper-text);
                background: var(--panel-raised); border: 1px solid var(--hairline);
                border-radius: var(--radius-md); padding: 14px 16px; line-height: 1.5; }
    /* FIX (2026-08-08): this was named .handle, which collides with the trim
       slider's bare, unscoped .handle rule below (position:absolute; top/
       bottom:4px; width:14px; background:var(--pop) -- the drag-handle
       styling for #handleIn/#handleOut). Nothing here scoped that rule to
       the slider, so it applied to THIS div too wherever it appeared (the
       post kit view only): with no positioned ancestor between it and the
       viewport, top/bottom:4px resolved against the initial containing
       block, painting a full-viewport-height, 14px-wide, var(--pop)-orange
       bar over the post kit page. Renamed to break the collision at its
       root (two unrelated things sharing one bare class name); .postmeta's
       own position:relative above is added as defense-in-depth so ANY
       future absolutely-positioned descendant here is bounded to the card,
       never the viewport, even if this class is reused again by mistake. */
    .postmeta .kit-handle { font-family: var(--font-serif); font-weight: 500; margin-bottom: 6px; letter-spacing: .01em; }
    .postmeta .cap { color: var(--paper-text); white-space: pre-wrap; word-break: break-word; }
    .postmeta .tags { color: var(--pop); margin-top: 6px; word-break: break-word; }
    .coverage { margin-top: 10px; font-size: 11.5px; color: var(--muted); line-height: 1.5;
                max-width: 300px; }
    .coverage b { color: var(--paper-text); font-variant-numeric: tabular-nums; }
    .coverage.warn b { color: var(--maybe); }
    .coverage.bad b { color: var(--bad); }

    /* ---- POST KIT SURFACE -------------------------------------------------
       Design intent: the COPY the operator is about to publish is the content;
       everything explaining it is apparatus. Three levers keep that split:
         1. MEASURE. Explanatory text capped at 78ch (long lines are the
            single biggest reason dense UI reads as unfinished).
         2. WEIGHT. Copy fields at 14px on a near-black field; rationale at
            11.5px, lower contrast -- the eye sorts them without reading.
         3. RHYTHM. One spacing scale so blocks read deliberate. */
    .kitblock { border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--panel-raised);
                padding: 18px 20px; margin-bottom: 14px; }
    .kitblock h3 { margin: 0 0 4px; font-family: var(--font-serif); font-weight: 500; font-size: 14.5px;
                   letter-spacing: .01em; color: var(--paper-text); }
    .kitblock .why { color: var(--muted); font-size: 11.5px; line-height: 1.55;
                     margin: 0 0 14px; max-width: 78ch; }

    /* Variant rows: the label is a fixed-width chip so all three copy lines
       start at the same x. */
    .variant { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    /* .pick is a bare rule (not scoped to .variant) because the subject
       picker (Me / Someone else) reuses the same toggle-button pattern
       outside a .variant row -- pre-existing in the prior design (it simply
       fell back to default button styling there); the reskin gives it the
       real chip-toggle treatment everywhere the class is used. */
    .pick { background: var(--panel); border: 1px solid var(--hairline); color: var(--paper-text);
                     padding: 8px 10px; font-size: 11.5px; border-radius: var(--radius-pill);
                     min-width: 150px; text-align: left; line-height: 1.25;
                     flex: 0 0 auto; }
    .pick:hover { border-color: var(--pop); }
    .pick.on { background: var(--pop-tint); border-color: var(--pop);
                        color: var(--pop); font-weight: 700; }
    .variant input[type=text] { flex: 1 1 auto; }

    .copybtn { background: var(--panel); border: 1px solid var(--hairline); color: var(--paper-text);
               padding: 8px 12px; font-size: 11.5px; border-radius: var(--radius-pill);
               flex: 0 0 auto; }
    .copybtn:hover { border-color: var(--pop); }
    .copybtn.done { background: rgba(63,190,130,.15); color: var(--ok); border-color: var(--ok); }

    textarea, input[type=text] { width: 100%; box-sizing: border-box; background: var(--studio);
        color: var(--paper-text); border: 1px solid var(--hairline); border-radius: var(--radius-sm); padding: 10px 12px;
        font-family: inherit; font-size: 14px; line-height: 1.5; resize: vertical;
        transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
    textarea:focus, input[type=text]:focus { outline: none; border-color: var(--pop);
        box-shadow: 0 0 0 3px var(--pop-tint); }
    textarea::placeholder, input[type=text]::placeholder { color: #5C564C; }
    textarea.srt { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px;
                   line-height: 1.6; }

    .kitmeta { color: var(--muted); font-size: 11.5px; line-height: 1.55; margin-top: 8px;
               max-width: 78ch; }
    .kitmeta.warn { color: var(--maybe); }
    .kitmeta.bad { color: var(--bad); }
    .stamp { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
             text-transform: uppercase; border-radius: var(--radius-pill); border: 1.5px solid transparent;
             padding: 2px 9px; }
    .stamp.machine { background: rgba(227,168,62,.14); color: var(--maybe); border-color: rgba(227,168,62,.4); }
    .stamp.operator { background: rgba(63,190,130,.14); color: var(--ok); border-color: rgba(63,190,130,.4); }
    .stamp.none { background: rgba(255,255,255,.06); color: var(--muted); border-color: var(--hairline); }
    .stamp.failed { background: rgba(242,86,77,.16); color: var(--bad); border-color: rgba(242,86,77,.45); }
    .emptykit { border: 1px solid var(--bad-deep); background: rgba(242,86,77,.06); border-radius: var(--radius-md);
                padding: 16px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .emptykit b { color: var(--paper-text); }
    .genrow { display: flex; align-items: center; gap: 8px; font-size: 12.5px;
              color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
    .genrow input { width: 15px; height: 15px; accent-color: var(--pop); }
    .ctxbox { border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--panel);
              padding: 14px; margin-bottom: 10px; }
    .histrow { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
               border-top: 1px solid var(--hairline); padding: 5px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="left">
      <div class="head">
        <div class="brandbar">
          <div class="brand-word">Vibes With Olu</div>
          <div class="brand-sub">The Clipper &middot; Review</div>
        </div>
        <h1 id="queueTitle" class="title">Pending candidates</h1>
        <div class="tabs">
          <button id="tabPending" class="tab active">Pending</button>
          <button id="tabMaybe" class="tab">Maybe</button>
          <button id="tabRejected" class="tab">Rejected</button>
          <button id="tabDelivered" class="tab">Post kit</button>
        </div>
        <div class="kbd">j/k or arrows move<span class="kbdchip">J K</span> &middot; approve<span class="kbdchip">A</span> &middot; reject, not in Rejected<span class="kbdchip">R</span> &middot; maybe, Pending/Rejected<span class="kbdchip">M</span> &middot; toggle Rejected<span class="kbdchip">X</span> &middot; set in/out at the playhead<span class="kbdchip">I</span><span class="kbdchip">O</span><br />Keys are inert while typing in a field.</div>
      </div>
      <div id="list" class="list"></div>
    </aside>

    <main class="right">
      <div id="detail" class="card">
        <div class="skel skel-line" style="width:40%;height:20px;"></div>
        <div class="skel skel-line" style="width:65%;"></div>
        <div class="skel skel-block"></div>
      </div>
    </main>
  </div>

  <div id="noticeBar" class="noticebar" role="status" aria-live="polite">
    <button type="button" class="notice-close" id="noticeClose" aria-label="Dismiss">&times;</button>
    <div class="notice-msg" id="noticeMsg"></div>
    <details class="notice-tech" id="noticeTechWrap">
      <summary>Show technical detail</summary>
      <pre id="noticeTech"></pre>
    </details>
  </div>

  <script>
    let candidates = [];
    let idx = 0;
    let view = 'pending';
    // D-056: mutation generation — bumped by every user-driven mutation so an
    // in-flight background poll can never clobber what the operator just did.
    let gen = 0;
    // B6 fixer: true for the entire span of one decide() call (set before the
    // fetch, cleared in its finally). A second decide() invocation while one
    // is already in flight — a fast double-click, or a held key repeating
    // faster than the network round trip — returns immediately instead of
    // firing a second verdict request. updateVerdictLock() folds this into
    // the same disabled-button computation the unsaved/approved locks use.
    let decideInFlight = false;
    // D-055: local (unsaved) window edits, keyed by candidate id: {start, end}.
    // A draft exists only while nudged-but-not-saved; Save/Reset clears it.
    const drafts = {};
    // F6 fixer: a server error (5xx) or an unexpected (non-array) 200 body
    // must NOT be coerced into "zero candidates" — that renders as a
    // permanent, indistinguishable "No X candidates" precisely when the
    // guard that produced the error matters most. Set by loadCandidates,
    // read by renderList/renderDetail; null means no error, render normally.
    let listError = null;
    // D-073: true for the span of an active slider pointer-drag (handle,
    // region body, or playhead). pollRefresh's existing kitHasUnsaved(sel)
    // guard already protects unsaved kit edits from a mid-poll re-render;
    // this is the same shape for a mid-drag re-render, which would replace
    // the DOM under a live pointer capture and kill the gesture.
    let sliderDragActive = false;
    // D-073: the SOURCE video's duration, once its metadata loads. The
    // slice-bounds formula clamps its upper edge to this, exactly mirroring
    // workers/slice_geometry.py's slice_end() duration clamp -- null until
    // loadedmetadata fires, so sliceBounds() must guard for that.
    let sliderVideoDuration = null;

    const listEl = document.getElementById('list');
    const leftEl = document.querySelector('.left');
    const detailEl = document.getElementById('detail');
    const queueTitleEl = document.getElementById('queueTitle');
    const tabPendingEl = document.getElementById('tabPending');
    const tabMaybeEl = document.getElementById('tabMaybe');
    const tabRejectedEl = document.getElementById('tabRejected');
    const tabDeliveredEl = document.getElementById('tabDelivered');

    // D-061 post kit state.
    // kitDrafts: unsaved operator edits, keyed by candidate id. Same discipline
    // as the D-055 window drafts — an unsaved edit blocks the actions that
    // would destroy it, and a background poll never re-renders over it.
    const kitDrafts = {};
    // The selected on-video variant per candidate. LOCAL until saved: clicking
    // between variants re-paints the overlay live and writes nothing. The
    // choice is persisted only by Save, as part of the version he was reading
    // (a ruling binds to what was DISPLAYED).
    const hookPick = {};
    // The chosen subject_kind per recording, LOCAL until saved.
    const subjectPick = {};
    let profileState = null;   // the ACTIVE creator_profile row, or null
    let showGuides = true;

    function fmt(v, n = 3) {
      if (v === null || v === undefined) return 'null';
      if (typeof v === 'number') return v.toFixed(n);
      return String(v);
    }

    // D-055 window helpers. EFFECTIVE window = COALESCE(adjusted, original);
    // originals are immutable and only ever shown for reference.
    function hasAdjustment(c) {
      return (c.adjusted_start_s !== null && c.adjusted_start_s !== undefined)
          || (c.adjusted_end_s !== null && c.adjusted_end_s !== undefined);
    }

    function effectiveWindow(c) {
      return {
        start: (c.adjusted_start_s ?? c.start_s),
        end: (c.adjusted_end_s ?? c.end_s),
      };
    }

    function adjustedDiffers(c) {
      if (!hasAdjustment(c)) return false;
      const eff = effectiveWindow(c);
      return eff.start !== c.start_s || eff.end !== c.end_s;
    }

    // The editor's current values: the unsaved draft when one exists,
    // else the saved effective window.
    function editorValues(c) {
      const d = drafts[c.id];
      if (d) return { start: d.start, end: d.end };
      return effectiveWindow(c);
    }

    function hasUnsaved(c) {
      const d = drafts[c.id];
      if (!d) return false;
      const eff = effectiveWindow(c);
      return d.start !== eff.start || d.end !== eff.end;
    }

    // D-056: pending now carries approved-but-undelivered cards (the server
    // keeps them in the pending payload until a clips row gains drive_synced_at,
    // the delivery witness). The badge keys on clip_state/drive_synced_at plus
    // the local-only _webhook flag decide() sets when the verdict response
    // reported the delivery webhook failed/unconfigured. Precedence: a clips
    // row means delivery has started, so it outranks a stale webhook flag.
    // D-056 fixer (charter under-claim default): the badge NEVER asserts an
    // upload is in progress — nothing in the payload witnesses a running
    // upload. A clips row only proves the render lane reached this candidate,
    // so report the clip_state itself: 'rendered' means the file exists and
    // delivery has not been witnessed yet ("awaiting upload"), and any other
    // clip_state is reported verbatim rather than narrated. The old text
    // ("APPROVED — {clip_state} — uploading") over-claimed in both
    // directions: 'published — uploading' was incoherent, and 'rendered —
    // uploading' asserted an upload nobody had observed.
    function deliveryBadge(c) {
      if (c.state !== 'approved') return '';
      if (c.clip_state !== null && c.clip_state !== undefined) {
        if (c.clip_state === 'rendered') return 'Rendered. Waiting to upload.';
        return `Approved. Clip is ${c.clip_state}.`;
      }
      if (c._webhook === 'failed') return 'Delivery has not started. The webhook failed.';
      if (c._webhook === 'unconfigured') return 'Delivery has not started. The webhook is not set up.';
      return 'Approved. Waiting for delivery.';
    }

    function deliveryBadgeHtml(c) {
      const text = deliveryBadge(c);
      if (!text) return '';
      const warn = text.startsWith('Delivery has not started');
      return `<span class="chip dbadge${warn ? ' warn' : ''}">${text}</span>`;
    }

    // F6 fixer: webhook outcomes recorded on an APPROVE persist here, keyed by
    // candidate id, independent of which VIEW is currently loaded. The old
    // carry-forward lived only inside pollRefresh and read _webhook off the
    // CURRENT view's in-memory rows — so approving from maybe/rejected (which
    // immediately removes the card from that view's list) discarded the
    // outcome before the card ever reappeared in pending. This is the single
    // place decide()/loadCandidates()/pollRefresh() all read and write it.
    const webhookFlags = {};

    // Attach (or clear) the persisted webhook flag on one fresh row. A clips
    // row (clip_state present) means delivery has started, so it outranks and
    // clears a stale flag — same precedence deliveryBadge() already applies.
    function applyWebhookFlag(row) {
      const rendered = !(row.clip_state === null || row.clip_state === undefined);
      if (rendered) {
        delete webhookFlags[row.id];
        return;
      }
      if (webhookFlags[row.id]) row._webhook = webhookFlags[row.id];
    }

    function endpointForView() {
      if (view === 'maybe') return '/api/candidates/maybe';
      if (view === 'rejected') return '/api/candidates/rejected';
      if (view === 'delivered') return '/api/candidates/delivered';
      return '/api/candidates';
    }

    function titleForView() {
      if (view === 'maybe') return 'Maybe candidates';
      if (view === 'rejected') return 'Rejected candidates';
      if (view === 'delivered') return 'Post kit (delivered clips)';
      return 'Pending candidates';
    }

    function labelForView() {
      if (view === 'maybe') return 'maybe';
      if (view === 'rejected') return 'rejected';
      if (view === 'delivered') return 'delivered';
      return 'pending';
    }

    // F6 fixer: a server error status or an unexpected (non-array) 200 body
    // must render as a visible error, not silently paint the same
    // "No X candidates" state as a genuinely empty queue. (A raw fetch()
    // rejection is a separate path — see the NOTE in loadCandidates below —
    // and never reaches this function.)
    function showListError(friendly, technical) {
      listError = { message: friendly, technical: technical || '' };
      candidates = [];
      idx = 0;
      renderTabs();
      renderList();
      renderDetail();
    }

    // Shared markup for listError, read by both renderList and renderDetail.
    // The raw machine outcome collapses behind "Show technical detail"
    // (spec section 4 / charter gate 7 — quoted verbatim, one click deeper).
    function listErrorHtml() {
      const tech = listError.technical
        ? `<details><summary>Show technical detail</summary><pre>${esc(listError.technical)}</pre></details>`
        : '';
      return `<div class="empty error">${esc(listError.message)}${tech}</div>`;
    }

    // Same shape as listErrorHtml, for the raw fetch()-rejection path (the
    // connection dropped outright, before any response landed) -- a
    // different failure than the server-responded-with-an-error path above,
    // but the same client-grade presentation.
    function rawLoadErrorHtml(err) {
      const tech = `<details><summary>Show technical detail</summary><pre>${esc(String(err))}</pre></details>`;
      return `<div class="empty error">Could not load candidates. Check your connection and try again.${tech}</div>`;
    }

    async function loadCandidates() {
      // The post kit view renders the standing profile next to the copy it
      // produced, so it must be loaded before the first paint.
      if (view === 'delivered' && profileState === null) await loadProfile();
      // NOTE: a raw connection drop here (fetch() itself rejecting) is left
      // to propagate to the caller — every call site already wraps this in
      // .catch(...) and paints "Could not load candidates" (that path is not
      // muffled today; do not add a second mechanism for it). This function
      // only handles the two ways a response that DID land can still lie
      // about being an empty queue: an explicit error status, and a 200 body
      // that is not the array shape every caller assumes.
      const res = await fetch(endpointForView(), { cache: 'no-store' });
      let data = null;
      try { data = await res.json(); } catch (_) { /* non-JSON body — handled below */ }
      if (!res.ok) {
        const msg = (data && typeof data === 'object' && data.error) ? data.error : `HTTP ${res.status}`;
        showListError(`Could not load ${labelForView()} candidates. Check the server and try again.`,
          `Failed to load ${labelForView()} candidates: ${msg}`);
        return;
      }
      if (!Array.isArray(data)) {
        showListError(`Could not load ${labelForView()} candidates. Check the server and try again.`,
          `Failed to load ${labelForView()} candidates: server returned an unexpected (non-list) response.`);
        return;
      }
      listError = null;
      candidates = data;
      candidates.forEach(applyWebhookFlag);
      if (idx >= candidates.length) idx = Math.max(0, candidates.length - 1);
      renderTabs();
      renderList();
      renderDetail();
    }

    function renderTabs() {
      queueTitleEl.textContent = titleForView();
      tabPendingEl.classList.toggle('active', view === 'pending');
      tabMaybeEl.classList.toggle('active', view === 'maybe');
      tabRejectedEl.classList.toggle('active', view === 'rejected');
      tabDeliveredEl.classList.toggle('active', view === 'delivered');
    }

    // Orienting empty-queue copy: what this pane is, why it is empty, what
    // fills it (spec section 4).
    function emptyQueueMessage() {
      if (view === 'maybe') return "Nothing sitting in Maybe. Mark a pending clip 'maybe' to hold it here.";
      if (view === 'rejected') return 'Nothing rejected yet. Rejected clips will collect here.';
      if (view === 'delivered') return 'No delivered clips yet. Approve and deliver a clip to build its post kit here.';
      return "No candidates waiting on you right now. New ones appear here as the detector finds them.";
    }

    function renderList() {
      listEl.innerHTML = '';
      if (listError) {
        listEl.innerHTML = listErrorHtml();
        return;
      }
      if (!candidates.length) {
        listEl.innerHTML = `<div class="empty">${esc(emptyQueueMessage())}</div>`;
        return;
      }
      candidates.forEach((c, i) => {
        const el = document.createElement('div');
        el.className = 'item' + (i === idx ? ' active' : '');
        el.onclick = () => { idx = i; renderList(); renderDetail(); };
        el.innerHTML = `
          <div class="row">
            <div>#${c.id} &middot; vod ${c.vod_id}</div>
            <div class="score">${fmt(c.score)}</div>
          </div>
          <div class="meta">${c.session_label} &middot; ${fmt(effectiveWindow(c).start,1)}s to ${fmt(effectiveWindow(c).end,1)}s${adjustedDiffers(c) ? ' <span class="chip badge">edited</span>' : ''}</div>
          <div class="meta">audio ${fmt(c.signal_audio)} &middot; transcript ${fmt(c.signal_transcript)} &middot; chat ${fmt(c.signal_chat)} &middot; beat ${fmt(c.signal_beat_boost)}</div>
          ${view === 'delivered'
            ? `<div class="meta">${kitStampHtml(c)}${kitHasUnsaved(c) ? ' <span class="unsaved">Unsaved edit</span>' : ''}</div>`
            : (deliveryBadgeHtml(c) ? `<div class="meta">${deliveryBadgeHtml(c)}</div>` : '')}
          ${view !== 'delivered' && c.post_kit_enabled === 0 ? '<div class="meta"><span class="chip chip-muted">Post kit off</span></div>' : ''}
          ${captionsChipHtml(c)}
        `;
        listEl.appendChild(el);
      });
    }

    // D-063 card chip. The post kit's chip shows when it is OFF because it
    // defaults ON. Captions default OFF, so the chip shows when it is ON — the
    // chip always marks the NON-default state, which is the one worth a glance.
    // On a delivered card the chip reports the FILE, never the toggle: that is
    // the only fact a delivered clip has.
    function captionsChipHtml(c) {
      const rendered = !(c.clip_state === null || c.clip_state === undefined);
      if (rendered && c.captions_burned === 1) return '<div class="meta">Captions burned in.</div>';
      // Asked for, and the window holds no speech. An honest outcome, not a
      // shortfall, and NOT something a later render would change.
      if (rendered && c.captions_requested === 1 && c.captions_cue_count === 0) {
        return '<div class="meta">No captions. Nobody speaks in this window.</div>';
      }
      // D-063 fixer: a DELIVERED clip is delivered, full stop (D-056) — there
      // is no next render for it, so promising one on its card was a claim
      // about work that will never happen.
      if (c.drive_synced_at) {
        return c.burn_captions === 1
          ? '<div class="meta">Captions are on, but this delivered file has none.</div>'
          : '';
      }
      if (c.burn_captions === 1) return '<div class="meta">Captions on for the next render.</div>';
      return '';
    }

    // ------------------------------------------------------------- D-061/D-062
    // THE POST KIT. Three distinct things per delivered clip, in the
    // operator's own vocabulary:
    //   on-video text  — the hook he types into the platform's text tool
    //   captions       — the real speech transcription, as an SRT file
    //   video caption  — the post descriptor, plus MINIMAL hashtags
    // Nothing here is burned into the video and nothing auto-posts: the
    // operator is the publish gate (D-002) and this surface only suggests.
    // Field names are the schema's (migrations_pg/003_post_kits.sql), not
    // invented ones, so the surface and the generator cannot drift apart.

    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ---------------------------------------------------------------- D-073
    // IN-PAGE NOTICE BAR, replacing every alert() on this surface. Every
    // former alert() call site here is fire-and-continue or return-after --
    // nothing depends on alert()'s blocking behaviour -- so this is a
    // drop-in swap. window.confirm() is UNCHANGED and stays native: the
    // rerender/regenerate confirms are guard rails the brief pins as
    // "confirm dialog... unchanged", and they are synchronous by design.
    //
    // Language rule (spec section 4): the message says what happened plus
    // the one next action; the raw machine outcome (which may itself carry
    // an em dash, a status code, a stack string) is never shown directly --
    // it collapses behind "Show technical detail" (charter gate 7: quoted
    // verbatim, one click deeper).
    let noticeTimer = null;
    function notify(message, opts) {
      opts = opts || {};
      const bar = document.getElementById('noticeBar');
      if (!bar) { return; }
      bar.className = 'noticebar show ' + (opts.kind === 'info' ? 'info' : 'error');
      const msgEl = document.getElementById('noticeMsg');
      const techEl = document.getElementById('noticeTech');
      const techWrap = document.getElementById('noticeTechWrap');
      if (msgEl) msgEl.textContent = message;
      if (opts.technical) {
        if (techEl) techEl.textContent = String(opts.technical);
        if (techWrap) techWrap.style.display = '';
        if (techWrap) techWrap.open = false;
      } else if (techWrap) {
        techWrap.style.display = 'none';
      }
      clearTimeout(noticeTimer);
      if (opts.kind === 'info') {
        noticeTimer = setTimeout(dismissNotice, 6000);
      }
    }
    function dismissNotice() {
      const bar = document.getElementById('noticeBar');
      if (bar) bar.classList.remove('show');
      clearTimeout(noticeTimer);
    }
    const noticeCloseEl = document.getElementById('noticeClose');
    if (noticeCloseEl) noticeCloseEl.onclick = dismissNotice;

    // A kit EXISTS only when the server sent a version number. Null kit_version
    // means no ACTIVE post_kits row at all, which the UI must render as
    // MISSING — a kit whose fields are merely blank is a different thing, and
    // the schema forbids it anyway (the hooks and caption are NOT NULL).
    function hasKit(c) {
      return c.kit_version !== null && c.kit_version !== undefined;
    }

    // A regenerate request is OUTSTANDING while no NEWER kit version has
    // landed. Integer comparison against the version that was active when he
    // asked — no timestamps are compared anywhere (charter gate 21).
    function regenPending(c) {
      if (c.request_state !== 'requested') return false;
      const asked = Number(c.active_version_at_request ?? 0);
      const now = Number(c.kit_version ?? 0);
      return now <= asked;
    }

    function kitStampHtml(c) {
      let parts = [];
      if (!hasKit(c)) {
        parts.push('<span class="stamp none">No kit yet</span>');
      } else if (c.kit_origin === 'operator_edit') {
        parts.push(`<span class="stamp operator">v${c.kit_version} &middot; edited by you</span>`);
      } else {
        parts.push(`<span class="stamp machine">v${c.kit_version} &middot; machine draft, not reviewed</span>`);
      }
      if (c.request_state === 'failed') {
        parts.push('<span class="stamp failed">Generation failed</span>');
      } else if (regenPending(c)) {
        parts.push('<span class="stamp none">Regenerate requested</span>');
      }
      return parts.join(' ');
    }

    // The editor's current values: the unsaved draft when one exists, else the
    // active version's own fields.
    function kitValues(c) {
      const d = kitDrafts[c.id];
      if (d) return d;
      return {
        hook_withheld: c.hook_withheld ?? '',
        hook_domain: c.hook_domain ?? '',
        hook_payoff: c.hook_payoff ?? '',
        video_caption: c.video_caption ?? '',
        hashtags: Array.isArray(c.hashtags) ? c.hashtags.join(' ') : (c.hashtags ?? ''),
        srt_text: c.srt_text ?? '',
      };
    }

    function kitSaved(c) {
      return {
        hook_withheld: c.hook_withheld ?? '',
        hook_domain: c.hook_domain ?? '',
        hook_payoff: c.hook_payoff ?? '',
        video_caption: c.video_caption ?? '',
        hashtags: Array.isArray(c.hashtags) ? c.hashtags.join(' ') : (c.hashtags ?? ''),
        srt_text: c.srt_text ?? '',
      };
    }

    function kitHasUnsaved(c) {
      const d = kitDrafts[c.id];
      if (!d) return false;
      const saved = kitSaved(c);
      return Object.keys(saved).some((k) => (d[k] ?? '') !== saved[k]);
    }

    const HOOK_FIELDS = {
      withheld: 'hook_withheld',
      domain: 'hook_domain',
      payoff: 'hook_payoff',
    };

    function selectedHookKey(c) {
      return hookPick[c.id] || 'withheld';
    }

    function hookTextFor(c, key) {
      const v = kitValues(c);
      return (v[HOOK_FIELDS[key]] || '').trim();
    }

    async function copyText(text, btn) {
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (_) {
        // http://127.0.0.1 is a secure context, but keep a fallback rather
        // than silently failing to copy the thing he came here to paste.
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ok = document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (__) { ok = false; }
      }
      if (btn) {
        const old = btn.textContent;
        btn.textContent = ok ? 'Copied' : 'Copy failed';
        btn.classList.toggle('done', ok);
        setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1200);
      }
    }

    // MEASURE what is actually painted, so "is this frame majority text?" is a
    // number rather than a feeling. Instagram officially demotes reels that are
    // majority text, so the mockup exists to make that judgeable BEFORE he
    // posts. This measures the rendered hook box against the frame box — the
    // DOM as drawn, not an estimate from character counts.
    function updateCoverage() {
      const frame = document.getElementById('phoneFrame');
      const span = document.getElementById('hookText');
      const out = document.getElementById('coverage');
      if (!frame || !out) return;
      const fr = frame.getBoundingClientRect();
      const frameArea = fr.width * fr.height;
      let pct = 0;
      if (span && frameArea > 0) {
        const sr = span.getBoundingClientRect();
        pct = (sr.width * sr.height) / frameArea * 100;
      }
      out.classList.remove('warn', 'bad');
      let verdict = 'well under the majority-text line.';
      if (pct >= 50) { out.classList.add('bad'); verdict = 'Majority text. Instagram demotes this.'; }
      else if (pct >= 30) { out.classList.add('warn'); verdict = 'Getting text-heavy.'; }
      out.innerHTML = `Hook covers <b>${pct.toFixed(1)}%</b> of the frame. ${esc(verdict)}`;
    }

    function repaintOverlay() {
      const c = candidates[idx];
      if (!c) return;
      const span = document.getElementById('hookText');
      if (!span) return;
      const key = selectedHookKey(c);
      const text = hookTextFor(c, key);
      span.textContent = text || 'No hook in this variant';
      span.classList.toggle('empty', !text);
      const wordCount = text ? text.split(/\s+/).filter(Boolean).length : 0;
      const wc = document.getElementById('hookWords');
      if (wc) {
        wc.className = 'kitmeta' + (wordCount > 20 ? ' bad' : (wordCount > 12 ? ' warn' : ''));
        wc.textContent = text
          ? `${wordCount} words. TikTok's own guidance is 5 to 10 words per second of reading, so a hook read in the first 2 seconds is 10 to 20 words maximum, and shorter is safer.`
          : 'This variant is empty.';
      }
      document.querySelectorAll('.variant .pick').forEach((b) => {
        b.classList.toggle('on', b.dataset.hook === key);
      });
      updateCoverage();
    }

    function captionsPanel(c) {
      if (!c.srt_text) {
        return `<div class="kitmeta bad">No captions in this kit. The builder writes no SRT rather
          than an empty one when the window holds no transcript segments.</div>`;
      }
      const basis = c.srt_basis
        ? `rebased from the <b>${esc(c.srt_basis)}</b> witness (clip t=0 at ${fmt(c.srt_clip_t0_abs_s, 1)}s of the recording)`
        : 'basis not recorded';
      return `
        <div class="kitmeta">${c.srt_segment_count} segments &middot; ${basis}</div>
        <textarea class="srt" data-field="srt_text" rows="6" placeholder="captions">${esc(kitValues(c).srt_text)}</textarea>
        <div class="kitmeta">Edit only if whisper misheard something. The timings were computed from the
          renderer that actually shipped this file, not guessed.</div>`;
    }

                        && hasKit(c) && kitCtxV !== null && kitCtxV !== undefined
                        && Number(c.context_version) > Number(kitCtxV));
      const f = (k) => esc(p ? (p[k] ?? '') : '');
      const subjKind = c.subject_kind || '';
      return `
        <div class="ctxbox">
          <h3 style="margin:0 0 2px;font-size:13px;">Context that produced this kit</h3>
          <p class="why">The generator sees exactly this. If it is wrong or stale, the copy is wrong.</p>
          <div class="kitmeta${profileStale ? ' warn' : ''}">
            Global profile: ${p ? 'v' + esc(p.version) + ', saved ' + esc(p.created_at) : 'not set yet'}.
            ${hasKit(c) ? ' This kit was written against ' + (kitProfileV === null || kitProfileV === undefined ? 'no profile' : 'v' + esc(kitProfileV)) + '.' : ''}
            ${profileStale ? ' The profile changed after this kit was generated, so this copy predates it.' : ''}
          </div>
          <input type="text" id="pfChannel" placeholder="channel name" value="${f('channel_name')}" />

          <div class="editrow" style="margin-top:6px;">

          </div>

          <div class="kitmeta${ctxStale ? ' warn' : ''}" style="margin-top:12px;">
            Subject of recording ${c.vod_id} (${esc(c.session_label)}): who the clip is about.
            ${c.context_version ? ' Context v' + esc(c.context_version) + '.' : ' Not set. The generator treats this as unknown, never as you.'}

                   value="${esc(c.subject_text || '')}" />

            requires a description, so your personal profile is never applied to them.</div>

    function renderKitDetail(c) {
      // D-073 safety reset: this view has no trim slider, so a stuck `true`
      // from a drag interrupted by a view switch must not wedge pollRefresh's
      // guard while looking at the post-kit view.
      sliderDragActive = false;
      const kit = hasKit(c);
      // RS-06: every candidate in this view has drive_synced_at set, which
      // means a clips row necessarily exists (and clip_state is populated) --
      // but this is asserted explicitly, the same guard the main (non-kit)
      // view uses, rather than assumed from the view's own filter.
      const hasClip = !(c.clip_state === null || c.clip_state === undefined);
      const v = kitValues(c);
      const key = selectedHookKey(c);
      const hookText = hookTextFor(c, key);
      const tagCount = (v.hashtags || '').split(/\s+/).filter(Boolean).length;
      const variantLabel = {
        withheld: 'A &middot; withholds',
        domain: 'B &middot; names the domain',
        payoff: 'C &middot; names the payoff',
      };

      const missingPanel = `
        <div class="emptykit">
          ${c.request_state === 'failed'
            ? `<b>Generation failed</b>${c.request_requested_at ? ' (requested ' + esc(c.request_requested_at) + ')' : ''}.<br />
               <span class="kitmeta bad">${esc(c.request_error || 'No reason recorded.')}</span><br />
               Nothing was written. A failed run persists no partial kit. Regenerate to try again.`
            : `<b>No kit yet.</b> This clip is delivered, but the generator has not produced copy for it.
               This is missing, not empty.
               ${c.post_kit_enabled === 0 ? '<br />Post kit generation is switched <b>off</b> for this clip.' : ''}
               ${regenPending(c) ? '<br />A regenerate was requested at ' + esc(c.request_requested_at) + ' and has not been answered yet.' : ''}`}
