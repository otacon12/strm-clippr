      const copyBlocks = !kit ? missingPanel : `
        <div class="kitblock">
          <h3>1. On-video text: the hook you type into the platform's text tool</h3>
          <p class="why">One short line. Instagram officially demotes reels that are majority text, so the
            mockup on the left is the check: if the frame reads as text, cut words.
            The three variants are deliberately spread along the concreteness axis, not three rewordings
            of one idea (a meta-analysis of 8,977 headline experiments found 50.9% of headlines got worse
            when made more concrete and only 8.7% better, so the right level is not knowable in advance).
            No controlled evidence exists on question versus statement hooks, so neither is preferred here.</p>
          ${['withheld', 'domain', 'payoff'].map((k) => `
            <div class="variant">
              <button class="pick${k === key ? ' on' : ''}" data-hook="${k}" title="Show this one in the mockup">${variantLabel[k]}</button>
              <textarea data-field="${HOOK_FIELDS[k]}" rows="2" placeholder="required">${esc(v[HOOK_FIELDS[k]])}</textarea>
              <button class="copybtn" data-copy="${HOOK_FIELDS[k]}">Copy</button>
            </div>`).join('')}
          <div class="kitmeta" id="hookWords"></div>
        </div>

        <div class="kitblock">
          <h3>2. Captions: the real speech, as a subtitle file</h3>
          <p class="why">Built from the whisper transcript already stored for this window. Platform
            auto-captions mangle this project's vocabulary (n8n, psycopg2, Coolify) and whisper already
            got it right. Upload the .srt with the clip.</p>
          ${captionsPanel(c)}
          <div class="editrow" style="margin-top:6px;">
            <button class="copybtn" data-copy="srt_text">Copy captions</button>
            ${c.srt_text ? `<a class="copybtn" style="text-decoration:none;display:inline-block;"
               href="/api/candidates/${c.id}/captions.srt" download>Download captions (.srt)</a>` : ''}
          </div>
        </div>

        <div class="kitblock">
          <h3>3. Video caption: the post descriptor</h3>
          <p class="why">What accompanies the clip in the post body.</p>
          <textarea data-field="video_caption" rows="4" placeholder="required">${esc(v.video_caption)}</textarea>
          <div class="editrow" style="margin-top:6px;">
            <button class="copybtn" data-copy="video_caption">Copy caption</button>
          </div>
          <div class="kitmeta" style="margin-top:8px;">Hashtags (minimal on purpose, space separated)</div>
          <input type="text" data-field="hashtags" value="${esc(v.hashtags)}" placeholder="none" />
          <div class="kitmeta${tagCount > 3 ? ' warn' : ''}">${tagCount} tag${tagCount === 1 ? '' : 's'}.
            Hashtags are near-dead as reach: Instagram caps at 5, and a study of 24.3M posts found posts
            with hashtags got 31% fewer views. Two or three, never a wall.</div>
          <div class="editrow" style="margin-top:6px;">
            <button class="copybtn" data-copy="hashtags">Copy hashtags</button>
            <button class="copybtn" data-copy="caption_tags">Copy caption + hashtags</button>
          </div>
          ${c.quoted_line ? `<div class="kitmeta" style="margin-top:8px;">Quoted from the transcript, verbatim:
            <b>${esc(c.quoted_line)}</b></div>` : ''}
        </div>

        <div class="kitblock">
          <div class="editrow">
            <button class="savewin" id="btnSaveKit">Save kit edits</button>
            <button class="nudge" id="btnRegen">Regenerate copy</button>
            <span class="unsaved" id="kitUnsaved" style="display:${kitHasUnsaved(c) ? 'inline-flex' : 'none'};">Unsaved edit</span>
          </div>
          <div class="kitmeta">Saving never overwrites. It writes v${(c.kit_version || 0) + 1} and keeps
            every earlier version. Regenerating asks first if the active version is yours, and the server
            refuses it outright without that confirmation.</div>
          ${c.vision_model || c.writer_model ? `<div class="kitmeta">Generated by ${esc(c.vision_model || 'no vision model')}
            + ${esc(c.writer_model || 'no writer model')}${c.passthrough_degraded === 1
              ? '. Quality parameters were refused by the provider, so this ran at defaults.' : '.'}</div>` : ''}
          <div class="kitmeta" id="kitHistory"></div>
        </div>`;

      detailEl.innerHTML = `
        <h2 style="margin:0 0 8px;">Candidate #${c.id} &middot; Post kit</h2>
        <div class="hint">Session ${esc(c.session_label)} &middot; vod ${c.vod_id} &middot; delivered ${esc(c.drive_synced_at)}</div>
        <div class="winline">${kitStampHtml(c)}</div>
        <label class="genrow"><input type="checkbox" id="genKit" ${c.post_kit_enabled === 0 ? '' : 'checked'} />
          Generate a post kit for this clip. Intent only: the generator reads this.</label>
        <label class="genrow"><input type="checkbox" id="burnCaps" ${c.burn_captions === 1 ? 'checked' : ''} />
          Burn speech captions into this clip. Intent only: it applies to the next render, it cannot
          change the file already delivered.</label>
        <div class="winline">${captionsFactHtml(c)}</div>
        ${captionsIntentNote(c)}
        ${hasClip ? `
        <div class="editrow" style="margin:0 0 14px;">
          <!-- RS-06: present whenever a rendered clip row exists, independent
               of whether a post kit has been generated yet -- Re-render is a
               VIDEO action, Regenerate (inside the kit block below, kit-only)
               is a COPY action. Same id/handler as before; only its position
               moved, so it is no longer trapped inside the kit-exists branch. -->
          <button class="nudge" id="btnRerender" title="Re-cut the video file with the current caption setting">Re-render video</button>
          <span class="hint">Re-cuts this file with the current caption setting and uploads it again.</span>
        </div>` : ''}
        <div class="kitgrid">
          <div>
            <div class="phone" id="phoneFrame">
              <video id="kitVid" playsinline preload="metadata" src="/clipmedia/${c.id}"></video>
              <div class="missing" id="clipMissing" style="display:none;">
                Clip file not reachable from this machine.<br />
                The mockup still works for the copy, only the video is unavailable here.
              </div>
              <div class="guide top" style="display:${showGuides ? 'block' : 'none'};"></div>
              <div class="guide bottom" style="display:${showGuides ? 'block' : 'none'};"></div>
              <div class="guide rail" style="display:${showGuides ? 'block' : 'none'};"></div>
              <div class="hookband"><span class="hooktext" id="hookText">${esc(hookText)}</span></div>
            </div>
            <div class="editrow" style="margin-top:8px;">
              <button class="replaywin" id="btnPlayClip">Play</button>
              <button class="nudge" id="btnGuides">${showGuides ? 'Hide' : 'Show'} platform guides</button>
            </div>
            <div class="coverage" id="coverage"></div>
            <div class="postmeta">
              <div class="kit-handle">${esc(profileState && profileState.handle ? profileState.handle : 'your handle')}</div>
              <div class="cap" id="postCaption">${esc(v.video_caption)}</div>
              <div class="tags" id="postTags">${esc(v.hashtags)}</div>
            </div>
            <div class="kitmeta">Dashed regions are covered by the platform's own UI. The hook is a CSS
              overlay on top of the video. It is never burned into the delivered file and never will be
              (D-061): you type it into the platform's own text tool. Speech captions are the one
              exception, and only when you tick the box above. They are burned during the render, sit
              along the bottom clear of these guides, and this mockup does not show them.</div>
          </div>
          <div>
            ${copyBlocks}
            ${profilePanel(c)}
          </div>
        </div>`;

      wireKitDetail(c);
    }

    function wireKitDetail(c) {
      const vid = document.getElementById('kitVid');
      const missing = document.getElementById('clipMissing');
      if (vid && missing) {
        // An unreachable clip is a STATE, said plainly — never a silently
        // broken player that looks like the kit itself failed.
        vid.onerror = () => { missing.style.display = 'flex'; vid.style.display = 'none'; };
      }
      const playBtn = document.getElementById('btnPlayClip');
      if (playBtn && vid) {
        playBtn.onclick = () => { if (vid.paused) { vid.play(); playBtn.textContent = 'Pause'; }
                                  else { vid.pause(); playBtn.textContent = 'Play'; } };
      }
      const guidesBtn = document.getElementById('btnGuides');
      if (guidesBtn) {
        guidesBtn.onclick = () => { showGuides = !showGuides; renderDetail(); };
      }
      const genEl = document.getElementById('genKit');
      if (genEl) genEl.onchange = () => setGenerate(c, genEl.checked);
      const capEl = document.getElementById('burnCaps');
      if (capEl) capEl.onchange = () => setCaptions(c, capEl.checked);

      detailEl.querySelectorAll('.variant .pick').forEach((b) => {
        b.onclick = () => { hookPick[c.id] = b.dataset.hook; repaintOverlay(); };
      });

      // Typing updates the DRAFT and repaints the mockup live. Nothing is
      // written to the database until Save.
      detailEl.querySelectorAll('[data-field]').forEach((el) => {
        el.oninput = () => {
          const d = kitDrafts[c.id] || Object.assign({}, kitValues(c));
          d[el.dataset.field] = el.value;
          kitDrafts[c.id] = d;
          const flag = document.getElementById('kitUnsaved');
          if (flag) flag.style.display = kitHasUnsaved(c) ? 'inline-flex' : 'none';
          if (el.dataset.field === 'video_caption') {
            const pc = document.getElementById('postCaption');
            if (pc) pc.textContent = el.value;
          }
          if (el.dataset.field === 'hashtags') {
            const pt = document.getElementById('postTags');
            if (pt) pt.textContent = el.value;
          }
          repaintOverlay();
        };
      });

      detailEl.querySelectorAll('.copybtn[data-copy]').forEach((b) => {
        b.onclick = () => {
          const vals = kitValues(c);
          const what = b.dataset.copy;
          let text = '';
          if (what === 'caption_tags') text = [vals.video_caption, vals.hashtags].filter(Boolean).join('\n\n');
          else text = vals[what] || '';
          copyText(text, b);
        };
      });

      const saveBtn = document.getElementById('btnSaveKit');
      if (saveBtn) saveBtn.onclick = () => saveKit(c);
      const regenBtn = document.getElementById('btnRegen');
      if (regenBtn) regenBtn.onclick = () => requestRegenerate(c);
      const rrBtn = document.getElementById('btnRerender');
      if (rrBtn) rrBtn.onclick = () => rerenderClip(c, rrBtn);
      const pfBtn = document.getElementById('btnSaveProfile');
      if (pfBtn) pfBtn.onclick = () => saveProfile();
      const subjBtn = document.getElementById('btnSaveSubj');
      if (subjBtn) subjBtn.onclick = () => saveSubject(c);
      const meBtn = document.getElementById('btnSubjMe');
      const otherBtn = document.getElementById('btnSubjOther');
      if (meBtn && otherBtn) {
        meBtn.onclick = () => { subjectPick[c.vod_id] = 'me'; meBtn.classList.add('on'); otherBtn.classList.remove('on'); };
        otherBtn.onclick = () => { subjectPick[c.vod_id] = 'other'; otherBtn.classList.add('on'); meBtn.classList.remove('on'); };
      }

      repaintOverlay();
      loadHistory(c);
    }

    async function loadHistory(c) {
      const out = document.getElementById('kitHistory');
      if (!out) return;
      try {
        const res = await fetch(`/api/candidates/${c.id}/kits`, { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        const rows = (data.versions || []).map((k) =>
          `<div class="histrow">v${k.version} ${esc(k.origin)}${k.is_active === 1 ? ' &middot; active' : ''} &middot; ${esc(k.created_at)}</div>`
        ).join('');
        const reqs = (data.requests || []).map((q) =>
          `<div class="histrow">Request ${esc(q.state)} &middot; ${esc(q.requested_at)}${q.force_over_operator_edit === 1 ? ' (confirmed over your edit)' : ''}${q.error ? ': ' + esc(q.error) : ''}</div>`
        ).join('');
        out.innerHTML = (rows + reqs) || '<div class="histrow">No versions yet.</div>';
      } catch (_) { /* history is informational, never surface a transient error */ }
    }

    // ------------------------------------------------------------------ D-063
    // BURNED-IN SPEECH CAPTIONS. Two facts, never merged into one badge:
    //
    //   the TOGGLE (c.burn_captions)   — what you want for the NEXT render.
    //   the FILE   (c.captions_burned) — what the delivered clip actually has.
    //
    // They are allowed to disagree, and when they do the honest thing is to
    // say so rather than to pick whichever one flatters the surface. A clip
    // shown as captioned that has no captions is the exact failure this
    // project keeps paying for, so `captions_burned` is the ONLY field that
    // may ever produce the words "has captions".

    function captionsFactHtml(c) {
      if (c.clip_state === null || c.clip_state === undefined) {
        return 'Captions: <b>no clip rendered yet</b>.';
      }
      if (c.captions_burned === 1) {
        return `Captions: <b>burned in</b> (${c.captions_cue_count} cue${c.captions_cue_count === 1 ? '' : 's'}).`;
      }
      if (c.captions_requested === 1 && c.captions_cue_count === 0) {
        return 'Captions: <b>none burned</b>. They were requested, but nobody speaks inside this window.';
      }
      return 'Captions: <b>none burned</b>. This file has no text in it.';
    }

    // The gap between intent and file, stated plainly wherever it exists. This
    // is not a warning about a bug, it is the surface telling you the file on
    // disk does not match what the toggle now says, which is exactly the state
    // the Mac-side deliverer refuses on.
    function captionsIntentNote(c) {
      const rendered = !(c.clip_state === null || c.clip_state === undefined);
      if (!rendered) return '';
      // D-063 fixer: "requested, but nobody speaks in this window" is NOT a
      // gap between intent and file — the render did exactly what was asked
      // and there was nothing to burn. captionsFactHtml already says so on
      // this same card, and this function used to contradict it by telling the
      // operator to re-render, which reproduces the identical row forever.
      const noSpeech = (c.captions_requested === 1 && c.captions_cue_count === 0);
      if (c.burn_captions === 1 && c.captions_burned !== 1 && !noSpeech) {
        // A delivered clip has no next render (D-056), so do not promise one.
        if (c.drive_synced_at) {
          return `<div class="genrow" style="color:var(--maybe);">Captions are on, but the file that was
            already delivered does not carry them. The toggle cannot change a delivered clip: it only
            applies if this candidate is ever rendered again.</div>`;
        }
        return `<div class="genrow" style="color:var(--maybe);">Captions are on, but the rendered file
          does not carry them. It has to be re-rendered on the server lane to gain them, and the Mac
          batch deliverer will refuse this clip until then rather than ship it uncaptioned.</div>`;
      }
      if (c.burn_captions === 0 && c.captions_burned === 1) {
        if (c.drive_synced_at) {
          return `<div class="genrow" style="color:var(--maybe);">Captions are off, but the file that was
            already delivered has them burned in. Unticking the box cannot take them out of a clip that
            has shipped.</div>`;
        }
        return `<div class="genrow" style="color:var(--maybe);">Captions are off, but the rendered file
          already has them burned in. Re-tick captions, or re-render, before delivering.</div>`;
      }
      return '';
    }

    // D-063 fixer: THE TOGGLE MUST LAND BEFORE THE VERDICT.
    //
    // setCaptions is async and the checkbox fires it on change, but decide()
    // did not wait for it. Tick captions and hit Approve (or the `a` key)
    // straight after, and the verdict POST could win the race: the server
    // commits the approval and fires the delivery webhook, and the server lane
    // then reads burn_captions from the database as it was BEFORE the tick.
    // The clip renders uncaptioned and every row about it is honest, so
    // nothing anywhere reports a problem — the operator's intent is simply
    // gone, on the single action this whole feature exists for.
    //
    // decide() awaits this promise, so the verdict is always sent against the
    // flag the operator actually set. Deliberately NOT wired to setGenerate:
    // post_kit_enabled is read long after delivery, not by the webhook the
    // verdict fires, so there is no comparable window there.
    let pendingIntentSave = null;

    async function setCaptions(c, value) {
      const save = (async () => {
      gen += 1;
      try {
        const res = await fetch(`/api/candidates/${c.id}/captions-toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ burn_captions: value }),
        });
        if (!res.ok) {
          let body = '';
          try { body = JSON.stringify(await res.json()); } catch (_) {}
          notify('Could not update the captions setting.', { technical: `${res.status} ${body}` });
          await loadCandidates();
          return;
        }
        const row = await res.json();
        const j = indexOfRow(row.id);
        if (j !== -1) { candidates[j] = mergeLocalFlags(candidates[j], row); idx = j; }
        renderList();
        renderDetail();
      } catch (err) {
        notify('Could not reach the server to update the captions setting.', { technical: String(err) });
      }
      })();
      // Cleared in a finally so a rejected save can never wedge every future
      // verdict behind a promise that will not settle again.
      pendingIntentSave = save;
      try {
        await save;
      } finally {
        if (pendingIntentSave === save) pendingIntentSave = null;
      }
    }

    async function setGenerate(c, value) {
      gen += 1;
      try {
        const res = await fetch(`/api/candidates/${c.id}/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ post_kit_enabled: value }),
        });
        if (!res.ok) {
          let body = '';
          try { body = JSON.stringify(await res.json()); } catch (_) {}
          notify('Could not update the post kit setting.', { technical: `${res.status} ${body}` });
          await loadCandidates();
          return;
        }
        const row = await res.json();
        const j = indexOfRow(row.id);
        if (j !== -1) { candidates[j] = mergeLocalFlags(candidates[j], row); idx = j; }
        renderList();
        renderDetail();
      } catch (err) {
        notify('Could not reach the server to update the post kit setting.', { technical: String(err) });
      }
    }

    // The pending queue's rows do not carry kit columns, so a kit-endpoint
    // response is a SUPERSET there. Merging keeps the local-only _webhook flag
    // that D-056 sets on the card.
    function mergeLocalFlags(oldRow, newRow) {
      if (oldRow && oldRow._webhook && (newRow.clip_state === null || newRow.clip_state === undefined)) {
        newRow._webhook = oldRow._webhook;
      }
      return newRow;
    }

    // Human names for the schema's NOT NULL kit fields, used only in the
    // client-side pre-check below so the message names what the operator
    // sees on the card, not the database column.
    const KIT_REQUIRED_FIELD_NAMES = {
      hook_withheld: 'Hook A (withholds)',
      hook_domain: 'Hook B (names the domain)',
      hook_payoff: 'Hook C (names the payoff)',
      video_caption: 'Video caption',
    };

    async function saveKit(c) {
      if (!hasKit(c)) return;
      const v = kitValues(c);
      // The schema declares the three hooks and the caption NOT NULL, so the
      // server refuses a blank one. Say so here rather than sending a request
      // that is guaranteed to fail.
      for (const f of ['hook_withheld', 'hook_domain', 'hook_payoff', 'video_caption']) {
        if (!(v[f] || '').trim()) {
          notify(`${KIT_REQUIRED_FIELD_NAMES[f]} cannot be empty. Fill it in and save again.`,
            { technical: `${f} cannot be empty: the schema requires all three hooks and the caption.` });
          return;
        }
      }
      gen += 1;
      let res;
      try {
        res = await fetch(`/api/candidates/${c.id}/kit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            base_version: c.kit_version,
            hook_withheld: v.hook_withheld,
            hook_domain: v.hook_domain,
            hook_payoff: v.hook_payoff,
            video_caption: v.video_caption,
            hashtags: (v.hashtags || '').split(/\s+/).filter(Boolean),
            srt_text: v.srt_text || null,
          }),
        });
      } catch (err) {
        notify('Could not reach the server. Check your connection and try again.', { technical: String(err) });
        return;
      }
      if (!res.ok) {
        let body = '';
        try { body = JSON.stringify(await res.json()); } catch (_) {}
        notify('The server refused to save this kit.', { technical: `${res.status} ${body}` });
        return;
      }
      const row = await res.json();
      delete kitDrafts[row.id];
      const j = indexOfRow(row.id);
      if (j !== -1) { candidates[j] = row; idx = j; }
      renderList();
      renderDetail();
    }

    // RE-RENDER THE VIDEO (distinct from Regenerate, which rebuilds the COPY).
    // Re-cuts the mp4 with whatever burn_captions currently says, which is the
    // only way a caption decision taken AFTER delivery reaches Drive.
    async function rerenderClip(c, btn) {
      const on = c.burn_captions === 1;
      const msg = 'Re-render this clip?\n\n'
        + 'It re-cuts the video with captions ' + (on ? 'on' : 'off')
        + ' and uploads it again.\n\n'
        + 'The upload creates a new file rather than replacing one, so delete the '
        + 'previous copy from Drive first if it is still there.';
      if (!confirm(msg)) return;
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = 'Re-rendering...';
      try {
        const res = await fetch(`/api/candidates/${c.id}/rerender`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
        const j = await res.json().catch(() => ({}));
        if (!res.ok) {
          notify('Re-render refused.', { technical: String(j.error || res.status) });
          return;
        }
        // The chain runs on the server; the row will not be updated by the time
        // this returns. Say that rather than implying it is already done.
        notify(`Re-render queued with captions ${on ? 'on' : 'off'}. It takes a moment. Refresh to see the new file.`,
          { kind: 'info', technical: 'webhook: ' + (j.webhook || '?') });
      } catch (e) {
        notify('Re-render failed. Check your connection and try again.', { technical: String(e) });
      } finally {
        btn.disabled = false; btn.textContent = label;
      }
    }

    async function requestRegenerate(c) {
      if (kitHasUnsaved(c)) {
        notify('Save your edits first, then regenerate.',
          { technical: 'You have unsaved edits. Save them or reload the card before regenerating.' });
        return;
      }
      let confirmFlag = false;
      if (hasKit(c) && c.kit_origin === 'operator_edit') {
        // The server refuses this without confirm=true regardless of what the
        // browser does. This dialog exists so the refusal is not a dead end.
        if (!window.confirm(
          `The active version (v${c.kit_version}) is your edit.\n\n`
          + 'Regenerating asks the generator to write a new machine draft on top of it. Your version is '
          + 'kept forever and stays readable in the history, but the active kit will no longer be your '
          + 'words.\n\nRegenerate anyway?')) {
          return;
        }
        confirmFlag = true;
      }
      gen += 1;
      let res;
      try {
        res = await fetch(`/api/candidates/${c.id}/kit/regenerate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ confirm: confirmFlag }),
        });
      } catch (err) {
        notify('Could not reach the server. Check your connection and try again.', { technical: String(err) });
        return;
      }
      if (!res.ok) {
        let body = '';
        try { body = JSON.stringify(await res.json()); } catch (_) {}
        notify('Regenerate was refused.', { technical: `${res.status} ${body}` });
        return;
      }
      const row = await res.json();
      const j = indexOfRow(row.id);
      if (j !== -1) { candidates[j] = row; idx = j; }
      renderList();
      renderDetail();
      if (row.regenerate_command) {
        notify('Regenerate requested. It is recorded for the generator lane.',
          { kind: 'info', technical: 'To run it yourself right now:\n' + row.regenerate_command });
      }
    }

    async function loadProfile() {
      try {
        const res = await fetch('/api/profile', { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        profileState = data.profile;
      } catch (_) { /* the surface still works without it */ }
    }

    async function saveProfile() {
      const get = (id) => {
        const el = document.getElementById(id);
        return el && el.value.trim() !== '' ? el.value : null;
      };
      let res;
      try {
        res = await fetch('/api/profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            base_version: profileState ? profileState.version : null,
            channel_name: get('pfChannel'),
            handle: get('pfHandle'),
            platforms: get('pfPlatforms'),
            style_notes: get('pfStyle'),
            do_nots: get('pfDoNots'),
            extra_context: get('pfExtra'),
          }),
        });
      } catch (err) {
        notify('Could not reach the server to save your profile.', { technical: String(err) });
        return;
      }
      if (!res.ok) {
        let body = '';
        try { body = JSON.stringify(await res.json()); } catch (_) {}
        notify('The server refused to save your profile.', { technical: `${res.status} ${body}` });
        return;
      }
      const data = await res.json();
      profileState = data.profile;
      renderDetail();
    }

    async function saveSubject(c) {
      const kind = subjectPick[c.vod_id] || c.subject_kind;
      if (!kind) {
        notify('Choose "me" or "someone else" first. A recording with no subject is treated as unknown, never as you.');
        return;
      }
      const textEl = document.getElementById('subjText');
      const notesEl = document.getElementById('ctxNotes');
      let res;
      try {
        res = await fetch(`/api/recordings/${c.vod_id}/subject`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subject_kind: kind,
            subject_text: textEl && textEl.value.trim() !== '' ? textEl.value : null,
            context_notes: notesEl && notesEl.value.trim() !== '' ? notesEl.value : null,
          }),
        });
      } catch (err) {
        notify('Could not reach the server to save the subject.', { technical: String(err) });
        return;
      }
      if (!res.ok) {
        let body = '';
        try { body = JSON.stringify(await res.json()); } catch (_) {}
        notify('The server refused to save the subject.', { technical: `${res.status} ${body}` });
        return;
      }
      const rec = await res.json();
      // Every card from the same recording carries this context, so update all
      // of them rather than only the visible one.
      for (const row of candidates) {
        if (row.vod_id === rec.recording_id) {
          row.context_version = rec.version;
          row.subject_kind = rec.subject_kind;
          row.subject_text = rec.subject_text;
          row.context_notes = rec.context_notes;
        }
      }
      delete subjectPick[c.vod_id];
      renderDetail();
    }

    // ---------------------------------------------------------------- D-073
    // THE TRIM SLIDER. Track = the SLICE (original window +/- SLICE_PAD_S),
    // mirroring workers/slice_geometry.py's slice_start()/slice_end() EXACTLY
    // (max(0, original_start - PAD) .. original_end + PAD, duration-clamped
    // when known). This is presentation only: it bounds where the operator
    // CAN drag, matching what was actually staged. It does NOT change what
    // the numeric fine-edit fallback accepts -- an out-of-slice numeric edit
    // is still legal (D-055: it fails loud at render and falls back to the
    // Mac deliverer), so only the slider's own drag math clamps.
    const SLICE_PAD_S = 10.0;

    function sliceBounds(c) {
      let lo = Math.max(0, c.start_s - SLICE_PAD_S);
      let hi = c.end_s + SLICE_PAD_S;
      if (typeof sliderVideoDuration === 'number' && isFinite(sliderVideoDuration)) {
        hi = Math.min(hi, sliderVideoDuration);
      }
      if (hi <= lo) hi = lo + 0.1;
      return { lo, hi };
    }

    // Serif timecode chip format, mm:ss.d (spec example: "00:04.2").
    function tc(seconds) {
      if (seconds === null || seconds === undefined || !isFinite(seconds)) return '--:--.-';
      let s = Math.max(0, seconds);
      let m = Math.floor(s / 60);
      let rem = s - m * 60;
      if (rem >= 59.95) { rem = 0; m += 1; } // float-precision guard at the minute boundary
      return `${String(m).padStart(2, '0')}:${rem.toFixed(1).padStart(4, '0')}`;
    }

    function pctFor(seconds, lo, hi) {
      const span = hi - lo;
      if (span <= 0) return 0;
      return Math.min(100, Math.max(0, (seconds - lo) / span * 100));
    }

    function secondsFromClientX(clientX, trackEl, lo, hi) {
      const rect = trackEl.getBoundingClientRect();
      const pct = rect.width > 0 ? Math.min(1, Math.max(0, (clientX - rect.left) / rect.width)) : 0;
      return Math.round((lo + pct * (hi - lo)) * 10) / 10;
    }

    // Shared clamp: slice bounds + a 0.1s minimum gap between handles, so a
    // drag/nudge/I-O keypress can never produce start >= end (which the
    // server's window endpoint would 400 on). edgeMoved is 'start' or 'end'
    // -- whichever edge the gesture is actively moving, so the OTHER edge is
    // the one held fixed when the gap has to be enforced.
    function clampWindowDraft(next, c, edgeMoved) {
      const { lo, hi } = sliceBounds(c);
      if (next.start < lo) next.start = lo;
      if (next.end > hi) next.end = hi;
      if (next.end - next.start < 0.1) {
        if (edgeMoved === 'end') next.end = Math.min(hi, next.start + 0.1);
        else next.start = Math.max(lo, next.end - 0.1);
      }
      next.start = Math.round(next.start * 10) / 10;
      next.end = Math.round(next.end * 10) / 10;
      return next;
    }

    // Repaints every slider element from CURRENT state (drafts/saved window),
    // without touching the video element -- called after every drag move,
    // nudge, keyboard edit, I/O keypress, and on loadedmetadata (the slice's
    // upper bound can tighten once the real duration is known). Also repaints
    // the fine-edit fallback spans and the Save/unsaved chips, since they
    // reflect the identical draft state.
    function renderSliderPositions(c) {
      const sliderEl = document.getElementById('trimSlider');
      if (!sliderEl) return;
      const { lo, hi } = sliceBounds(c);
      const ed = editorValues(c);
      const startPct = pctFor(ed.start, lo, hi);
      const endPct = pctFor(ed.end, lo, hi);
      const widthPct = Math.max(0, endPct - startPct);
      const midPct = (startPct + endPct) / 2;
      const dur = Math.max(0, ed.end - ed.start);

      const ticks = sliderEl.querySelectorAll('.tick');
      if (ticks[0]) ticks[0].style.left = pctFor(c.start_s, lo, hi) + '%';
      if (ticks[1]) ticks[1].style.left = pctFor(c.end_s, lo, hi) + '%';

      const handleIn = document.getElementById('handleIn');
      const handleOut = document.getElementById('handleOut');
      const region = document.getElementById('trimRegion');
      const durChip = document.getElementById('trimDuration');
      if (handleIn) {
        handleIn.style.left = startPct + '%';
        handleIn.setAttribute('aria-valuenow', String(ed.start));
        handleIn.setAttribute('aria-valuemin', String(lo));
        handleIn.setAttribute('aria-valuemax', String(hi));
        const chip = handleIn.querySelector('.chip-time');
        if (chip) chip.textContent = tc(ed.start);
      }
      if (handleOut) {
        handleOut.style.left = endPct + '%';
        handleOut.setAttribute('aria-valuenow', String(ed.end));
        handleOut.setAttribute('aria-valuemin', String(lo));
        handleOut.setAttribute('aria-valuemax', String(hi));
        const chip = handleOut.querySelector('.chip-time');
        if (chip) chip.textContent = tc(ed.end);
      }
      if (region) { region.style.left = startPct + '%'; region.style.width = widthPct + '%'; }
      if (durChip) { durChip.style.left = midPct + '%'; durChip.textContent = fmt(dur, 1) + 's'; }

      const valStart = document.getElementById('valStart');
      if (valStart) valStart.textContent = `${fmt(ed.start, 1)}s`;
      const valEnd = document.getElementById('valEnd');
      if (valEnd) valEnd.textContent = `${fmt(ed.end, 1)}s`;

      const saveBtn = document.getElementById('btnSaveWin');
      if (saveBtn) saveBtn.style.display = hasUnsaved(c) ? 'inline-flex' : 'none';
      const flag = document.getElementById('unsavedFlag');
      if (flag) flag.style.display = hasUnsaved(c) ? 'inline-flex' : 'none';
      // Every draft mutation (drag, nudge, I/O, reset, loadedmetadata's
      // tightened bounds) can change whether the region start still matches
      // the playhead, so the snap chip is re-evaluated from here too, not
      // only from the video's own pause/seek events below.
      updateSnapAffordance(c);
    }

    function renderPlayheadPosition(c, seconds) {
      const ph = document.getElementById('trimPlayhead');
      if (!ph) return;
      const { lo, hi } = sliceBounds(c);
      ph.style.left = pctFor(seconds, lo, hi) + '%';
    }

    // Builds the trim-slider block's markup. Always rendered (so the operator
    // always sees where the window sits); interaction is wired only when
    // editable (wireSlider below returns early otherwise), and the disabled
    // CSS state (pointer-events:none, dimmed) makes that visible too.
    function renderTrimBlock(c, ed, editable) {
      const { lo, hi } = sliceBounds(c);
      const origStartPct = pctFor(c.start_s, lo, hi);
      const origEndPct = pctFor(c.end_s, lo, hi);
      const startPct = pctFor(ed.start, lo, hi);
      const endPct = pctFor(ed.end, lo, hi);
      const widthPct = Math.max(0, endPct - startPct);
      const midPct = (startPct + endPct) / 2;
      const dur = Math.max(0, ed.end - ed.start);
      const nudges = (field) => ['-5', '-1', '+1', '+5'].map((d) =>
        `<button class="nudge" data-field="${field}" data-delta="${d}">${d}s</button>`
      );

      const fineEdit = !editable ? '' : `
        <details class="fineedit">
          <summary>Fine-edit with numbers</summary>
          <div class="editpanel">
            <div class="editrow">
              <span class="editlabel">Start</span>
              ${nudges('start')[0]}${nudges('start')[1]}
              <span class="editval" id="valStart">${fmt(ed.start, 1)}s</span>
              ${nudges('start')[2]}${nudges('start')[3]}
            </div>
            <div class="editrow">
              <span class="editlabel">End</span>
              ${nudges('end')[0]}${nudges('end')[1]}
              <span class="editval" id="valEnd">${fmt(ed.end, 1)}s</span>
              ${nudges('end')[2]}${nudges('end')[3]}
            </div>
          </div>
        </details>`;

      const lockedChip = !editable
        ? '<span class="chip chip-muted">Locked, already approved</span>'
        : '';

      return `
        <div class="trimwrap">
          <div class="trimhead">
            <span class="trimlabel">Clip window</span>
            ${editable ? '<button class="nudge" id="btnSnapStart" style="display:none;" title="Move the clip start to the current paused position, keeping the same length">Move clip start here</button>' : ''}
            ${lockedChip}
          </div>
          <div class="slider${editable ? '' : ' disabled'}" id="trimSlider">
            <div class="slider-track"></div>
            <div class="tick" style="left:${origStartPct}%" title="Detector's original start"></div>
            <div class="tick" style="left:${origEndPct}%" title="Detector's original end"></div>
            <div class="slider-region" id="trimRegion" style="left:${startPct}%;width:${widthPct}%"></div>
            <span class="chip chip-duration" id="trimDuration" style="left:${midPct}%">${fmt(dur, 1)}s</span>
            <div class="slider-playhead" id="trimPlayhead" style="left:${startPct}%"></div>
            <div class="handle handle-in" id="handleIn" tabindex="${editable ? '0' : '-1'}" role="slider"
                 aria-label="Clip start" aria-valuemin="${lo}" aria-valuemax="${hi}" aria-valuenow="${ed.start}"
                 style="left:${startPct}%">
              <span class="chip chip-time">${tc(ed.start)}</span>
            </div>
            <div class="handle handle-out" id="handleOut" tabindex="${editable ? '0' : '-1'}" role="slider"
                 aria-label="Clip end" aria-valuemin="${lo}" aria-valuemax="${hi}" aria-valuenow="${ed.end}"
                 style="left:${endPct}%">
              <span class="chip chip-time">${tc(ed.end)}</span>
            </div>
          </div>
          <div class="trimfoot">
            <span class="hint">${editable
              ? 'Drag the handles to trim. Focus a handle, then use arrow keys to nudge 0.1s (Shift 1.0s). Press I or O to set in or out at the playhead.'
              : 'The window is locked because this clip is already approved.'}</span>
          </div>
          ${fineEdit}
          <div class="trimactions">
            <button class="replaywin" id="btnReplay">Preview clip</button>
            ${editable ? `<button class="savewin" id="btnSaveWin" style="display:${hasUnsaved(c) ? 'inline-flex' : 'none'};">Save window</button>` : ''}
            ${editable && hasAdjustment(c) ? '<button class="resetwin" id="btnResetWin">Reset to original</button>' : ''}
            <span class="unsaved" id="unsavedFlag" style="display:${editable && hasUnsaved(c) ? 'inline-flex' : 'none'};">Unsaved edit</span>
          </div>
        </div>`;
    }

    // RS-06 (ruled in scope via the redesign mandate): Re-render video must
    // be present for ANY candidate with a rendered clip row, not only in
    // post-kit states -- same guard rails (confirm dialog, server refusals
    // unchanged) as the post-kit view's identical control.
    function renderRerenderBlock(c) {
      const on = c.burn_captions === 1;
      return `
        <div class="trimwrap">
          <div class="trimhead"><span class="trimlabel">Rendered clip</span></div>
          <div class="hint">This candidate already has a rendered file. Re-render video re-cuts it with
            captions ${on ? 'on' : 'off'} (the current setting) and uploads it again.</div>
          <div class="trimactions">
            <button class="nudge" id="btnRerenderInline" title="Re-cut the video file with the current caption setting">Re-render video</button>
          </div>
        </div>`;
    }

    function renderDetail() {
      // D-073 safety reset, unconditional: detailEl's innerHTML is about to
      // be replaced on every path below, which tears down any slider handle
      // a pointer is still captured on (e.g. a keyboard-triggered card
      // switch mid-drag). A stuck `true` would wedge pollRefresh's guard
      // forever, so every render starts from a clean slate.
      sliderDragActive = false;
      if (listError) {
        detailEl.innerHTML = listErrorHtml();
        return;
      }
      if (!candidates.length) {
        detailEl.innerHTML = `<div class="empty">${esc(emptyQueueMessage())}</div>`;
        return;
      }
      const c = candidates[idx];
      if (view === 'delivered') {
        renderKitDetail(c);
        return;
      }
      // D-055: the video fragment and the window display use the EFFECTIVE
      // (saved) window — adjusted else original. Originals stay for reference.
      const eff = effectiveWindow(c);
      const edited = adjustedDiffers(c);
      const ed = editorValues(c);
      // D-056: pending now really does carry approved (awaiting-delivery)
      // cards, so this check is live routing, not just a backstop: approved
      // cards get a locked slider and locked verdict buttons (the server
      // 409s both anyway). Preview stays available either way.
      const editable = c.state !== 'approved';
      const videoSrc = `/media/${c.vod_id}#t=${encodeURIComponent(eff.start)},${encodeURIComponent(eff.end)}`;
      // D-073: a fresh video element means a fresh duration to (re)learn.
      sliderVideoDuration = null;
      const hasClip = !(c.clip_state === null || c.clip_state === undefined);
      // Action buttons per queue (D-050 upgrade paths):
      // pending: Approve/Reject/Maybe | maybe: Approve/Reject | rejected: Approve/Maybe
      detailEl.innerHTML = `
        <h2 style="margin:0 0 8px;">Candidate #${c.id}</h2>
        <div class="hint">Session ${c.session_label} &middot; vod ${c.vod_id}</div>
        <div class="hint">${c.vod_path}</div>
        <div class="winline">Window ${fmt(eff.start, 1)}s to ${fmt(eff.end, 1)}s
          ${edited ? '<span class="chip badge">Edited</span>' : ''}
          ${edited ? `<span class="orig">(original ${fmt(c.start_s, 1)}s to ${fmt(c.end_s, 1)}s)</span>` : ''}
          ${deliveryBadgeHtml(c)}
        </div>
        <label class="genrow"><input type="checkbox" id="genKit" ${c.post_kit_enabled === 0 ? '' : 'checked'} />
          Generate a post kit for this clip (default on). This records intent only: the copy is
          generated after the clip is delivered.</label>
        <label class="genrow"><input type="checkbox" id="burnCaps" ${c.burn_captions === 1 ? 'checked' : ''} />
          Burn speech captions into this clip (default off). Captions go in during the render itself,
          so tick this before or at approval.</label>
        ${captionsIntentNote(c)}
        <video id="vid" controls preload="metadata" src="${videoSrc}"></video>
        ${renderTrimBlock(c, ed, editable)}
        <div class="actions">
          <button class="approve" id="btnApprove">Approve clip<span class="kbdchip">A</span></button>
          ${view !== 'rejected' ? '<button class="reject" id="btnReject">Reject clip<span class="kbdchip">R</span></button>' : ''}
          ${view === 'pending' || view === 'rejected' ? '<button class="maybe" id="btnMaybe">Mark maybe<span class="kbdchip">M</span></button>' : ''}
          <span class="hint" id="verdictLock" style="display:none;">Save or reset the window first.</span>
        </div>
        ${hasClip ? renderRerenderBlock(c) : ''}
        <pre>score=${fmt(c.score)}\naudio=${fmt(c.signal_audio)} transcript=${fmt(c.signal_transcript)} chat=${fmt(c.signal_chat)} beat_boost=${fmt(c.signal_beat_boost)}\ncreated_at=${c.created_at}</pre>
      `;
      document.getElementById('btnApprove').onclick = () => decide('approve');
      const rejectBtn = document.getElementById('btnReject');
      if (rejectBtn) rejectBtn.onclick = () => decide('reject');
      const maybeBtn = document.getElementById('btnMaybe');
      if (maybeBtn) maybeBtn.onclick = () => decide('maybe');
      // Preview exists whether or not the window is editable, so it is wired
      // unconditionally (same as the old Replay button in both its panels).
      const replayBtn = document.getElementById('btnReplay');
      if (replayBtn) replayBtn.onclick = () => replayWindow();
      // D-061: the generate toggle. Records intent only — it fires no
      // generation, touches no verdict, and is deliberately live in every
      // state (see the server's _set_generate for why it is not locked on
      // approved cards).
      const genEl = document.getElementById('genKit');
      if (genEl) genEl.onchange = () => setGenerate(c, genEl.checked);
      // D-063: the captions toggle. Same shape as the generate toggle and for
      // the same reasons — intent only, fires no render, live in every state.
      const capEl = document.getElementById('burnCaps');
      if (capEl) capEl.onchange = () => setCaptions(c, capEl.checked);
      if (editable) {
        detailEl.querySelectorAll('.nudge').forEach((btn) => {
          btn.onclick = () => nudgeWindow(btn.dataset.field, Number(btn.dataset.delta));
        });
        const saveWinBtn = document.getElementById('btnSaveWin');
        if (saveWinBtn) saveWinBtn.onclick = () => saveWindow();
        const resetBtn = document.getElementById('btnResetWin');
        if (resetBtn) resetBtn.onclick = () => resetWindow();
      }
      const rerenderInlineBtn = document.getElementById('btnRerenderInline');
      if (rerenderInlineBtn) rerenderInlineBtn.onclick = () => rerenderClip(c, rerenderInlineBtn);
      wireSlider(c, editable);
      // Drafts persist across card navigation — returning to a card with
      // unsaved edits must re-lock its verdict buttons (D-055 fixer, gate 17).
      updateVerdictLock(c);
    }

    // Wires the trim slider's drag/keyboard interaction and the video's
    // duration-clamp + playhead tracking. Duration clamp and playhead
    // tracking are wired even when NOT editable (a locked card still shows
    // a live playhead while previewing) -- only handle/region drag and
    // keyboard nudging are gated on editable, matching the server's own gate.
    function wireSlider(c, editable) {
      const sliderEl = document.getElementById('trimSlider');
      const vid = document.getElementById('vid');
      if (!vid) return;

      // Duration clamp: re-derive slice bounds once real metadata is known,
      // mirroring slice_geometry.slice_end()'s duration clamp (sliceBounds()
      // above applies it the same way; null-guarded until this fires).
      vid.addEventListener('loadedmetadata', () => {
        if (isFinite(vid.duration)) {
          sliderVideoDuration = vid.duration;
          renderSliderPositions(c);
        }
      }, { once: true });

      let dragTarget = null; // 'start' | 'end' | 'region' | 'playhead'

      // Shared sync: paints the tracker from the video's OWN authoritative
      // currentTime and re-checks the snap-chip visibility, gated on
      // not-mid-drag (a live pointer-capture drag already drives the tracker
      // itself via applyDraft/the region-move handler, so this must not
      // fight it). Reused by timeupdate, the rAF tick below, and the
      // pause-accurate sync that follows -- one code path, one behaviour.
      const syncPlayheadFromVideo = () => {
        if (dragTarget !== null) return;
        renderPlayheadPosition(c, vid.currentTime);
        updateSnapAffordance(c);
      };
      vid.addEventListener('timeupdate', syncPlayheadFromVideo);
      // D-073 perf gate (charter §19 / spec constraint 3): exactly one rAF
      // loop while the video is PLAYING, started on 'play' and cancelled on
      // 'pause'/'ended' -- never a persistent idle loop.
      let rafId = null;
      const tick = () => {
        syncPlayheadFromVideo();
        rafId = requestAnimationFrame(tick);
      };
      vid.addEventListener('play', () => {
        if (rafId === null) rafId = requestAnimationFrame(tick);
        updateSnapAffordance(c); // hides the chip the instant playback resumes
      });
      const stopTick = () => { if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } };
      // Pause-accurate playhead (operator ask, 2026-08-08): the rAF loop
      // stops on pause, so its last painted frame can be up to one frame
      // stale relative to the exact paused currentTime. 'pause' forces one
      // final sync BEFORE the loop is torn down; 'seeked' covers a seek that
      // lands while already paused (including scrubbing via the native
      // controls, which fires 'seeked'/'timeupdate' but never 'play') -- so
      // the tracker always lands on the exact paused frame.
      vid.addEventListener('pause', () => { syncPlayheadFromVideo(); stopTick(); });
      vid.addEventListener('seeked', syncPlayheadFromVideo);
      vid.addEventListener('ended', stopTick);

      if (!sliderEl || !editable) return; // disabled visual state only, no drag/keyboard wired

      const handleIn = document.getElementById('handleIn');
      const handleOut = document.getElementById('handleOut');
      const region = document.getElementById('trimRegion');
      const playhead = document.getElementById('trimPlayhead');
      let regionDragOffset = 0;

      function applyDraft(next, edgeMoved) {
        const draft = clampWindowDraft(next, c, edgeMoved);
        drafts[c.id] = draft;
        if (edgeMoved === 'start') vid.currentTime = draft.start;
        else if (edgeMoved === 'end') vid.currentTime = draft.end;
        renderSliderPositions(c);
        renderPlayheadPosition(c, vid.currentTime);
        updateVerdictLock(c);
      }

      function endDrag() {
        const wasDragging = dragTarget !== null && dragTarget !== 'playhead';
        dragTarget = null;
        sliderDragActive = false;
        // Release -> loop-preview (spec section 2): replayWindow() already
        // plays editorValues() in->out and pauses at out, exactly this.
        if (wasDragging) replayWindow();
      }

      if (handleIn) {
        handleIn.addEventListener('pointerdown', (e) => {
          dragTarget = 'start'; sliderDragActive = true;
          try { handleIn.setPointerCapture(e.pointerId); } catch (_) {}
        });
        handleIn.addEventListener('pointermove', (e) => {
          if (dragTarget !== 'start') return;
          const { lo, hi } = sliceBounds(c);
          const secs = secondsFromClientX(e.clientX, sliderEl, lo, hi);
          const cur = editorValues(c);
          applyDraft({ start: secs, end: cur.end }, 'start');
        });
        handleIn.addEventListener('pointerup', endDrag);
        handleIn.addEventListener('pointercancel', endDrag);
        handleIn.addEventListener('keydown', (e) => {
          if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
          e.preventDefault();
          const step = e.shiftKey ? 1.0 : 0.1;
          const cur = editorValues(c);
          const delta = e.key === 'ArrowLeft' ? -step : step;
          applyDraft({ start: cur.start + delta, end: cur.end }, 'start');
        });
      }
      if (handleOut) {
        handleOut.addEventListener('pointerdown', (e) => {
          dragTarget = 'end'; sliderDragActive = true;
          try { handleOut.setPointerCapture(e.pointerId); } catch (_) {}
        });
        handleOut.addEventListener('pointermove', (e) => {
          if (dragTarget !== 'end') return;
          const { lo, hi } = sliceBounds(c);
          const secs = secondsFromClientX(e.clientX, sliderEl, lo, hi);
          const cur = editorValues(c);
          applyDraft({ start: cur.start, end: secs }, 'end');
        });
        handleOut.addEventListener('pointerup', endDrag);
        handleOut.addEventListener('pointercancel', endDrag);
        handleOut.addEventListener('keydown', (e) => {
          if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
          e.preventDefault();
          const step = e.shiftKey ? 1.0 : 0.1;
          const cur = editorValues(c);
          const delta = e.key === 'ArrowLeft' ? -step : step;
          applyDraft({ start: cur.start, end: cur.end + delta }, 'end');
        });
      }
      if (region) {
        region.addEventListener('pointerdown', (e) => {
          dragTarget = 'region'; sliderDragActive = true;
          const { lo, hi } = sliceBounds(c);
          const cur = editorValues(c);
          regionDragOffset = secondsFromClientX(e.clientX, sliderEl, lo, hi) - cur.start;
          try { region.setPointerCapture(e.pointerId); } catch (_) {}
        });
        region.addEventListener('pointermove', (e) => {
          if (dragTarget !== 'region') return;
          const { lo, hi } = sliceBounds(c);
          const cur = editorValues(c);
          const durSecs = cur.end - cur.start;
          let newStart = secondsFromClientX(e.clientX, sliderEl, lo, hi) - regionDragOffset;
          newStart = Math.max(lo, Math.min(hi - durSecs, newStart));
          newStart = Math.round(newStart * 10) / 10;
          drafts[c.id] = { start: newStart, end: Math.round((newStart + durSecs) * 10) / 10 };
          vid.currentTime = newStart;
          renderSliderPositions(c);
          renderPlayheadPosition(c, vid.currentTime);
          updateVerdictLock(c);
        });
        region.addEventListener('pointerup', endDrag);
        region.addEventListener('pointercancel', endDrag);
      }
      if (playhead) {
        playhead.addEventListener('pointerdown', (e) => {
          dragTarget = 'playhead'; sliderDragActive = true;
          try { playhead.setPointerCapture(e.pointerId); } catch (_) {}
        });
        playhead.addEventListener('pointermove', (e) => {
          if (dragTarget !== 'playhead') return;
          const { lo, hi } = sliceBounds(c);
          const secs = secondsFromClientX(e.clientX, sliderEl, lo, hi);
          vid.currentTime = secs;
          renderPlayheadPosition(c, secs);
        });
        const endPlayheadDrag = () => { dragTarget = null; sliderDragActive = false; };
        playhead.addEventListener('pointerup', endPlayheadDrag);
        playhead.addEventListener('pointercancel', endPlayheadDrag);
      }
      const snapBtn = document.getElementById('btnSnapStart');
      if (snapBtn) snapBtn.onclick = () => moveWindowToPlayhead(c);
    }

    // I/O (editor convention): set in/out at the CURRENT playhead position.
    // Wired from the global keydown map, guarded there to non-kit views,
    // not-typing-in-a-field, and an editable (non-approved) candidate.
    function setInOutAtPlayhead(edge) {
      if (!candidates.length) return;
      const c = candidates[idx];
      if (!c || c.state === 'approved') return;
      const vid = document.getElementById('vid');
      if (!vid) return;
      const cur = editorValues(c);
      const next = edge === 'start' ? { start: vid.currentTime, end: cur.end } : { start: cur.start, end: vid.currentTime };
      drafts[c.id] = clampWindowDraft(next, c, edge);
      renderSliderPositions(c);
      updateVerdictLock(c);
    }

    // Snap chip visibility (operator ask, 2026-08-08, simplest rule as
    // specified): visible whenever the video is PAUSED and the playhead
    // sits anywhere other than the current region start. Reads the video
    // and the region start fresh each call rather than caching either, so
    // it never goes stale relative to whichever draft/playhead event fired.
    function updateSnapAffordance(c) {
      const btn = document.getElementById('btnSnapStart');
      if (!btn) return;
      const vid = document.getElementById('vid');
      if (!vid) { btn.style.display = 'none'; return; }
      const ed = editorValues(c);
      const show = vid.paused && Math.abs(vid.currentTime - ed.start) > 0.05;
      btn.style.display = show ? 'inline-flex' : 'none';
    }

    // The snap chip's action -- the one-click version of "drag the section
    // picked to there". Moves the WHOLE region (both edges together, same
    // shape as the region-drag pointermove handler above) so the new start
    // sits exactly at the paused playhead, preserving the current duration
    // rather than just relocating the start edge. Clamped to the slice
    // bounds the same way the region drag is. Writes the identical
    // drafts[c.id] = {start, end} shape every other window mutation writes,
    // so Save's payload is unchanged in form regardless of how the draft
    // was produced.
    function moveWindowToPlayhead(c) {
      const vid = document.getElementById('vid');
      if (!vid) return;
      const { lo, hi } = sliceBounds(c);
      const cur = editorValues(c);
      const durSecs = cur.end - cur.start;
      let newStart = Math.max(lo, Math.min(hi - durSecs, vid.currentTime));
      newStart = Math.round(newStart * 10) / 10;
      drafts[c.id] = { start: newStart, end: Math.round((newStart + durSecs) * 10) / 10 };
      renderSliderPositions(c);
      renderPlayheadPosition(c, vid.currentTime);
      updateVerdictLock(c);
    }

    // D-055 fixer (charter gate 17: a ruling binds to what was DISPLAYED):
    // while a candidate has UNSAVED window edits, every verdict action on it
    // is blocked — buttons disabled with a visible hint, and the a/r/m keys
    // inert via the same hasUnsaved() guard in decide(). Replay stays live so
    // the operator can preview before saving. No modal dialogs.
    function updateVerdictLock(c) {
      // D-056: approved (awaiting-delivery) cards are verdict-locked too —
      // approved is terminal (D-050), the delivery badge explains why. The
      // "save or reset" hint shows only for the unsaved-edit lock.
      // B6 fixer: decideInFlight locks the same buttons for the span of one
      // in-flight verdict request — no dedicated hint text (the lock clears
      // the moment the response lands, too brief to explain).
      const unsaved = hasUnsaved(c);
      const locked = unsaved || c.state === 'approved' || decideInFlight;
      for (const id of ['btnApprove', 'btnReject', 'btnMaybe']) {
        const b = document.getElementById(id);
        if (b) b.disabled = locked;
      }
      const lockEl = document.getElementById('verdictLock');
      if (lockEl) lockEl.style.display = unsaved ? 'inline' : 'none';
    }

    // D-055: nudges edit LOCAL (unsaved) state only; Save persists. The spans
    // are updated in place so the video element is not reloaded per nudge.
    // UNCHANGED behaviour: this fallback path is deliberately NOT clamped to
    // the slice (unlike the slider's own drag math) -- an out-of-slice
    // numeric edit is legal (D-055: it fails loud at render and falls back
    // to the Mac deliverer), so "unifying" validation here would remove a
    // capability rather than reskin one.
    function nudgeWindow(field, delta) {
      if (!candidates.length) return;
      const c = candidates[idx];
      const cur = editorValues(c);
      const next = { start: cur.start, end: cur.end };
      next[field] = Math.round((next[field] + delta) * 1000) / 1000;
      if (field === 'start') next.start = Math.max(0, next.start);
      drafts[c.id] = next;
      // D-073: repaints the slider handles/region/duration chip too, since
      // they read the identical draft state (renderSliderPositions() also
      // covers the valStart/valEnd spans and the Save/unsaved chips this
      // function used to update directly).
      renderSliderPositions(c);
      // Nudges update in place (no re-render, so the video does not reload) —
      // the verdict lock must follow the draft state in place too.
      updateVerdictLock(c);
    }

    // Replay plays across the CURRENT effective window — including unsaved
    // nudges, so the operator previews before saving. Our timeupdate handler
    // owns the stop (the #t fragment end is not assumed to do it).
    function replayWindow() {
      if (!candidates.length) return;
      const c = candidates[idx];
      const ed = editorValues(c);
      const v = document.getElementById('vid');
      if (!v) return;
      v.currentTime = ed.start;
      v.ontimeupdate = () => {
        if (v.currentTime >= ed.end) {
          v.pause();
          v.ontimeupdate = null;
        }
      };
      v.play();
    }

    // D-056 fixer (poll/verdict splice race). EVERY mutation of `candidates`
    // that runs AFTER an await must locate its row by IDENTITY, never by an
    // index captured before the await. The 15s pollRefresh can land mid-flight
    // — the verdict response is held open by the synchronous delivery-webhook
    // fire, so the window is wide — and it REPLACES the array, so a captured
    // `idx` can be pointing at a different card by the time the continuation
    // runs. Splicing that index removed the WRONG card and showed another
    // card's detail. (Same bug in the pre-existing two-rapid-verdicts case.)
    // Returns -1 when the row is already gone from the current queue; callers
    // then leave the array alone and just re-render.
    function indexOfRow(id) {
      return candidates.findIndex((x) => x.id === id);
    }

    async function postWindow(c, startVal, endVal) {
      let res;
      try {
        res = await fetch(`/api/candidates/${c.id}/window`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start_s: startVal, end_s: endVal }),
        });
      } catch (err) {
        notify('Could not reach the server to save the window. Check your connection and try again.', { technical: String(err) });
        return null;
      }
      if (!res.ok) {
        let body = '';
        try { body = JSON.stringify(await res.json()); } catch (_) {}
        notify('The window save was refused.', { technical: `${res.status} ${body}` });
        return null;
      }
      return res.json();
    }

    async function saveWindow() {
      if (!candidates.length) return;
      const c = candidates[idx];
      const ed = editorValues(c);
      gen += 1;
      const row = await postWindow(c, ed.start, ed.end);
      if (!row) return;
      // Post-await: locate by identity, never by the captured idx.
      delete drafts[row.id];
      const j = indexOfRow(row.id);
      if (j !== -1) {
        candidates[j] = row;
        idx = j;
      }
      renderList();
      renderDetail();
    }

    async function resetWindow() {
      if (!candidates.length) return;
      const c = candidates[idx];
      gen += 1;
      const row = await postWindow(c, null, null);
      if (!row) return;
      // Post-await: locate by identity, never by the captured idx.
      delete drafts[row.id];
      const j = indexOfRow(row.id);
      if (j !== -1) {
        candidates[j] = row;
        idx = j;
      }
      renderList();
      renderDetail();
    }

    async function decide(action) {
      if (!candidates.length) return;
      // B6 fixer: a decide() already in flight owns the verdict buttons —
      // a second invocation (fast double-click, or a key held down faster
      // than the network round trip) returns immediately rather than firing
      // a second request. Checked before the pendingIntentSave await too, so
      // a rapid double-invoke can never both reach the fetch below.
      if (decideInFlight) return;
      // D-063 fixer: let any in-flight captions toggle land first, so the
      // verdict (and the delivery webhook it fires) always sees the flag the
      // operator just set. The rejection is swallowed on purpose: setCaptions
      // has already alerted, and a failed toggle must not also swallow the
      // verdict keystroke.
      if (pendingIntentSave) {
        try { await pendingIntentSave; } catch (_) { /* already surfaced */ }
      }
      // Re-read after the await: setCaptions replaces the row object in place.
      if (!candidates.length) return;
      const c = candidates[idx];
      if (!c) return;
      // D-056: approved (awaiting-delivery) cards are verdict-locked — covers
      // the a/r/m keys; the buttons are already disabled (server 409s anyway).
      if (c.state === 'approved') return;
      // D-055 fixer (gate 17): unsaved window edits block every verdict —
      // this single guard covers both the buttons and the a/r/m keys.
      if (hasUnsaved(c)) {
        updateVerdictLock(c);
        return;
      }
      gen += 1; // invalidate any in-flight poll result
      // B6 fixer: set before the fetch, cleared in finally below — the entire
      // rest of this function (including every early-return branch) runs with
      // the verdict buttons disabled, and updateVerdictLock() re-evaluates
      // them (folding decideInFlight back in) the moment it clears.
      decideInFlight = true;
      updateVerdictLock(c);
      try {
        let res;
        try {
          res = await fetch(`/api/candidates/${c.id}/${action}`, { method: 'POST' });
        } catch (err) {
          // F6 fixer: a dead server used to leave this unhandled — the promise
          // rejected, nothing alerted, and pressing approve/reject/maybe did
          // nothing the operator could see.
          notify('Could not reach the server to record your decision.', { technical: String(err) });
          return;
        }
        if (!res.ok) {
          let body = '';
          try { body = JSON.stringify(await res.json()); } catch (_) {}
          notify('The server refused this decision.', { technical: `${res.status} ${body}` });
          return;
        }
        delete drafts[c.id];
        // Post-await: locate by identity, never by the captured idx. -1 means a
        // poll already removed the card — nothing left to splice/replace.
        const spliceOut = () => {
          const j = indexOfRow(c.id);
          if (j !== -1) {
            candidates.splice(j, 1);
            idx = j;
            if (idx >= candidates.length) idx = Math.max(0, candidates.length - 1);
          }
        };
        if (action === 'approve') {
          // The verdict response carries the delivery-webhook outcome for an
          // approve (D-053/D-056), regardless of which view triggered it. Parse
          // it here, unconditionally, so approve-from-maybe/rejected does not
          // discard the outcome just because this view splices the card out —
          // webhookFlags carries it forward to wherever the card next renders.
          let row = null;
          try { row = await res.json(); } catch (_) {}
          if (!row || typeof row !== 'object' || row.id === null || row.id === undefined) {
            // D-056 fixer: the verdict LANDED (res.ok) but its body did not
            // parse. Falling back to the stale pre-verdict object left the card
            // rendering as state 'candidate' — editable, verdict buttons live —
            // until the next poll, i.e. the UI showing a candidate the server
            // has already approved. Re-fetch the queue for the server's truth
            // instead of trusting the object we held before the POST.
            gen += 1;
            await loadCandidates().catch((err) => {
              detailEl.innerHTML = rawLoadErrorHtml(err);
            });
            return;
          }
          const wh = row.webhook;
          delete row.webhook;
          if (wh === 'failed' || wh === 'unconfigured') webhookFlags[row.id] = wh;
          else delete webhookFlags[row.id];
          if (view === 'pending') {
            // D-056: an approved card STAYS in pending until the delivery
            // witness (clips.drive_synced_at) lands — replace it in place with
            // the server's updated row.
            applyWebhookFlag(row);
            const j = indexOfRow(c.id);
            if (j !== -1) {
              candidates[j] = row;
              idx = j;
            }
          } else {
            // Approved from maybe/rejected: the card leaves THIS view's list.
            // The outcome just stashed in webhookFlags above is applied by
            // loadCandidates/pollRefresh whenever the card next appears in the
            // pending queue.
            spliceOut();
          }
        } else {
          spliceOut();
        }
        renderList();
        renderDetail();
      } finally {
        // B6 fixer: cleared here on every exit path — success, an alerted
        // failure, or the D-056 fixer's early return after a re-fetch. If
        // renderDetail() ran above it already built fresh buttons (locked,
        // since decideInFlight was still true at that point); re-apply the
        // lock for whichever candidate is now selected so it reflects the
        // flag's TRUE post-decide value.
        decideInFlight = false;
        const cur = candidates.length ? candidates[idx] : null;
        if (cur) updateVerdictLock(cur);
      }
    }

    function move(delta) {
      if (!candidates.length) return;
      idx = Math.max(0, Math.min(candidates.length - 1, idx + delta));
      renderList();
      renderDetail();
    }

    function switchView(nextView) {
      if (view === nextView) return;
      gen += 1;
      view = nextView;
      idx = 0;
      loadCandidates().catch((err) => {
        detailEl.innerHTML = rawLoadErrorHtml(err);
      });
    }

    tabPendingEl.onclick = () => switchView('pending');
    tabMaybeEl.onclick = () => switchView('maybe');
    tabRejectedEl.onclick = () => switchView('rejected');
    tabDeliveredEl.onclick = () => switchView('delivered');

    // D-056 light polling: every 15s re-fetch the current queue and reconcile
    // IN PLACE — delivered cards disappear and badges update without resetting
    // the operator's scroll position, selected card, or a playing video.
    const POLL_MS = 15000;

    function rowFingerprint(c) {
      // _webhook rides along deliberately: a webhook-flag change must re-render.
      return JSON.stringify(c);
    }

    function listFingerprint(list) {
      return list.map(rowFingerprint).join('\n');
    }

    async function pollRefresh() {
      const myGen = gen;
      const myView = view;
      let fresh;
      try {
        const res = await fetch(endpointForView(), { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        fresh = Array.isArray(data) ? data : [];
      } catch (_) {
        return; // background refresh only — never surface a transient fetch error
      }
      // The operator acted (verdict/save/reset/tab) while this poll was in
      // flight: discard the stale snapshot; the next tick re-fetches.
      if (myGen !== gen || myView !== view) return;
      // F6 fixer: apply the SAME persisted webhookFlags store loadCandidates
      // uses (dropped the moment a clips row appears — delivery has started,
      // flag is stale) rather than a second carry-forward that only knew
      // about flags already sitting on THIS view's in-memory rows.
      fresh.forEach(applyWebhookFlag);
      // D-073: skip the ENTIRE reconciliation while a slider drag is active —
      // not just the render. The array/idx reassignment below follows the
      // selected CARD BY ID, but a candidate that has meanwhile disappeared
      // from the fresh list (approved/rejected/removed from another session)
      // falls back to `Math.min(idx, ...)`, an ARBITRARY position -- with the
      // DOM correctly left unrendered (kitHasUnsaved/sliderDragActive already
      // guarded that), `candidates[idx]` would silently point at a DIFFERENT
      // candidate than the one on screen. That is not just a wrong preview
      // seek: saveWindow() reads candidates[idx] too, so ending the drag with
      // Save could POST the drafted window onto the wrong candidate's id. So
      // this poll simply does nothing at all while a drag is in flight; the
      // next tick (15s later, or triggered by whatever ends the drag) catches
      // up once it is safe to touch `candidates`/`idx` again.
      if (sliderDragActive) return;
      if (listFingerprint(fresh) === listFingerprint(candidates)) return; // nothing changed
      const selId = candidates.length ? candidates[idx].id : null;
      const selFp = candidates.length ? rowFingerprint(candidates[idx]) : null;
      const scrollTop = leftEl.scrollTop;
      candidates = fresh;
      // Selection follows the CARD (by id), not the index — the existing
      // click/move mechanics stay idx-based on the reconciled array.
      let newIdx = selId === null ? 0 : candidates.findIndex((c) => c.id === selId);
      if (newIdx === -1) newIdx = Math.min(idx, Math.max(0, candidates.length - 1));
      idx = newIdx;
      renderList();
      leftEl.scrollTop = scrollTop;
      const sel = candidates.length ? candidates[idx] : null;
      // Re-render the detail pane ONLY when the selected card changed identity
      // or content — an unconditional re-render would reload the <video> on
      // every poll and stop whatever the operator is watching.
      // D-061: and NEVER re-render over unsaved kit edits. A poll landing
      // mid-sentence would replace the textareas he is typing into and throw
      // his words away — the exact silent-overwrite this design forbids.
      if (sel && kitHasUnsaved(sel)) return;
      if (!sel || sel.id !== selId || rowFingerprint(sel) !== selFp) {
        renderDetail();
      }
    }

    setInterval(() => { pollRefresh(); }, POLL_MS);

    // D-061: the post kit view introduced the first EDITABLE FIELDS on this
    // surface, and the shortcut map predates them. Without this guard, typing
    // the letter "a" into a caption box would fire an approve, and "j" would
    // jump to another card and abandon the draft. The map itself is unchanged;
    // it is simply inert while the operator is typing.
    function typingInField(e) {
      const t = e.target;
      if (!t) return false;
      const tag = (t.tagName || '').toUpperCase();
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable === true;
    }

    document.addEventListener('keydown', (e) => {
      if (typingInField(e)) return;
      // B6 fixer: a held key fires a stream of keydown events with e.repeat
      // true after the first — an operator holding "a" a beat too long used
      // to queue up repeat approve keystrokes. decideInFlight (above) already
      // blocks a second in-flight verdict request, but a repeat firing AFTER
      // the first request has already completed is a second, fully separate
      // decide() call; reject every repeat here so a held key never acts more
      // than once, for any shortcut.
      if (e.repeat) return;
      if (e.key === 'ArrowDown' || e.key === 'j') {
        e.preventDefault();
        move(1);
      } else if (e.key === 'ArrowUp' || e.key === 'k') {
        e.preventDefault();
        move(-1);
      } else if (e.key === 'a') {
        e.preventDefault();
        decide('approve');
      } else if (e.key === 'r' && view !== 'rejected') {
        e.preventDefault();
        decide('reject');
      } else if (e.key === 'm' && (view === 'pending' || view === 'rejected')) {
        e.preventDefault();
        decide('maybe');
      } else if (e.key === 'x') {
        // x toggles the Rejected queue: into it from anywhere, back to Pending from it.
        e.preventDefault();
        switchView(view === 'rejected' ? 'pending' : 'rejected');
      } else if ((e.key === 'i' || e.key === 'o') && view !== 'delivered') {
        // D-073: editor convention, set in/out at the playhead. Guarded to
        // the non-kit views (the trim slider only exists there) -- editable
        // and candidate-presence are checked inside setInOutAtPlayhead.
        e.preventDefault();
        setInOutAtPlayhead(e.key === 'i' ? 'start' : 'end');
      }
    });

    loadCandidates().catch((err) => {
      detailEl.innerHTML = rawLoadErrorHtml(err);
    });
  </script>
</body>
</html>
