<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>clpr review surface</title>
  <style>
    :root {
      --bg: #111317;
      --panel: #1a1f27;
      --panel2: #232b36;
      --text: #e6edf3;
      --muted: #9aa6b2;
      --ok: #2ea043;
      --bad: #f85149;
      --maybe: #d29922;
      --accent: #58a6ff;
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif; }
    /* D-056 scroll fix: the layout is pinned to the viewport (height + an
       explicit 100% row so the single grid row cannot grow past it); each
       pane scrolls independently, so the player pane stays on screen while
       the list scrolls. The page itself never scrolls. */
    .wrap { display: grid; grid-template-columns: 380px 1fr; grid-template-rows: 100%; height: 100vh; }
    .left { border-right: 1px solid #2d333b; overflow-y: auto; }
    .right { padding: 16px; overflow-y: auto; }
    .head { position: sticky; top: 0; background: var(--panel); z-index: 2; padding: 12px; border-bottom: 1px solid #2d333b; }
    .title { margin: 0; font-size: 16px; }
    .kbd { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .list { padding: 8px; }
    .item { padding: 10px; border: 1px solid #2d333b; border-radius: 8px; margin-bottom: 8px; background: var(--panel); cursor: pointer; }
    .item.active { outline: 2px solid var(--accent); background: var(--panel2); }
    .row { display: flex; justify-content: space-between; gap: 8px; }
    .score { font-weight: 700; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .empty { padding: 12px; color: var(--muted); }
    .card { border: 1px solid #2d333b; border-radius: 10px; background: var(--panel); padding: 12px; }
    .actions { display: flex; gap: 8px; margin: 10px 0 12px; }
    .tabs { display: flex; gap: 8px; margin-top: 8px; }
    button { border: 0; padding: 8px 12px; border-radius: 8px; color: white; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .approve { background: var(--ok); }
    .reject { background: var(--bad); }
    .maybe { background: var(--maybe); }
    .tab { background: #2d333b; color: var(--text); border: 1px solid #3d444d; }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #061326; }
    .hint { color: var(--muted); font-size: 12px; }
    .editpanel { border: 1px solid #2d333b; border-radius: 8px; background: var(--panel2); padding: 10px; margin: 0 0 12px; }
    .editrow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .editrow:last-child { margin-bottom: 0; }
    .editlabel { color: var(--muted); font-size: 12px; width: 40px; }
    .editval { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 76px; text-align: center; }
    .nudge { background: #2d333b; border: 1px solid #3d444d; color: var(--text); padding: 6px 10px; font-weight: 600; }
    .replaywin { background: #2d333b; border: 1px solid #3d444d; color: var(--text); }
    .savewin { background: var(--accent); color: #061326; }
    .resetwin { background: #2d333b; border: 1px solid #3d444d; color: var(--text); }
    .badge { background: var(--maybe); color: #061326; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; vertical-align: middle; }
    .dbadge { background: var(--ok); color: #061326; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; vertical-align: middle; }
    .dbadge.warn { background: var(--bad); color: #fff; }
    .unsaved { color: var(--maybe); font-size: 12px; font-weight: 700; }
    .winline { font-size: 13px; margin: 0 0 10px; }
    .winline .orig { color: var(--muted); font-size: 12px; }
    video { width: 100%; max-height: 65vh; background: #000; border-radius: 8px; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="left">
      <div class="head">
        <h1 id="queueTitle" class="title">Pending candidates</h1>
        <div class="tabs">
          <button id="tabPending" class="tab active">Pending</button>
          <button id="tabMaybe" class="tab">Maybe</button>
          <button id="tabRejected" class="tab">Rejected</button>
        </div>
        <div class="kbd">Keys: j/k or arrows = move | a = approve | r = reject (not in Rejected) | m = maybe (Pending/Rejected) | x = toggle Rejected queue</div>
      </div>
      <div id="list" class="list"></div>
    </aside>

    <main class="right">
      <div id="detail" class="card">
        <div class="empty">Loading...</div>
      </div>
    </main>
  </div>

  <script>
    let candidates = [];
    let idx = 0;
    let view = 'pending';
    // D-056: mutation generation — bumped by every user-driven mutation so an
    // in-flight background poll can never clobber what the operator just did.
    let gen = 0;
    // D-055: local (unsaved) window edits, keyed by candidate id: {start, end}.
    // A draft exists only while nudged-but-not-saved; Save/Reset clears it.
    const drafts = {};

    const listEl = document.getElementById('list');
    const leftEl = document.querySelector('.left');
    const detailEl = document.getElementById('detail');
    const queueTitleEl = document.getElementById('queueTitle');
    const tabPendingEl = document.getElementById('tabPending');
    const tabMaybeEl = document.getElementById('tabMaybe');
    const tabRejectedEl = document.getElementById('tabRejected');

    function fmt(v, n = 3) {
      if (v === null || v === undefined) return 'null';
      if (typeof v === 'number') return v.toFixed(n);
      return String(v);
    }

    // D-055 window helpers. EFFECTIVE window = COALESCE(adjusted, original);
    // originals are immutable and only ever shown for reference.
    function hasAdjustment(c) {
      return (c.adjusted_start_s !== null && c.adjusted_start_s !== undefined)
          || (c.adjusted_end_s !== null && c.adjusted_end_s !== undefined);
    }

    function effectiveWindow(c) {
      return {
        start: (c.adjusted_start_s ?? c.start_s),
        end: (c.adjusted_end_s ?? c.end_s),
      };
    }

    function adjustedDiffers(c) {
      if (!hasAdjustment(c)) return false;
      const eff = effectiveWindow(c);
      return eff.start !== c.start_s || eff.end !== c.end_s;
    }

    // The editor's current values: the unsaved draft when one exists,
    // else the saved effective window.
    function editorValues(c) {
      const d = drafts[c.id];
      if (d) return { start: d.start, end: d.end };
      return effectiveWindow(c);
    }

    function hasUnsaved(c) {
      const d = drafts[c.id];
      if (!d) return false;
      const eff = effectiveWindow(c);
      return d.start !== eff.start || d.end !== eff.end;
    }

    // D-056: pending now carries approved-but-undelivered cards (the server
    // keeps them in the pending payload until a clips row gains drive_synced_at,
    // the delivery witness). The badge keys on clip_state/drive_synced_at plus
    // the local-only _webhook flag decide() sets when the verdict response
    // reported the delivery webhook failed/unconfigured. Precedence: a clips
    // row means delivery has started, so it outranks a stale webhook flag.
    // D-056 fixer (charter under-claim default): the badge NEVER asserts an
    // upload is in progress — nothing in the payload witnesses a running
    // upload. A clips row only proves the render lane reached this candidate,
    // so report the clip_state itself: 'rendered' means the file exists and
    // delivery has not been witnessed yet ("awaiting upload"), and any other
    // clip_state is reported verbatim rather than narrated. The old text
    // ("APPROVED — {clip_state} — uploading") over-claimed in both
    // directions: 'published — uploading' was incoherent, and 'rendered —
    // uploading' asserted an upload nobody had observed.
    function deliveryBadge(c) {
      if (c.state !== 'approved') return '';
      if (c.clip_state !== null && c.clip_state !== undefined) {
        if (c.clip_state === 'rendered') return 'rendered — awaiting upload';
        return `approved — ${c.clip_state}`;
      }
      if (c._webhook === 'failed') return 'delivery not started — webhook failed';
      if (c._webhook === 'unconfigured') return 'delivery not started — webhook unconfigured';
      return 'approved — awaiting delivery';
    }

    function deliveryBadgeHtml(c) {
      const text = deliveryBadge(c);
      if (!text) return '';
      const warn = text.startsWith('delivery not started');
      return `<span class="dbadge${warn ? ' warn' : ''}">${text}</span>`;
    }

    function endpointForView() {
      if (view === 'maybe') return '/api/candidates/maybe';
      if (view === 'rejected') return '/api/candidates/rejected';
      return '/api/candidates';
    }

    function titleForView() {
      if (view === 'maybe') return 'Maybe candidates';
      if (view === 'rejected') return 'Rejected candidates';
      return 'Pending candidates';
    }

    function labelForView() {
      if (view === 'maybe') return 'maybe';
      if (view === 'rejected') return 'rejected';
      return 'pending';
    }

    async function loadCandidates() {
      const res = await fetch(endpointForView(), { cache: 'no-store' });
      const data = await res.json();
      candidates = Array.isArray(data) ? data : [];
      if (idx >= candidates.length) idx = Math.max(0, candidates.length - 1);
      renderTabs();
      renderList();
      renderDetail();
    }

    function renderTabs() {
      queueTitleEl.textContent = titleForView();
      tabPendingEl.classList.toggle('active', view === 'pending');
      tabMaybeEl.classList.toggle('active', view === 'maybe');
      tabRejectedEl.classList.toggle('active', view === 'rejected');
    }

    function renderList() {
      listEl.innerHTML = '';
      if (!candidates.length) {
        listEl.innerHTML = `<div class="empty">No ${labelForView()} candidates.</div>`;
        return;
      }
      candidates.forEach((c, i) => {
        const el = document.createElement('div');
        el.className = 'item' + (i === idx ? ' active' : '');
        el.onclick = () => { idx = i; renderList(); renderDetail(); };
        el.innerHTML = `
          <div class="row">
            <div>#${c.id} | vod ${c.vod_id}</div>
            <div class="score">${fmt(c.score)}</div>
          </div>
          <div class="meta">${c.session_label} | ${fmt(effectiveWindow(c).start,1)}s to ${fmt(effectiveWindow(c).end,1)}s${adjustedDiffers(c) ? ' | edited' : ''}</div>
          <div class="meta">audio ${fmt(c.signal_audio)} | transcript ${fmt(c.signal_transcript)} | chat ${fmt(c.signal_chat)} | beat ${fmt(c.signal_beat_boost)}</div>
          ${deliveryBadgeHtml(c) ? `<div class="meta">${deliveryBadgeHtml(c)}</div>` : ''}
        `;
        listEl.appendChild(el);
      });
    }

    function renderDetail() {
      if (!candidates.length) {
        detailEl.innerHTML = `<div class="empty">No ${labelForView()} candidates.</div>`;
        return;
      }
      const c = candidates[idx];
      // D-055: the video fragment and the window display use the EFFECTIVE
      // (saved) window — adjusted else original. Originals stay for reference.
      const eff = effectiveWindow(c);
      const edited = adjustedDiffers(c);
      const ed = editorValues(c);
      // D-056: pending now really does carry approved (awaiting-delivery)
      // cards, so this check is live routing, not just a backstop: approved
      // cards get no edit panel and locked verdict buttons (the server 409s
      // both anyway). Replay stays available via the replay-only panel below.
      const editable = c.state !== 'approved';
      const videoSrc = `/media/${c.vod_id}#t=${encodeURIComponent(eff.start)},${encodeURIComponent(eff.end)}`;
      const nudges = (field) => ['-5', '-1', '+1', '+5'].map((d) =>
        `<button class="nudge" data-field="${field}" data-delta="${d}">${d}s</button>`
      );
      const editPanel = !editable ? '' : `
        <div class="editpanel">
          <div class="editrow">
            <span class="editlabel">start</span>
            ${nudges('start')[0]}${nudges('start')[1]}
            <span class="editval" id="valStart">${fmt(ed.start, 1)}s</span>
            ${nudges('start')[2]}${nudges('start')[3]}
          </div>
          <div class="editrow">
            <span class="editlabel">end</span>
            ${nudges('end')[0]}${nudges('end')[1]}
            <span class="editval" id="valEnd">${fmt(ed.end, 1)}s</span>
            ${nudges('end')[2]}${nudges('end')[3]}
          </div>
          <div class="editrow">
            <button class="replaywin" id="btnReplay">Replay</button>
            <button class="savewin" id="btnSaveWin">Save</button>
            ${hasAdjustment(c) ? '<button class="resetwin" id="btnResetWin">Reset</button>' : ''}
            <span class="unsaved" id="unsavedFlag" style="display:${hasUnsaved(c) ? 'inline' : 'none'};">unsaved</span>
          </div>
        </div>`;
      // D-056: approved (awaiting-delivery) cards keep Replay — the one edit
      // control that stays live — in a reduced panel; nudges/Save/Reset are gone.
      const replayPanel = editable ? '' : `
        <div class="editpanel">
          <div class="editrow">
            <button class="replaywin" id="btnReplay">Replay</button>
            <span class="hint">window locked — approved</span>
          </div>
        </div>`;
      // Action buttons per queue (D-050 upgrade paths):
      // pending: Approve/Reject/Maybe | maybe: Approve/Reject | rejected: Approve/Maybe
      detailEl.innerHTML = `
        <h2 style="margin:0 0 8px;">Candidate #${c.id}</h2>
        <div class="hint">session ${c.session_label} | vod ${c.vod_id}</div>
        <div class="hint">${c.vod_path}</div>
        <div class="winline">window ${fmt(eff.start, 1)}s to ${fmt(eff.end, 1)}s
          ${edited ? '<span class="badge">edited</span>' : ''}
          ${edited ? `<span class="orig">(original ${fmt(c.start_s, 1)}s to ${fmt(c.end_s, 1)}s)</span>` : ''}
          ${deliveryBadgeHtml(c)}
        </div>
        <div class="actions">
          <button class="approve" id="btnApprove">Approve (a)</button>
          ${view !== 'rejected' ? '<button class="reject" id="btnReject">Reject (r)</button>' : ''}
          ${view === 'pending' || view === 'rejected' ? '<button class="maybe" id="btnMaybe">Maybe (m)</button>' : ''}
          <span class="hint" id="verdictLock" style="display:none;">save or reset the window first</span>
        </div>
        ${editPanel}${replayPanel}
        <video id="vid" controls preload="metadata" src="${videoSrc}"></video>
        <pre>score=${fmt(c.score)}\naudio=${fmt(c.signal_audio)} transcript=${fmt(c.signal_transcript)} chat=${fmt(c.signal_chat)} beat_boost=${fmt(c.signal_beat_boost)}\ncreated_at=${c.created_at}</pre>
      `;
      document.getElementById('btnApprove').onclick = () => decide('approve');
      const rejectBtn = document.getElementById('btnReject');
      if (rejectBtn) rejectBtn.onclick = () => decide('reject');
      const maybeBtn = document.getElementById('btnMaybe');
      if (maybeBtn) maybeBtn.onclick = () => decide('maybe');
      // Replay exists in BOTH panels (edit panel and the locked replay-only
      // panel), so it is wired outside the editable branch.
      const replayBtn = document.getElementById('btnReplay');
      if (replayBtn) replayBtn.onclick = () => replayWindow();
      if (editable) {
        detailEl.querySelectorAll('.nudge').forEach((btn) => {
          btn.onclick = () => nudgeWindow(btn.dataset.field, Number(btn.dataset.delta));
        });
        document.getElementById('btnSaveWin').onclick = () => saveWindow();
        const resetBtn = document.getElementById('btnResetWin');
        if (resetBtn) resetBtn.onclick = () => resetWindow();
      }
      // Drafts persist across card navigation — returning to a card with
      // unsaved edits must re-lock its verdict buttons (D-055 fixer, gate 17).
      updateVerdictLock(c);
    }

    // D-055 fixer (charter gate 17: a ruling binds to what was DISPLAYED):
    // while a candidate has UNSAVED window edits, every verdict action on it
    // is blocked — buttons disabled with a visible hint, and the a/r/m keys
    // inert via the same hasUnsaved() guard in decide(). Replay stays live so
    // the operator can preview before saving. No modal dialogs.
    function updateVerdictLock(c) {
      // D-056: approved (awaiting-delivery) cards are verdict-locked too —
      // approved is terminal (D-050), the delivery badge explains why. The
      // "save or reset" hint shows only for the unsaved-edit lock.
      const unsaved = hasUnsaved(c);
      const locked = unsaved || c.state === 'approved';
      for (const id of ['btnApprove', 'btnReject', 'btnMaybe']) {
        const b = document.getElementById(id);
        if (b) b.disabled = locked;
      }
      const lockEl = document.getElementById('verdictLock');
      if (lockEl) lockEl.style.display = unsaved ? 'inline' : 'none';
    }

    // D-055: nudges edit LOCAL (unsaved) state only; Save persists. The spans
    // are updated in place so the video element is not reloaded per nudge.
    function nudgeWindow(field, delta) {
      if (!candidates.length) return;
      const c = candidates[idx];
      const cur = editorValues(c);
      const next = { start: cur.start, end: cur.end };
      next[field] = Math.round((next[field] + delta) * 1000) / 1000;
      if (field === 'start') next.start = Math.max(0, next.start);
      drafts[c.id] = next;
      const valEl = document.getElementById(field === 'start' ? 'valStart' : 'valEnd');
      if (valEl) valEl.textContent = `${fmt(next[field], 1)}s`;
      const flag = document.getElementById('unsavedFlag');
      if (flag) flag.style.display = hasUnsaved(c) ? 'inline' : 'none';
      // Nudges update in place (no re-render, so the video does not reload) —
      // the verdict lock must follow the draft state in place too.
      updateVerdictLock(c);
    }

    // Replay plays across the CURRENT effective window — including unsaved
    // nudges, so the operator previews before saving. Our timeupdate handler
    // owns the stop (the #t fragment end is not assumed to do it).
    function replayWindow() {
      if (!candidates.length) return;
      const c = candidates[idx];
      const ed = editorValues(c);
      const v = document.getElementById('vid');
      if (!v) return;
      v.currentTime = ed.start;
      v.ontimeupdate = () => {
        if (v.currentTime >= ed.end) {
          v.pause();
          v.ontimeupdate = null;
        }
      };
      v.play();
    }

    // D-056 fixer (poll/verdict splice race). EVERY mutation of `candidates`
    // that runs AFTER an await must locate its row by IDENTITY, never by an
    // index captured before the await. The 15s pollRefresh can land mid-flight
    // — the verdict response is held open by the synchronous delivery-webhook
    // fire, so the window is wide — and it REPLACES the array, so a captured
    // `idx` can be pointing at a different card by the time the continuation
    // runs. Splicing that index removed the WRONG card and showed another
    // card's detail. (Same bug in the pre-existing two-rapid-verdicts case.)
    // Returns -1 when the row is already gone from the current queue; callers
    // then leave the array alone and just re-render.
    function indexOfRow(id) {
      return candidates.findIndex((x) => x.id === id);
    }

    async function postWindow(c, startVal, endVal) {
      const res = await fetch(`/api/candidates/${c.id}/window`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ start_s: startVal, end_s: endVal }),
      });
      if (!res.ok) {
        let body = '';
        try { body = JSON.stringify(await res.json()); } catch (_) {}
        alert(`Failed: ${res.status} ${body}`);
        return null;
      }
      return res.json();
    }

    async function saveWindow() {
      if (!candidates.length) return;
      const c = candidates[idx];
      const ed = editorValues(c);
      gen += 1;
      const row = await postWindow(c, ed.start, ed.end);
      if (!row) return;
      // Post-await: locate by identity, never by the captured idx.
      delete drafts[row.id];
      const j = indexOfRow(row.id);
      if (j !== -1) {
        candidates[j] = row;
        idx = j;
      }
      renderList();
      renderDetail();
    }

    async function resetWindow() {
      if (!candidates.length) return;
      const c = candidates[idx];
      gen += 1;
      const row = await postWindow(c, null, null);
      if (!row) return;
      // Post-await: locate by identity, never by the captured idx.
      delete drafts[row.id];
      const j = indexOfRow(row.id);
      if (j !== -1) {
        candidates[j] = row;
        idx = j;
      }
      renderList();
      renderDetail();
    }

    async function decide(action) {
      if (!candidates.length) return;
      const c = candidates[idx];
      // D-056: approved (awaiting-delivery) cards are verdict-locked — covers
      // the a/r/m keys; the buttons are already disabled (server 409s anyway).
      if (c.state === 'approved') return;
      // D-055 fixer (gate 17): unsaved window edits block every verdict —
      // this single guard covers both the buttons and the a/r/m keys.
      if (hasUnsaved(c)) {
        updateVerdictLock(c);
        return;
      }
      gen += 1; // invalidate any in-flight poll result
      const res = await fetch(`/api/candidates/${c.id}/${action}`, { method: 'POST' });
      if (!res.ok) {
        let body = '';
        try { body = JSON.stringify(await res.json()); } catch (_) {}
        alert(`Failed: ${res.status} ${body}`);
        return;
      }
      delete drafts[c.id];
      if (action === 'approve' && view === 'pending') {
        // D-056: an approved card STAYS in pending until the delivery witness
        // (clips.drive_synced_at) lands — replace it in place with the
        // server's updated row. The verdict response's webhook outcome badges
        // the card immediately when delivery will not start on its own.
        let row = null;
        try { row = await res.json(); } catch (_) {}
        if (!row || typeof row !== 'object' || row.id === null || row.id === undefined) {
          // D-056 fixer: the verdict LANDED (res.ok) but its body did not
          // parse. Falling back to the stale pre-verdict object left the card
          // rendering as state 'candidate' — editable, verdict buttons live —
          // until the next poll, i.e. the UI showing a candidate the server
          // has already approved. Re-fetch the queue for the server's truth
          // instead of trusting the object we held before the POST.
          gen += 1;
          await loadCandidates().catch((err) => {
            detailEl.innerHTML = `<pre>Failed to load candidates: ${String(err)}</pre>`;
          });
          return;
        }
        const wh = row.webhook;
        delete row.webhook;
        if (wh === 'failed' || wh === 'unconfigured') row._webhook = wh;
        // Post-await: locate by identity, never by the captured idx.
        const j = indexOfRow(c.id);
        if (j !== -1) {
          candidates[j] = row;
          idx = j;
        }
      } else {
        // Post-await: locate by identity, never by the captured idx. -1 means
        // a poll already removed the card — nothing left to splice.
        const j = indexOfRow(c.id);
        if (j !== -1) {
          candidates.splice(j, 1);
          idx = j;
          if (idx >= candidates.length) idx = Math.max(0, candidates.length - 1);
        }
      }
      renderList();
      renderDetail();
    }

    function move(delta) {
      if (!candidates.length) return;
      idx = Math.max(0, Math.min(candidates.length - 1, idx + delta));
      renderList();
      renderDetail();
    }

    function switchView(nextView) {
      if (view === nextView) return;
      gen += 1;
      view = nextView;
      idx = 0;
      loadCandidates().catch((err) => {
        detailEl.innerHTML = `<pre>Failed to load candidates: ${String(err)}</pre>`;
      });
    }

    tabPendingEl.onclick = () => switchView('pending');
    tabMaybeEl.onclick = () => switchView('maybe');
    tabRejectedEl.onclick = () => switchView('rejected');

    // D-056 light polling: every 15s re-fetch the current queue and reconcile
    // IN PLACE — delivered cards disappear and badges update without resetting
    // the operator's scroll position, selected card, or a playing video.
    const POLL_MS = 15000;

    function rowFingerprint(c) {
      // _webhook rides along deliberately: a webhook-flag change must re-render.
      return JSON.stringify(c);
    }

    function listFingerprint(list) {
      return list.map(rowFingerprint).join('\n');
    }

    async function pollRefresh() {
      const myGen = gen;
      const myView = view;
      let fresh;
      try {
        const res = await fetch(endpointForView(), { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        fresh = Array.isArray(data) ? data : [];
      } catch (_) {
        return; // background refresh only — never surface a transient fetch error
      }
      // The operator acted (verdict/save/reset/tab) while this poll was in
      // flight: discard the stale snapshot; the next tick re-fetches.
      if (myGen !== gen || myView !== view) return;
      // Carry the local-only webhook flags onto fresh rows — dropped the
      // moment a clips row appears (delivery has started, flag is stale).
      const flags = {};
      for (const c of candidates) {
        if (c._webhook) flags[c.id] = c._webhook;
      }
      for (const r of fresh) {
        if (flags[r.id] && (r.clip_state === null || r.clip_state === undefined)) {
          r._webhook = flags[r.id];
        }
      }
      if (listFingerprint(fresh) === listFingerprint(candidates)) return; // nothing changed
      const selId = candidates.length ? candidates[idx].id : null;
      const selFp = candidates.length ? rowFingerprint(candidates[idx]) : null;
      const scrollTop = leftEl.scrollTop;
      candidates = fresh;
      // Selection follows the CARD (by id), not the index — the existing
      // click/move mechanics stay idx-based on the reconciled array.
      let newIdx = selId === null ? 0 : candidates.findIndex((c) => c.id === selId);
      if (newIdx === -1) newIdx = Math.min(idx, Math.max(0, candidates.length - 1));
      idx = newIdx;
      renderList();
      leftEl.scrollTop = scrollTop;
      const sel = candidates.length ? candidates[idx] : null;
      // Re-render the detail pane ONLY when the selected card changed identity
      // or content — an unconditional re-render would reload the <video> on
      // every poll and stop whatever the operator is watching.
      if (!sel || sel.id !== selId || rowFingerprint(sel) !== selFp) {
        renderDetail();
      }
    }

    setInterval(() => { pollRefresh(); }, POLL_MS);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'j') {
        e.preventDefault();
        move(1);
      } else if (e.key === 'ArrowUp' || e.key === 'k') {
        e.preventDefault();
        move(-1);
      } else if (e.key === 'a') {
        e.preventDefault();
        decide('approve');
      } else if (e.key === 'r' && view !== 'rejected') {
        e.preventDefault();
        decide('reject');
      } else if (e.key === 'm' && (view === 'pending' || view === 'rejected')) {
        e.preventDefault();
        decide('maybe');
      } else if (e.key === 'x') {
        // x toggles the Rejected queue: into it from anywhere, back to Pending from it.
        e.preventDefault();
        switchView(view === 'rejected' ? 'pending' : 'rejected');
      }
    });

    loadCandidates().catch((err) => {
      detailEl.innerHTML = `<pre>Failed to load candidates: ${String(err)}</pre>`;
    });
  </script>
</body>
</html>
